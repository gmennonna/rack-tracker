// Chart card holding only a short explanation (used by the Rel metric).
function messageChartCard(name, text){
  const card = document.createElement('div');
  card.className = 'chart-card';
  card.innerHTML = `<div class="chart-title">${name}</div><div class="body-note">${text}</div>`;
  return card;
}

function buildChartCard(name){
  const bw = isBodyweight(name);
  const metric = METRICS[progressMetric];
  const isRel = progressMetric === 'rel';
  const valueOf = bw ? metric.bwValue : metric.value;
  const unit = bw ? 'reps' : 'kg';

  const logged = sessions
    .map(s=> ({ date: s.date, ex: s.exercises.find(e=>e.name===name) }))
    .filter(p=> p.ex);
  const points = logged
    .map(p=> ({ date: p.date, weight: valueOf(p.ex.sets, p) }))
    .filter(p=> p.weight > 0)
    .sort((a,b)=> new Date(a.date)-new Date(b.date));

  if(isRel && points.length === 0){
    if(bw) return messageChartCard(name, "Relative strength isn't available for bodyweight exercises");
    if(logged.some(p=> bestE1RM(p.ex.sets) > 0)) return messageChartCard(name, 'No sessions with a body weight reading nearby');
  }
  if(points.length===0) return null;

  const maxW = Math.max(...points.map(p=>p.weight), 1);
  const card = document.createElement('div');
  card.className = 'chart-card';
  const last8 = points.slice(-8);

  let bars = '';
  last8.forEach(p=>{
    const h = Math.max(6, (p.weight / maxW) * 100);
    const d = new Date(p.date).toLocaleDateString('en-US',{day:'numeric',month:'numeric'});
    bars += `
      <div class="bar-col">
        <div class="bar-val">${isRel ? `${p.weight.toFixed(2)}×` : p.weight}</div>
        <div class="bar" style="height:${h}%"></div>
        <div class="bar-label">${d}</div>
      </div>`;
  });

  const first = points[0].weight;
  const latest = points[points.length-1].weight;
  const diff = isRel ? Math.round((latest - first) * 100) / 100 : round1(latest - first);
  const diffText = isRel ? `${Math.abs(diff).toFixed(2)}× BW` : `${Math.abs(diff)} ${unit}`;   // "+0.08× BW", "+5 kg"
  const diffLabel = diff > 0 ? `+${diffText} since first log` : diff < 0 ? `-${diffText} since first log` : 'unchanged since first log';
  const diffClass = diff > 0 ? 'delta-up' : diff < 0 ? 'delta-down' : 'delta-flat';

  card.innerHTML = `
    <div class="chart-title">${name} — ${bw ? metric.bwTitle : metric.title}${stallBadgeHtml(stallFor(name), false)}</div>
    <div class="bars">${bars}</div>
    <div style="margin-top:14px;"><span class="delta-badge ${diffClass}">${diffLabel}</span></div>
  `;
  return card;
}

function renderChart(){
  const select = document.getElementById('exerciseSelect');
  const name = select.value || select.options[0]?.value;
  const container = document.getElementById('progressCharts');
  container.innerHTML = '';

  if(!name){
    container.innerHTML = `<div class="empty-state"><span class="big">Nothing to show yet</span>Log at least one session in the "Today" tab to see your progress here.</div>`;
    return;
  }

  if(progressMetric === 'rel' && !body.length){
    container.innerHTML = `<div class="empty-state"><span class="big">No body data</span>Import Renpho data to see relative strength</div>`;
    return;
  }

  const card = buildChartCard(name);
  if(!card){
    container.innerHTML = `<div class="empty-state"><span class="big">No data yet</span>You haven't logged any weights for this exercise yet.</div>`;
    return;
  }
  container.appendChild(card);
}

function renderDayStats(day){
  const container = document.getElementById('progressCharts');
  container.innerHTML = '';

  if(progressMetric === 'rel' && !body.length){
    container.innerHTML = `<div class="empty-state"><span class="big">No body data</span>Import Renpho data to see relative strength</div>`;
    return;
  }

  const exNames = PROGRAM[day].exercises.map(e=>e.name);
  let anyCard = false;
  exNames.forEach(name=>{
    const card = buildChartCard(name);
    if(card){ container.appendChild(card); anyCard = true; }
  });

  if(!anyCard){
    container.innerHTML = `<div class="empty-state"><span class="big">No data yet</span>You haven't logged any weights for ${PROGRAM[day].label} exercises yet.</div>`;
  }
}

/* ---------------- EXPORT REPORT ---------------- */
// Local calendar date as YYYY-MM-DD (toISOString would shift late-evening sessions to UTC).
function isoDate(d){
  d = new Date(d);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function mondayOf(d){
  const m = new Date(d);
  m.setHours(0,0,0,0);
  m.setDate(m.getDate() - (m.getDay() + 6) % 7);
  return m;
}

function fmtNum(v){
  return String(round1(v));
}

function mdCell(s){
  return String(s).replace(/\|/g, '\\|').replace(/\n/g, ' ');
}

function hasSetData(sets){
  return sets.some(s=> num(s.weight) > 0 || num(s.reps) > 0);
}

function compactSets(sets, bodyweight){
  return sets
    .filter(s=> num(s.weight) > 0 || num(s.reps) > 0)
    .map(s=>{
      const w = num(s.weight) > 0 ? fmtNum(num(s.weight)) : (bodyweight ? 'BW' : '—');
      const r = num(s.reps) > 0 ? num(s.reps) : '?';
      return `${w}×${r}`;
    })
    .join(', ');
}

function pctChange(from, to){
  if(!(from > 0)) return '';
  const p = round1((to - from) / from * 100);
  return ` (${p > 0 ? '+' : ''}${p}%)`;
}

function signed(v, unit){
  const r = round1(v);
  return `${r > 0 ? '+' : ''}${r} ${unit}`;
}

function avg(values){
  return values.length ? values.reduce((a,b)=>a+b, 0) / values.length : 0;
}

function buildReportMarkdown(){
  const sorted = [...sessions].sort((a,b)=> new Date(a.date) - new Date(b.date));
  const firstDate = new Date(sorted[0].date);
  const lastDate = new Date(sorted[sorted.length-1].date);
  const spanDays = Math.round((mondayOf(lastDate) - mondayOf(firstDate)) / 86400000);
  const weeksSpanned = spanDays / 7 + 1;
  const perWeek = round1(sorted.length / weeksSpanned);

  // Program order first, then any exercise only present in history.
  const names = allExerciseNames();
  sorted.forEach(s=> s.exercises.forEach(e=>{ if(!names.includes(e.name)) names.push(e.name); }));
  const bwByName = {};
  names.forEach(n=> bwByName[n] = isBodyweight(n));

  const L = [];
  L.push('# Rack training report', '');
  L.push(`- Generated: ${isoDate(new Date())}`);
  L.push(`- Period: ${isoDate(firstDate)} → ${isoDate(lastDate)}`);
  L.push(`- Total sessions: ${sorted.length}`);
  L.push(`- Average frequency: ${perWeek} sessions/week (over ${weeksSpanned} calendar weeks, Monday-based)`);
  L.push('');
  L.push('## Metrics');
  L.push('');
  L.push('- Units: weights in kg; dates are ISO (YYYY-MM-DD), local time.');
  L.push('- **e1RM** (estimated one-rep max), Epley formula: `weight × (1 + reps / 30)`; a 1-rep set counts as its weight. Per session, the best set is used.');
  L.push('- **Volume** = Σ weight × reps over all sets of the exercise in a session.');
  L.push('- **Max** = heaviest weight lifted in a session (sets logged without reps included).');
  L.push('- Sets with empty weight or reps are ignored for e1RM and volume.');
  L.push('- **Bodyweight exercises** (no load ever logged) are measured in reps: e1RM → max reps in a set, volume → total reps. Marked "BW".');
  L.push(`- **Rel. strength** = best e1RM / body weight on the session date (7-day average weight, else the nearest weigh-in within ${REL_BW_TOLERANCE_DAYS} days); loaded lifts only.`);
  L.push(`- **Status**: over the last ${STALL_WINDOW_DAYS} days (restarted after a pause of more than ${STALL_PAUSE_DAYS} days), with at least ${STALL_MIN_SESSIONS} sessions and earlier history. "Stalled N wk" = the best e1RM (max reps for BW) in that window is less than ${STALL_MIN_GAIN * 100}% above the earlier best, N weeks since that best. "Regressing" = the last 3 sessions dropped in a row and the latest is more than ${REGRESSION_DROP * 100}% under the window's best. "Alert paused" = the user changed something; re-evaluated after ${STALL_MIN_SESSIONS} new sessions. "—" = not enough data.`);
  L.push('- A **PR** is a session whose e1RM (max reps for bodyweight) beats every earlier session of that exercise; the first log of an exercise counts as a PR.');
  L.push('- Set notation in the log: `weight×reps`; `BW` = bodyweight, `?` = reps not logged, `—` = weight not logged.');
  L.push('');

  // ---- Per-exercise summary
  L.push('## Exercise summary', '');
  L.push('| Exercise | Unit | Status | Sessions | First | Last | e1RM start → now → best | Δ e1RM start→now | Max start → now | Avg volume first 3 | Avg volume last 3 | Rel. strength (first → current) |');
  L.push('|---|---|---|---|---|---|---|---|---|---|---|---|');
  const daily = dailyFirst(body);
  names.forEach(name=>{
    const bw = bwByName[name];
    const logs = sorted
      .map(s=> ({ date: s.date, ex: s.exercises.find(e=>e.name===name) }))
      .filter(p=> p.ex && hasSetData(p.ex.sets));
    if(logs.length===0) return;

    const strength = logs.map(p=> bw ? maxReps(p.ex.sets) : bestE1RM(p.ex.sets)).filter(v=> v > 0);
    const volumes = logs.map(p=> bw ? totalReps(p.ex.sets) : totalVolume(p.ex.sets)).filter(v=> v > 0);
    const maxes = logs.map(p=> maxWeight(p.ex.sets)).filter(v=> v > 0);
    const unit = bw ? 'reps' : 'kg';

    let e1rmCell = '—', deltaCell = '—';
    if(strength.length){
      const start = strength[0], now = strength[strength.length-1], best = Math.max(...strength);
      e1rmCell = `${fmtNum(start)} → ${fmtNum(now)} → ${fmtNum(best)}`;
      deltaCell = signed(now - start, unit) + pctChange(start, now);
    }
    const maxCell = bw ? 'n/a (BW)' : maxes.length ? `${fmtNum(maxes[0])} → ${fmtNum(maxes[maxes.length-1])}` : '—';
    const volFirst = volumes.length ? fmtNum(avg(volumes.slice(0,3))) : '—';
    const volLast = volumes.length ? fmtNum(avg(volumes.slice(-3))) : '—';
    const rels = bw ? [] : logs.map(p=> relativeStrength(p.ex.sets, p.date, daily)).filter(v=> v != null);
    const relCell = rels.length ? `${rels[0].toFixed(2)} → ${rels[rels.length - 1].toFixed(2)}× BW` : '—';

    L.push(`| ${mdCell(name)} | ${bw ? 'BW reps' : 'kg'} | ${stallStatusLabel(stallFor(name))} | ${logs.length} | ${isoDate(logs[0].date)} | ${isoDate(logs[logs.length-1].date)} | ${e1rmCell} | ${deltaCell} | ${maxCell} | ${volFirst} | ${volLast} | ${relCell} |`);
  });
  L.push('');

  // ---- Weekly volume (every calendar week in the period, including empty ones)
  L.push('## Weekly volume', '');
  L.push('| Week (Mon) | Sessions | Volume (kg) | Bodyweight reps |');
  L.push('|---|---|---|---|');
  const weeks = new Map();
  for(let w = mondayOf(firstDate); w <= lastDate; w.setDate(w.getDate()+7)){
    weeks.set(isoDate(w), { sessions:0, volume:0, reps:0 });
  }
  sorted.forEach(s=>{
    const wk = weeks.get(isoDate(mondayOf(s.date)));
    if(!wk) return;
    wk.sessions++;
    s.exercises.forEach(ex=>{
      if(bwByName[ex.name]) wk.reps += totalReps(ex.sets);
      else wk.volume += totalVolume(ex.sets);
    });
  });
  weeks.forEach((wk, key)=>{
    L.push(`| ${key} | ${wk.sessions} | ${Math.round(wk.volume)} | ${wk.reps} |`);
  });
  L.push('');

  // ---- PRs
  L.push('## Personal records', '');
  const prs = [];
  sorted.forEach(s=> s.exercises.forEach(ex=>{
    if(!ex.isPR) return;
    const bw = bwByName[ex.name];
    prs.push(`| ${isoDate(s.date)} | ${mdCell(ex.name)} | ${bw ? `${maxReps(ex.sets)} reps (BW)` : `e1RM ${fmtNum(bestE1RM(ex.sets))} kg`} |`);
  }));
  if(prs.length){
    L.push('| Date | Exercise | Value |', '|---|---|---|', ...prs);
  } else {
    L.push('_No PRs recorded._');
  }
  L.push('');

  // ---- Body composition (weekly averages + strength index in one table)
  L.push(...bodyReportSection(body, sorted));

  // ---- Full log
  L.push('## Session log', '');
  sorted.forEach(s=>{
    const dayLabel = PROGRAM[s.day] ? `${s.day} — ${PROGRAM[s.day].label}` : s.day;
    L.push(`### ${isoDate(s.date)} · Day ${dayLabel}`, '');
    s.exercises.forEach(ex=>{
      if(!hasSetData(ex.sets)) return;
      const bw = bwByName[ex.name];
      const stats = bw
        ? `max ${maxReps(ex.sets)} reps · total ${totalReps(ex.sets)} reps`
        : `e1RM ${fmtNum(bestE1RM(ex.sets))} kg · volume ${Math.round(totalVolume(ex.sets))} kg`;
      L.push(`- ${ex.name}: ${compactSets(ex.sets, bw)} — ${stats}${ex.isPR ? ' · PR' : ''}`);
    });
    if(s.note) L.push(`- Note: ${s.note.replace(/\n/g, ' ')}`);
    L.push('');
  });

  return L.join('\n');
}

function flashMsg(id, text, isError){
  const msg = document.getElementById(id);
  msg.style.color = isError ? 'var(--warn)' : 'var(--mint)';
  msg.textContent = text;
  flashMsg.timers = flashMsg.timers || {};
  clearTimeout(flashMsg.timers[id]);
  flashMsg.timers[id] = setTimeout(()=>{ msg.textContent=''; }, isError ? 6000 : 3000);
}

function flashExportMsg(text, isError){
  flashMsg('exportMsg', text, isError);
}

// Mobile/PWA: share sheet ("Save to Files", AirDrop, apps); desktop: Blob download.
// Returns 'shared' | 'cancelled' | 'downloaded'.
// `types` are tried in order because some platforms reject e.g. text/markdown but accept text/plain.
async function shareOrDownload(content, filename, types){
  if(navigator.canShare){
    for(const type of types){
      const file = new File([content], filename, { type });
      if(!navigator.canShare({ files:[file] })) continue;
      try{
        await navigator.share({ files:[file], title: filename });
        return 'shared';
      }catch(e){
        if(e.name === 'AbortError') return 'cancelled';
        break;
      }
    }
  }

  const url = URL.createObjectURL(new Blob([content], { type: types[0] }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  flashExportMsg(`✓ ${filename} downloaded`);
  return 'downloaded';
}

async function exportReport(){
  if(sessions.length===0){
    flashExportMsg('No sessions to export yet', true);
    return;
  }
  await shareOrDownload(buildReportMarkdown(), `rack-report-${isoDate(new Date())}.md`, ['text/markdown', 'text/plain']);
}

/* ---------------- BACKUP / IMPORT ---------------- */
// v2 adds body (weigh-ins); v1 backups are still accepted and leave body data untouched.
const BACKUP_VERSION = 2;
const PREV_SESSIONS_KEY = 'rack-sessions-prev';
const PREV_PROGRAM_KEY = 'rack-program-prev';

function buildBackup(){
  return {
    app: 'rack',
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    sessions,
    program: PROGRAM,
    body
  };
}

async function exportBackup(){
  const json = JSON.stringify(buildBackup(), null, 2);
  const outcome = await shareOrDownload(json, `rack-backup-${isoDate(new Date())}.json`, ['application/json', 'text/plain']);
  // Only a completed share or a download counts; a cancelled share sheet leaves the date as it was.
  if(outcome === 'shared' || outcome === 'downloaded'){
    try{ localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString()); }catch(e){}
    showToast('Backup saved');
    renderBackupReminder();
  }
  return outcome;
}

/* ---- Backup reminder ---- */
function readStoredDate(key){
  try{
    const v = localStorage.getItem(key);
    return v && !isNaN(Date.parse(v)) ? v : null;
  }catch(e){
    return null;
  }
}

function backupAgoText(days){
  return days <= 0 ? 'today' : days === 1 ? '1 day ago' : `${days} days ago`;
}

// Pure. Calendar days since the last backup; the banner shows when there is no backup yet (and some
// session exists), or the backup is older than BACKUP_REMINDER_DAYS with changes after it, unless snoozed.
function backupReminderState({ lastBackup, lastChange, snoozedUntil, hasSessions, now = new Date() }){
  const daysAgo = lastBackup ? dayIndex(isoDate(now)) - dayIndex(isoDate(lastBackup)) : null;
  const changedSince = !!lastChange && !!lastBackup && new Date(lastChange) > new Date(lastBackup);
  const due = lastBackup ? daysAgo > BACKUP_REMINDER_DAYS && changedSince : hasSessions;
  const snoozed = !!snoozedUntil && new Date(snoozedUntil) > now;
  return {
    show: due && !snoozed,
    daysAgo,
    overdue: lastBackup ? daysAgo > BACKUP_REMINDER_DAYS : hasSessions,
    banner: lastBackup ? `Last backup ${backupAgoText(daysAgo)}` : 'No backup yet',
    line: `Last backup: ${lastBackup ? backupAgoText(daysAgo) : 'never'}`
  };
}

function currentBackupState(){
  return backupReminderState({
    lastBackup: readStoredDate(LAST_BACKUP_KEY),
    lastChange: readStoredDate(LAST_CHANGE_KEY),
    snoozedUntil: readStoredDate(BACKUP_SNOOZE_KEY),
    hasSessions: sessions.length > 0
  });
}

// Today banner (not while editing a past session) and the line under Export backup in Progress.
function renderBackupReminder(){
  const state = currentBackupState();
  const banner = document.getElementById('backupBanner');
  if(banner){
    document.getElementById('backupBannerText').textContent = state.banner;
    banner.style.display = state.show && editingIndex === null ? 'flex' : 'none';
  }
  const line = document.getElementById('backupLine');
  if(line){
    line.textContent = state.line;
    line.classList.toggle('overdue', state.overdue);
  }
}

function snoozeBackupReminder(){
  const until = new Date(Date.now() + BACKUP_SNOOZE_HOURS * 3600 * 1000).toISOString();
  try{ localStorage.setItem(BACKUP_SNOOZE_KEY, until); }catch(e){}
  renderBackupReminder();
}

function isPlainObject(v){
  return v !== null && typeof v === 'object' && !Array.isArray(v);
}

function isSetValue(v){
  return v === null || v === undefined || (Number.isFinite(Number(v)) && Number(v) >= 0);
}

// Returns an error message, or null when the backup has the expected shape.
function validateBackup(data){
  if(!isPlainObject(data)) return 'Not a Rack backup (expected a JSON object).';
  if(!Number.isInteger(data.version)) return 'Missing or invalid "version".';
  if(data.version > BACKUP_VERSION) return `Backup version ${data.version} is newer than this app supports (${BACKUP_VERSION}).`;
  if(!Array.isArray(data.sessions)) return '"sessions" must be an array.';

  for(let i = 0; i < data.sessions.length; i++){
    const s = data.sessions[i];
    const where = `Session ${i+1}`;
    if(!isPlainObject(s)) return `${where} is not an object.`;
    if(typeof s.date !== 'string' || isNaN(Date.parse(s.date))) return `${where} has an invalid date.`;
    if(typeof s.day !== 'string' || !s.day) return `${where} has no program day.`;
    if(s.note !== undefined && typeof s.note !== 'string') return `${where} has an invalid note.`;
    if(!Array.isArray(s.exercises)) return `${where} has no exercise list.`;
    for(const ex of s.exercises){
      if(!isPlainObject(ex) || typeof ex.name !== 'string' || !ex.name) return `${where} has an exercise without a name.`;
      if(!Array.isArray(ex.sets)) return `${where}, ${ex.name}: sets must be an array.`;
      if(ex.isPR !== undefined && typeof ex.isPR !== 'boolean') return `${where}, ${ex.name}: invalid PR flag.`;
      for(const st of ex.sets){
        if(!isPlainObject(st) || !isSetValue(st.weight) || !isSetValue(st.reps)) return `${where}, ${ex.name}: invalid set.`;
      }
    }
  }

  if(!isPlainObject(data.program) || Object.keys(data.program).length === 0) return 'Missing or invalid "program".';
  for(const [day, def] of Object.entries(data.program)){
    if(!isPlainObject(def) || typeof def.label !== 'string' || !Array.isArray(def.exercises)) return `Program day ${day} is invalid.`;
    for(const ex of def.exercises){
      if(!isPlainObject(ex) || typeof ex.name !== 'string' || !ex.name || !Number.isInteger(ex.sets) || ex.sets < 1){
        return `Program day ${day} has an invalid exercise.`;
      }
      // Optional (older backups have none).
      if(ex.increment !== undefined && !(typeof ex.increment === 'number' && Number.isFinite(ex.increment) && ex.increment > 0)){
        return `Program day ${day}, ${ex.name}: invalid increment.`;
      }
      if(ex.stallAck !== undefined && !(typeof ex.stallAck === 'string' && !isNaN(Date.parse(ex.stallAck)))){
        return `Program day ${day}, ${ex.name}: invalid stallAck date.`;
      }
    }
  }
  if(data.body !== undefined){
    if(!Array.isArray(data.body)) return '"body" must be an array.';
    for(let i = 0; i < data.body.length; i++){
      const error = validateWeighIn(data.body[i]);
      if(error) return `Weigh-in ${i+1}: ${error}`;
    }
  }
  return null;
}

function validateWeighIn(w){
  if(!isPlainObject(w)) return 'not an object.';
  if(!isValidIsoDay(w.date)) return 'invalid date.';
  if(typeof w.time !== 'string' || !/^\d{2}:\d{2}(:\d{2})?$/.test(w.time)) return 'invalid time.';
  if(typeof w.weight !== 'number' || !(w.weight > 0)) return 'invalid weight.';
  for(const f of BODY_COMPOSITION_FIELDS){
    if(w[f] != null && !(typeof w[f] === 'number' && Number.isFinite(w[f]) && w[f] >= 0)) return `invalid ${f}.`;
  }
  return null;
}

function describeWeighIns(list){
  return `${list.length} weigh-in${list.length === 1 ? '' : 's'}`;
}

function describeSessions(list){
  if(list.length === 0) return '0 sessions';
  const dates = list.map(s=> new Date(s.date)).sort((a,b)=> a - b);
  return `${list.length} session${list.length===1 ? '' : 's'} from ${isoDate(dates[0])} to ${isoDate(dates[dates.length-1])}`;
}

// Replaces sessions and program with a validated backup, keeping the previous data under *-prev keys.
async function applyBackup(data){
  try{
    localStorage.setItem(PREV_SESSIONS_KEY, JSON.stringify(sessions));
    localStorage.setItem(PREV_PROGRAM_KEY, JSON.stringify(PROGRAM));
    localStorage.setItem(PREV_BODY_KEY, JSON.stringify(body));
  }catch(e){
    throw new Error('Could not save a copy of the current data, import cancelled.');
  }
  await replaceData(data.sessions, data.program, data.body);
}

// newBody undefined (v1 backup, or a copy made before body data existed) keeps the current body data.
async function replaceData(newSessions, newProgram, newBody){
  sessions = JSON.parse(JSON.stringify(newSessions));
  const program = JSON.parse(JSON.stringify(newProgram));
  Object.keys(DEFAULT_PROGRAM).forEach(d=>{ if(!program[d]) program[d] = JSON.parse(JSON.stringify(DEFAULT_PROGRAM[d])); });
  PROGRAM = program;

  recomputePRs();
  await persistSessions();
  persistProgram();
  if(newBody !== undefined){
    body = JSON.parse(JSON.stringify(newBody));
    persistBody();
  }
}

// Data saved before the last import: null if there is none, { error } if it is unreadable.
function readUndoData(){
  let rawSessions, rawProgram, rawBody;
  try{
    rawSessions = localStorage.getItem(PREV_SESSIONS_KEY);
    rawProgram = localStorage.getItem(PREV_PROGRAM_KEY);
    rawBody = localStorage.getItem(PREV_BODY_KEY);
  }catch(e){
    return null;
  }
  if(rawSessions === null && rawProgram === null && rawBody === null) return null;

  let data;
  try{
    data = {
      version: BACKUP_VERSION,
      sessions: rawSessions !== null ? JSON.parse(rawSessions) : sessions,
      program: rawProgram !== null ? JSON.parse(rawProgram) : PROGRAM,
      // Copies made before body data existed have none: body is then left as it is.
      body: rawBody !== null ? JSON.parse(rawBody) : undefined
    };
  }catch(e){
    return { error: 'The saved pre-import copy is not valid JSON.' };
  }
  const error = validateBackup(data);
  return error ? { error: `The saved pre-import copy is invalid: ${error}` } : { data };
}

async function restorePreviousData(data){
  await replaceData(data.sessions, data.program, data.body);
  // Drop the copy so the same undo cannot be applied twice.
  try{
    localStorage.removeItem(PREV_SESSIONS_KEY);
    localStorage.removeItem(PREV_PROGRAM_KEY);
    localStorage.removeItem(PREV_BODY_KEY);
  }catch(e){}
}

function updateUndoButton(){
  document.getElementById('undoImportBtn').style.display = readUndoData() ? '' : 'none';
}

function refreshAfterDataChange(){
  editingIndex = null;
  if(!PROGRAM[currentDay]) currentDay = Object.keys(PROGRAM)[0];
  if(!PROGRAM[programDay]) programDay = Object.keys(PROGRAM)[0];
  document.getElementById('exerciseSelect').innerHTML = '';
  document.getElementById('statsDayRack').innerHTML = '';
  renderDayRack();
  renderExercises();
  renderProgressView();
}

async function undoImport(){
  const undo = readUndoData();
  if(!undo){
    updateUndoButton();
    return;
  }
  if(undo.error){
    flashExportMsg(`${undo.error} Nothing was changed.`, true);
    return;
  }

  const ok = confirm(
    `Restore the data from before the last import: ${describeSessions(undo.data.sessions)}` +
    `${undo.data.body ? ` and ${describeWeighIns(undo.data.body)}` : ''}?\n` +
    `Current data (${describeSessions(sessions)}) will be replaced. This undo can only be done once.`
  );
  if(!ok) return;

  await restorePreviousData(undo.data);
  refreshAfterDataChange();
  flashExportMsg(`✓ Restored ${describeSessions(sessions)}`);
}

async function importBackup(file){
  if(!/\.json$/i.test(file.name)){
    flashExportMsg('Please choose a .json backup file.', true);
    return;
  }

  let data;
  try{
    data = JSON.parse(await file.text());
  }catch(e){
    flashExportMsg('This file is not valid JSON. Nothing was changed.', true);
    return;
  }

  const error = validateBackup(data);
  if(error){
    flashExportMsg(`Invalid backup: ${error} Nothing was changed.`, true);
    return;
  }

  const ok = confirm(
    `The backup contains ${describeSessions(data.sessions)}` +
    `${data.body ? ` and ${describeWeighIns(data.body)}` : ''}.\n` +
    `Current data: ${describeSessions(sessions)} and ${describeWeighIns(body)}.\n` +
    `${data.body ? '' : 'Body data is not in this backup and will be kept.\n'}\n` +
    `Replace the current data? (A copy is kept so the import can be undone.)`
  );
  if(!ok) return;

  try{
    await applyBackup(data);
  }catch(e){
    flashExportMsg(e.message, true);
    return;
  }

  refreshAfterDataChange();
  flashExportMsg(`✓ Imported ${describeSessions(sessions)}`);
}

/* ---------------- BODY COMPOSITION (Renpho) ---------------- */
// CSV header names, matched by name so a column reorder in a future Renpho version does not break the import.
const RENPHO_COLUMNS = {
  date: 'Date',
  time: 'Time',
  weight: 'Weight(kg)',
  bodyFatPct: 'Body Fat Percentage(%)',
  fatMass: 'Body Fat Mass(kg)',
  skeletalMuscleMass: 'Skeletal Muscle Mass(kg)',
  fatFreeMass: 'Fat-Free Mass(kg)',
  visceralFat: 'Visceral Fat'
};
const BODY_COMPOSITION_FIELDS = ['bodyFatPct', 'fatMass', 'skeletalMuscleMass', 'fatFreeMass', 'visceralFat'];

// Minimal RFC 4180 reader: quoted fields, "" escapes, CRLF/LF, trailing commas; blank lines dropped.
function parseCsvRows(text){
  const rows = [];
  let row = [], field = '', quoted = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(quoted){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else quoted = false;
      } else field += c;
    } else if(c === '"') quoted = true;
    else if(c === ','){ row.push(field); field = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=> r.some(f=> f.trim() !== ''));
}

// Pure. { weighIns, skipped } or { error } (nothing usable, nothing should be stored).
function parseRenphoCsv(text){
  const rows = parseCsvRows(String(text || '').replace(/^﻿/, ''));
  if(rows.length === 0) return { error: 'The file is empty.' };
  const header = rows[0].map(h=> h.trim());
  const col = {};
  Object.entries(RENPHO_COLUMNS).forEach(([key, name])=> col[key] = header.indexOf(name));
  const missing = ['date', 'time', 'weight'].filter(k=> col[k] < 0).map(k=> RENPHO_COLUMNS[k]);
  if(missing.length){
    if(col.weight < 0 && header.some(h=> /^Weight\(lb/i.test(h))) return { error: 'This CSV uses pounds: set Renpho units to kg and export again.' };
    return { error: `Not a Renpho CSV: missing column${missing.length > 1 ? 's' : ''} ${missing.join(', ')}.` };
  }

  const weighIns = [];
  let skipped = 0;
  rows.slice(1).forEach(r=>{
    const cell = k=> col[k] >= 0 && r[col[k]] !== undefined ? r[col[k]].trim() : '';
    const dm = cell('date').match(/^(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})$/);
    const tm = cell('time').match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    const weight = parseFloat(cell('weight'));
    const date = dm ? `${dm[1]}-${dm[2].padStart(2, '0')}-${dm[3].padStart(2, '0')}` : '';
    if(!dm || !tm || !(weight > 0) || !isValidIsoDay(date)){ skipped++; return; }
    // Composition at 0 means the scale could not read impedance (dry feet, socks): unknown, not zero.
    const comp = k=>{ const v = parseFloat(cell(k)); return v > 0 ? v : null; };
    const w = { date, time: `${tm[1].padStart(2, '0')}:${tm[2]}:${tm[3] || '00'}`, weight };
    BODY_COMPOSITION_FIELDS.forEach(f=> w[f] = comp(f));
    weighIns.push(w);
  });
  return { weighIns, skipped };
}

function isValidIsoDay(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if(!m) return false;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3];
}

// 'YYYY-MM-DD' as a local date (new Date('YYYY-MM-DD') would be UTC midnight).
function parseLocalDay(s){
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

// Whole-day index for calendar arithmetic, free of DST and time zones.
function dayIndex(s){
  const [y, m, d] = s.split('-').map(Number);
  return Math.round(Date.UTC(y, m - 1, d) / DAY_MS);
}

function weekKey(day){
  return isoDate(mondayOf(parseLocalDay(day)));
}

function weighInKey(w){
  return `${w.date} ${w.time}`;
}

// Pure. A weigh-in is identified by date + time: existing ones are never touched, only new ones added.
function mergeWeighIns(existing, incoming){
  const keys = new Set(existing.map(weighInKey));
  const added = [];
  incoming.forEach(w=>{
    const k = weighInKey(w);
    if(!keys.has(k)){ keys.add(k); added.push(w); }
  });
  const merged = [...existing, ...added].sort((a, b)=> weighInKey(a) < weighInKey(b) ? -1 : weighInKey(a) > weighInKey(b) ? 1 : 0);
  const dates = added.map(w=> w.date).sort();
  return { merged, added, from: dates[0] || null, to: dates[dates.length - 1] || null };
}

function renphoImportMessage(addedCount, from, to, skipped){
  let text = addedCount
    ? `Imported ${addedCount} new weigh-in${addedCount === 1 ? '' : 's'} (${from === to ? from : `${from} → ${to}`})`
    : 'No new weigh-ins';
  if(skipped) text += ` · ${skipped} row${skipped === 1 ? '' : 's'} skipped`;
  return text;
}

// One reading per day: the first weigh-in's weight; each composition value from the day's first
// weigh-in that has it. All weigh-ins stay stored.
function dailyFirst(weighIns){
  const byDate = new Map();
  [...weighIns].sort((a, b)=> weighInKey(a) < weighInKey(b) ? -1 : 1).forEach(w=>{
    if(!byDate.has(w.date)) byDate.set(w.date, []);
    byDate.get(w.date).push(w);
  });
  return [...byDate].map(([date, list])=>{
    const day = { date, time: list[0].time, weight: list[0].weight };
    BODY_COMPOSITION_FIELDS.forEach(f=>{
      const withValue = list.find(w=> w[f] != null);
      day[f] = withValue ? withValue[f] : null;
    });
    return day;
  });
}

function meanOrNull(values){
  const v = values.filter(x=> x != null);
  return v.length ? v.reduce((a, b)=> a + b, 0) / v.length : null;
}

// Trailing average at a given day index over the last `days` calendar days (gaps do not stretch
// the window); null with fewer than BODY_MA_MIN_POINTS daily values in it.
function averageAt(daily, field, day, days = BODY_MA_DAYS){
  const win = daily.filter(d=>{
    if(d[field] == null) return false;
    const k = dayIndex(d.date);
    return k <= day && k > day - days;
  });
  return win.length >= BODY_MA_MIN_POINTS ? meanOrNull(win.map(d=> d[field])) : null;
}

// The moving average on each day that has a reading.
function movingAverage(daily, field, days = BODY_MA_DAYS){
  return daily
    .filter(d=> d[field] != null)
    .map(d=> ({ date: d.date, value: averageAt(daily, field, dayIndex(d.date), days) }))
    .filter(p=> p.value != null);
}

// Latest moving-average value (up to anchorDay, if given) vs the one `days` earlier
// (or the closest before it, within tolerance).
function changeOver(ma, days = BODY_CHANGE_DAYS, anchorDay){
  const pts = anchorDay == null ? ma : ma.filter(p=> dayIndex(p.date) <= anchorDay);
  if(!pts.length) return null;
  const last = pts[pts.length - 1];
  const target = dayIndex(last.date) - days;
  const ref = [...pts].reverse().find(p=> dayIndex(p.date) <= target && dayIndex(p.date) >= target - BODY_CHANGE_TOLERANCE_DAYS);
  return ref ? { from: ref.value, to: last.value, delta: last.value - ref.value, fromDate: ref.date, toDate: last.date } : null;
}

/* ---- Recomposition verdict ---- */
const RECOMP_VERDICTS = {
  onTrack:      { verdict:'Recomposition on track',         tone:'good',    advice:'Keep the current plan.' },
  losingMuscle: { verdict:'Losing muscle too',              tone:'bad',     advice:'Check calories and protein; consider a smaller deficit.' },
  watch:        { verdict:'Watch for muscle loss',          tone:'warn',    advice:'Keep protein high and lifting heavy; recheck next week.' },
  building:     { verdict:'Building at stable fat',         tone:'good',    advice:'Strength or muscle rising without fat gain.' },
  gaining:      { verdict:'Gaining phase',                  tone:'neutral', advice:'Weight and strength rising; watch fat gain rate.' },
  fatGain:      { verdict:'Fat gain without strength gain', tone:'warn',    advice:'Check the calorie surplus and training progression.' },
  stable:       { verdict:'Stable',                         tone:'neutral', advice:'No clear change — fine for maintenance.' },
  mixed:        { verdict:'Mixed signals',                  tone:'neutral', advice:'Signals disagree — keep going and recheck in 1–2 weeks.' }
};
const RECOMP_INSUFFICIENT = { status:'insufficient', verdict:'Not enough data yet', tone:'neutral', message:'Need ~4 weeks of weigh-ins and workouts' };

// |Δ| below the threshold is "stable"; at or above it, up/down.
function trendOf(delta, threshold){
  return delta >= threshold ? 'up' : delta <= -threshold ? 'down' : 'stable';
}

// Verdict key from the three trends, checked in priority order.
function classifyRecomp(fat, muscle, strength){
  const notDown = t=> t !== 'down';
  if(fat === 'down' && notDown(muscle) && notDown(strength)) return 'onTrack';
  if(fat === 'down' && muscle === 'down' && strength === 'down') return 'losingMuscle';
  if(fat === 'down') return 'watch';   // muscle or strength down
  if(fat === 'stable' && (muscle === 'up' || strength === 'up') && notDown(muscle) && notDown(strength)) return 'building';
  if(fat === 'up' && strength === 'up') return 'gaining';
  if(fat === 'up') return 'fatGain';
  if(fat === 'stable' && muscle === 'stable' && strength === 'stable') return 'stable';
  return 'mixed';
}

// Pure. Last RECOMP_WINDOW_DAYS up to `now`: fat and skeletal muscle on the 7-day average (today vs
// 4 weeks ago), strength index this week vs 4 weeks before. Data after `now` is ignored.
function recompVerdict(bodyList, sessionList, now = new Date()){
  const nowDay = dayIndex(isoDate(now));
  const daily = dailyFirst(bodyList).filter(d=> dayIndex(d.date) <= nowDay);
  const recentDays = daily.filter(d=> dayIndex(d.date) > nowDay - RECOMP_WINDOW_DAYS).length;
  if(recentDays < RECOMP_MIN_WEIGH_IN_DAYS) return RECOMP_INSUFFICIENT;

  // "Today" must be a moving-average point close to now, not an old one.
  const change = field=>{
    const c = changeOver(movingAverage(daily, field), RECOMP_WINDOW_DAYS, nowDay);
    return c && nowDay - dayIndex(c.toDate) <= BODY_CHANGE_TOLERANCE_DAYS ? c : null;
  };
  const fat = change('fatMass'), muscle = change('skeletalMuscleMass');
  if(!fat || !muscle) return RECOMP_INSUFFICIENT;

  const thisWeek = weekKey(isoDate(now));
  const weeks = weeksBetween(dayFromIndex(dayIndex(thisWeek) - RECOMP_WINDOW_DAYS), thisWeek);
  const pastSessions = sessionList.filter(s=> dayIndex(isoDate(new Date(s.date))) <= nowDay);
  const si = weeklyStrengthIndex(pastSessions, weeks);
  if(!si.length || si[0].index == null || si[si.length - 1].index == null) return RECOMP_INSUFFICIENT;

  const r2 = v=> Math.round(v * 100) / 100;   // avoid 0.29999 vs 0.3 noise
  const fatD = r2(fat.delta), muscleD = r2(muscle.delta), strengthD = round1(si[si.length - 1].index - si[0].index);
  const trends = {
    fat: trendOf(fatD, RECOMP_FAT_THRESHOLD),
    muscle: trendOf(muscleD, RECOMP_MUSCLE_THRESHOLD),
    strength: trendOf(strengthD, RECOMP_STRENGTH_THRESHOLD)
  };
  const key = classifyRecomp(trends.fat, trends.muscle, trends.strength);
  return {
    status: 'ok', key, ...RECOMP_VERDICTS[key],
    fat: { delta: fatD, trend: trends.fat },
    muscle: { delta: muscleD, trend: trends.muscle },
    strength: { delta: strengthD, trend: trends.strength }
  };
}

function signedNum(v, digits = 1){
  const r = Math.round(v * 10 ** digits) / 10 ** digits;
  return r > 0 ? `+${r}` : r < 0 ? `−${Math.abs(r)}` : '0';
}

function recompDeltaLine(v){
  return `Fat ${signedNum(v.fat.delta)} kg · Muscle ${signedNum(v.muscle.delta)} kg · Strength ${signedNum(v.strength.delta)}`;
}

// Verdicts for consecutive 4-week blocks, anchored on the latest weigh-in and counted backwards.
function recompBlocks(bodyList, sessionList){
  const daily = dailyFirst(bodyList);
  if(!daily.length) return [];
  const firstDay = dayIndex(daily[0].date);
  const out = [];
  for(let end = dayIndex(daily[daily.length - 1].date); end - RECOMP_WINDOW_DAYS >= firstDay; end -= RECOMP_WINDOW_DAYS){
    out.unshift({
      start: dayFromIndex(end - RECOMP_WINDOW_DAYS),
      end: dayFromIndex(end),
      result: recompVerdict(bodyList, sessionList, parseLocalDay(dayFromIndex(end)))
    });
  }
  return out;
}

/* ---- Relative strength ---- */
// Body weight on a day: 7-day average, else the nearest weigh-in within REL_BW_TOLERANCE_DAYS, else null.
function bodyWeightAt(daily, day){
  const avgW = averageAt(daily, 'weight', day);
  if(avgW != null) return avgW;
  let best = null;
  daily.forEach(d=>{
    const dist = Math.abs(dayIndex(d.date) - day);
    if(dist <= REL_BW_TOLERANCE_DAYS && (!best || dist < best.dist)) best = { dist, weight: d.weight };
  });
  return best ? best.weight : null;
}

// Best e1RM / body weight for a loaded session; null for bodyweight sets or without a body weight.
function relativeStrength(sets, sessionDate, daily){
  const e = bestE1RM(sets);
  if(!(e > 0)) return null;
  const bw = bodyWeightAt(daily, dayIndex(isoDate(new Date(sessionDate))));
  return bw > 0 ? e / bw : null;
}

// dailyFirst(body), recomputed only when the body array is replaced (import, backup restore).
function bodyDaily(){
  if(bodyDaily.source !== body){
    bodyDaily.source = body;
    bodyDaily.value = dailyFirst(body);
  }
  return bodyDaily.value;
}

// Fat mass and skeletal muscle as kg change from the first moving-average value in the range,
// so one odd early reading does not shift the whole chart.
function recompositionSeries(daily, sinceDay){
  const rel = field=>{
    const ma = movingAverage(daily, field).filter(p=> dayIndex(p.date) >= sinceDay);
    return ma.length ? ma.map(p=> ({ date: p.date, value: p.value - ma[0].value })) : [];
  };
  return { fat: rel('fatMass'), muscle: rel('skeletalMuscleMass') };
}

// Pure. Weekly strength index for the given Monday keys (ascending): per lift (≥ STRENGTH_MIN_SESSIONS
// sessions with a load) its best e1RM that week, carried forward at most STRENGTH_CARRY_WEEKS weeks,
// relative to its value at the first week; mean of the ratios × 100.
function weeklyStrengthIndex(sessionList, weeks){
  if(!weeks.length) return [];
  const perLift = {};
  sessionList.forEach(s=> s.exercises.forEach(ex=>{
    const v = bestE1RM(ex.sets);
    if(!(v > 0)) return;
    const wk = isoDate(mondayOf(s.date));
    const lift = perLift[ex.name] || (perLift[ex.name] = { sessions: 0, byWeek: {} });
    lift.sessions++;
    lift.byWeek[wk] = Math.max(lift.byWeek[wk] || 0, v);
  }));

  const valueAt = (byWeek, week)=>{
    const w = dayIndex(week);
    let best = null;
    Object.keys(byWeek).forEach(k=>{
      const age = (w - dayIndex(k)) / 7;
      if(age >= 0 && age <= STRENGTH_CARRY_WEEKS && (!best || k > best)) best = k;
    });
    return best ? byWeek[best] : null;
  };

  const lifts = Object.values(perLift).filter(l=> l.sessions >= STRENGTH_MIN_SESSIONS).map(l=>{
    let base = valueAt(l.byWeek, weeks[0]);
    if(base == null){
      const later = Object.keys(l.byWeek).filter(k=> k > weeks[0]).sort()[0];
      base = later ? l.byWeek[later] : null;
    }
    return { byWeek: l.byWeek, base };
  }).filter(l=> l.base > 0);

  return weeks.map(week=>{
    const ratios = lifts.map(l=>{ const v = valueAt(l.byWeek, week); return v == null ? null : v / l.base; });
    const m = meanOrNull(ratios);
    return { week, index: m == null ? null : round1(m * 100), lifts: ratios.filter(r=> r != null).length };
  });
}

// Monday keys from the first to the last day, including empty weeks.
function weeksBetween(firstDay, lastDay){
  const out = [];
  for(let w = mondayOf(parseLocalDay(firstDay)); isoDate(w) <= lastDay; w.setDate(w.getDate() + 7)) out.push(isoDate(w));
  return out;
}

function weeklyBodyAverages(daily){
  if(!daily.length) return [];
  const groups = {};
  daily.forEach(d=>{ (groups[weekKey(d.date)] || (groups[weekKey(d.date)] = [])).push(d); });
  return weeksBetween(daily[0].date, daily[daily.length - 1].date).map(week=>{
    const list = groups[week] || [];
    const avgOf = f=> meanOrNull(list.map(d=> d[f]));
    return { week, count: list.length, weight: avgOf('weight'), bodyFatPct: avgOf('bodyFatPct'),
      fatMass: avgOf('fatMass'), skeletalMuscleMass: avgOf('skeletalMuscleMass') };
  });
}

function bodyReportSection(weighIns, sessionList, now = new Date()){
  const L = ['## Body composition', ''];
  if(!weighIns.length){
    L.push('_No body data._', '');
    return L;
  }
  const daily = dailyFirst(weighIns);
  const fmt = (v, d = 1)=> v == null ? '—' : String(Math.round(v * 10 ** d) / 10 ** d);
  const describe = w=> `${w.date} ${w.time.slice(0, 5)} — ${fmt(w.weight, 2)} kg` +
    (w.bodyFatPct != null ? `, ${fmt(w.bodyFatPct)}% fat` : '') +
    (w.fatMass != null ? `, fat mass ${fmt(w.fatMass, 2)} kg` : '') +
    (w.skeletalMuscleMass != null ? `, skeletal muscle ${fmt(w.skeletalMuscleMass, 2)} kg` : '');
  const sorted = [...weighIns].sort((a, b)=> weighInKey(a) < weighInKey(b) ? -1 : 1);
  L.push(`- First weigh-in: ${describe(sorted[0])}`);
  L.push(`- Last weigh-in: ${describe(sorted[sorted.length - 1])}`);
  L.push(`- Weigh-ins: ${sorted.length} on ${daily.length} days. Daily value = first weigh-in of the day (composition from the first reading of the day with valid impedance; 0 readings treated as missing).`);
  L.push(`- Strength index = mean of each lift's best weekly e1RM relative to its value in the first week with weigh-ins (× 100). Lifts with at least ${STRENGTH_MIN_SESSIONS} loaded sessions; a lift not trained in a week carries its last value for up to ${STRENGTH_CARRY_WEEKS} weeks, then drops out.`);
  L.push('');

  const weeks = weeklyBodyAverages(daily);
  const strength = weeklyStrengthIndex(sessionList, weeks.map(w=> w.week));
  L.push('| Week (Mon) | Weigh-ins | Weight (kg) | Body fat % | Fat mass (kg) | Skeletal muscle (kg) | Strength index |');
  L.push('|---|---|---|---|---|---|---|');
  weeks.forEach((w, i)=>{
    L.push(`| ${w.week} | ${w.count} | ${fmt(w.weight, 2)} | ${fmt(w.bodyFatPct)} | ${fmt(w.fatMass, 2)} | ${fmt(w.skeletalMuscleMass, 2)} | ${strength[i].index == null ? '—' : strength[i].index} |`);
  });
  L.push('');

  const withData = weeks.filter(w=> w.count > 0);
  const first = withData[0], last = withData[withData.length - 1];
  const change = (f, unit, d)=>{
    if(first[f] == null || last[f] == null) return '—';
    const delta = last[f] - first[f];
    return `${fmt(first[f], d)} → ${fmt(last[f], d)} ${unit} (${delta >= 0 ? '+' : ''}${fmt(delta, d)})`;
  };
  const si = strength.filter(s=> s.index != null);
  L.push(`Change over the period (weekly averages, ${first.week} → ${last.week}):`, '');
  L.push(`- Weight: ${change('weight', 'kg', 2)}`);
  L.push(`- Body fat: ${change('bodyFatPct', '%', 1)}`);
  L.push(`- Fat mass: ${change('fatMass', 'kg', 2)}`);
  L.push(`- Skeletal muscle: ${change('skeletalMuscleMass', 'kg', 2)}`);
  L.push(`- Strength index: ${si.length ? `${si[0].index} → ${si[si.length - 1].index}` : '—'}`);
  L.push('');

  // Recomposition verdict: now, then per 4-week block (anchored on the latest weigh-in).
  const verdictText = v=> v.status === 'ok' ? v.verdict : `Insufficient data (${v.message})`;
  const current = recompVerdict(weighIns, sessionList, now);
  L.push(`Recomposition verdict (last ${RECOMP_WINDOW_DAYS} days to ${isoDate(now)}, 7-day averages; changes under ${RECOMP_FAT_THRESHOLD} kg fat / ${RECOMP_MUSCLE_THRESHOLD} kg muscle / ${RECOMP_STRENGTH_THRESHOLD} strength-index points count as stable):`, '');
  L.push(`- **${verdictText(current)}**${current.status === 'ok' ? ` — ${recompDeltaLine(current)}. ${current.advice}` : ''}`);
  L.push('');
  const blocks = recompBlocks(weighIns, sessionList);
  if(blocks.length){
    L.push('| Block (4 weeks) | Fat Δ (kg) | Muscle Δ (kg) | Strength Δ (pts) | Verdict |');
    L.push('|---|---|---|---|---|');
    blocks.forEach(b=>{
      const r = b.result, ok = r.status === 'ok';
      L.push(`| ${b.start} → ${b.end} | ${ok ? signedNum(r.fat.delta) : '—'} | ${ok ? signedNum(r.muscle.delta) : '—'} | ${ok ? signedNum(r.strength.delta) : '—'} | ${verdictText(r)} |`);
    });
    L.push('');
  }
  return L;
}

/* ---- Inline SVG line charts (no library) ---- */
// series: [{ points:[{x, y}], kind:'dots'|'line'|'dashed', cls }]; x and y are numbers.
function svgLineChart(seriesList, opts = {}){
  const W = 320, H = opts.height || 150, padL = 36, padR = 8, padT = 10, padB = 20;
  const all = seriesList.flatMap(s=> s.points);
  if(!all.length) return '';
  let minX = opts.minX != null ? opts.minX : Math.min(...all.map(p=> p.x));
  let maxX = opts.maxX != null ? opts.maxX : Math.max(...all.map(p=> p.x));
  if(maxX <= minX) maxX = minX + 1;
  let minY = Math.min(...all.map(p=> p.y)), maxY = Math.max(...all.map(p=> p.y));
  if(opts.refY != null){ minY = Math.min(minY, opts.refY); maxY = Math.max(maxY, opts.refY); }
  const minSpan = opts.minSpan || 1;
  if(maxY - minY < minSpan){ const mid = (maxY + minY) / 2; minY = mid - minSpan / 2; maxY = mid + minSpan / 2; }
  const pad = (maxY - minY) * 0.08; minY -= pad; maxY += pad;

  const sx = x=> padL + (x - minX) / (maxX - minX) * (W - padL - padR);
  const sy = y=> padT + (maxY - y) / (maxY - minY) * (H - padT - padB);
  const f = n=> Math.round(n * 10) / 10;
  const fmtY = opts.fmtY || (v=> String(round1(v)));
  const out = [];

  [minY + pad, (minY + maxY) / 2, maxY - pad].forEach(v=>{
    out.push(`<line class="lc-grid" x1="${padL}" x2="${W - padR}" y1="${f(sy(v))}" y2="${f(sy(v))}"/>`);
    out.push(`<text class="lc-label" x="${padL - 4}" y="${f(sy(v) + 3)}" text-anchor="end">${fmtY(v)}</text>`);
  });
  if(opts.refY != null) out.push(`<line class="lc-ref" x1="${padL}" x2="${W - padR}" y1="${f(sy(opts.refY))}" y2="${f(sy(opts.refY))}"/>`);

  seriesList.forEach(s=>{
    const pts = s.points.filter(p=> p.x >= minX && p.x <= maxX);
    if(!pts.length) return;
    if(s.kind === 'dots'){
      pts.forEach(p=> out.push(`<circle class="${s.cls}" cx="${f(sx(p.x))}" cy="${f(sy(p.y))}" r="${s.r || 2.2}"/>`));
    } else {
      out.push(`<path class="${s.cls}" d="${pts.map((p, i)=> `${i ? 'L' : 'M'}${f(sx(p.x))} ${f(sy(p.y))}`).join(' ')}"/>`);
      if(pts.length === 1 || s.markers) pts.forEach(p=> out.push(`<circle class="${s.cls} lc-marker" cx="${f(sx(p.x))}" cy="${f(sy(p.y))}" r="2.6"/>`));
    }
  });

  if(opts.xLabel){
    out.push(`<text class="lc-label" x="${padL}" y="${H - 5}" text-anchor="start">${opts.xLabel(minX)}</text>`);
    out.push(`<text class="lc-label" x="${W - padR}" y="${H - 5}" text-anchor="end">${opts.xLabel(maxX)}</text>`);
  }
  return `<svg class="line-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label || ''}">${out.join('')}</svg>`;
}

function dayFromIndex(idx){
  const d = new Date(idx * DAY_MS);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
}

function dayLabel(idx){
  const [, m, d] = dayFromIndex(idx).split('-');
  return `${d}/${m}`;
}

/* ---- Body view ---- */
function bodyTileHtml(label, value, unit, change, goodWhen){
  const val = value == null ? '—' : `${round1(value)}<span class="body-unit"> ${unit}</span>`;
  let delta = '<span class="body-delta flat">— vs 4 wk</span>';
  if(change){
    const d = round1(change.delta);
    const cls = d === 0 || !goodWhen ? 'flat' : (d < 0) === (goodWhen === 'down') ? 'good' : 'bad';
    delta = `<span class="body-delta ${cls}">${d > 0 ? '+' : ''}${d} ${unit} vs 4 wk</span>`;
  }
  return `<div class="body-tile"><div class="body-tile-label">${label}</div><div class="body-tile-value">${val}</div>${delta}</div>`;
}

function recompCardHtml(v){
  const deltas = v.status === 'ok' ? `<div class="recomp-deltas">${recompDeltaLine(v)}</div>` : '';
  return `
    <div class="chart-card recomp-card">
      <div class="chart-title">Recomposition — last 4 weeks</div>
      <div class="recomp-verdict tone-${v.tone}">${v.verdict}</div>
      ${deltas}
      <div class="recomp-advice">${v.status === 'ok' ? v.advice : v.message}</div>
      <div class="recomp-note">Based on 7-day averages over the last 4 weeks</div>
    </div>`;
}

function renderBodyView(){
  const wrap = document.getElementById('bodyContent');
  if(!wrap) return;
  const card = document.getElementById('recompCard');
  if(card) card.innerHTML = body.length ? recompCardHtml(recompVerdict(body, sessions, new Date())) : '';
  if(!body.length){
    wrap.innerHTML = `<div class="empty-state"><span class="big">No body data yet</span>Import your Renpho CSV to see body composition trends</div>`;
    return;
  }

  const daily = dailyFirst(body);
  const latest = daily[daily.length - 1];
  const lastDay = dayIndex(latest.date);
  const sinceDay = bodyRange === 'all' ? dayIndex(daily[0].date) : lastDay - BODY_RANGE_DAYS;
  const ma = f=> movingAverage(daily, f);
  const raw = f=> daily.filter(d=> d[f] != null).map(d=> ({ x: dayIndex(d.date), y: d[f] }));
  const line = f=> ma(f).map(p=> ({ x: dayIndex(p.date), y: p.value }));
  const chartOpts = (label, fmtY, minSpan)=> ({ label, minX: sinceDay, maxX: lastDay, xLabel: dayLabel, fmtY, minSpan });

  const tiles = [
    bodyTileHtml('Weight', latest.weight, 'kg', changeOver(ma('weight')), null),
    bodyTileHtml('Fat mass', latest.fatMass, 'kg', changeOver(ma('fatMass')), 'down'),
    bodyTileHtml('Body fat', latest.bodyFatPct, '%', changeOver(ma('bodyFatPct')), 'down'),
    bodyTileHtml('Skeletal muscle', latest.skeletalMuscleMass, 'kg', changeOver(ma('skeletalMuscleMass')), 'up')
  ].join('');

  const trendCard = (title, f, unit, minSpan)=> `
    <div class="chart-card">
      <div class="chart-title">${title} — ${BODY_MA_DAYS}-day average</div>
      ${svgLineChart([
        { points: raw(f), kind:'dots', cls:'lc-raw' },
        { points: line(f), kind:'line', cls:'lc-ma' }
      ], chartOpts(title, v=> `${round1(v)}`, minSpan)) || '<div class="body-note">Not enough readings yet.</div>'}
      <div class="lc-legend"><span class="lg lg-raw">daily (${unit})</span><span class="lg lg-ma">${BODY_MA_DAYS}-day avg</span></div>
    </div>`;

  const recomp = recompositionSeries(daily, sinceDay);
  const toXY = list=> list.map(p=> ({ x: dayIndex(p.date), y: p.value }));
  const recompSvg = svgLineChart([
    { points: toXY(recomp.fat), kind:'line', cls:'lc-fat' },
    { points: toXY(recomp.muscle), kind:'line', cls:'lc-muscle' }
  ], { ...chartOpts('Recomposition', v=> `${v > 0 ? '+' : ''}${round1(v)}`, 1), refY: 0 });

  const firstWeek = weekKey(dayFromIndex(Math.max(sinceDay, dayIndex(daily[0].date))));
  const weeks = weeksBetween(firstWeek, latest.date);
  const strength = weeklyStrengthIndex(sessions, weeks).filter(s=> s.index != null);
  const strengthSvg = svgLineChart([
    { points: strength.map(s=> ({ x: dayIndex(s.week), y: s.index })), kind:'line', cls:'lc-strength', markers: true }
  ], { ...chartOpts('Strength index', v=> `${Math.round(v)}`, 4), refY: 100, height: 110 });

  const rangeBtn = (key, text)=> `<button type="button" class="range-btn${bodyRange === key ? ' active' : ''}" data-range="${key}">${text}</button>`;
  wrap.innerHTML = `
    <div class="chart-card">
      <div class="chart-title">Latest weigh-in — ${latest.date} ${latest.time.slice(0, 5)}</div>
      <div class="body-tiles">${tiles}</div>
    </div>
    <div class="stats-toggle body-range">${rangeBtn('recent', `${BODY_RANGE_DAYS}d`)}${rangeBtn('all', 'All')}</div>
    ${trendCard('Weight', 'weight', 'kg', 1)}
    ${trendCard('Body fat', 'bodyFatPct', '%', 1)}
    <div class="chart-card">
      <div class="chart-title">Recomposition — change since start of range (kg, ${BODY_MA_DAYS}-day avg)</div>
      ${recompSvg || '<div class="body-note">Not enough composition readings yet.</div>'}
      <div class="lc-legend"><span class="lg lg-fat">fat mass</span><span class="lg lg-muscle">skeletal muscle</span></div>
      <div class="chart-title body-subtitle">Strength index — weekly, first week = 100</div>
      ${strengthSvg || '<div class="body-note">Needs lifts with at least 3 loaded sessions.</div>'}
    </div>`;

  wrap.querySelectorAll('.range-btn').forEach(btn=> btn.addEventListener('click', ()=>{
    bodyRange = btn.dataset.range;
    renderBodyView();
  }));
}

async function importRenphoCsv(file){
  // Any file can be picked (Drive may drop the .csv name/type): the Renpho headers decide. Size guard only.
  if(file.size > 20 * 1024 * 1024){
    flashMsg('bodyMsg', 'This file is too large to be a Renpho CSV. Nothing was changed.', true);
    return;
  }
  let text;
  try{
    text = await file.text();
  }catch(e){
    flashMsg('bodyMsg', 'Could not read the file. Nothing was changed.', true);
    return;
  }
  const parsed = parseRenphoCsv(text);
  if(parsed.error){
    flashMsg('bodyMsg', `${parsed.error} Nothing was changed.`, true);
    return;
  }
  const { merged, added, from, to } = mergeWeighIns(body, parsed.weighIns);
  if(added.length){
    const previous = body;
    body = merged;
    if(!persistBody()){
      body = previous;
      flashMsg('bodyMsg', 'Could not save the weigh-ins (storage full?). Nothing was changed.', true);
      return;
    }
  }
  showToast(renphoImportMessage(added.length, from, to, parsed.skipped));
  renderBodyView();
}

/* ---------------- KEEP SCREEN ON (Screen Wake Lock) ---------------- */
// Every path is wrapped so a missing or refused wake lock never surfaces as an error.
const WAKE_KEY = 'rack-keep-screen-on';
let wakeLockSentinel = null;
let wakeLockPending = false;
let wakeRetryArmed = false;

function wakeLockSupported(){
  try{
    return !!(navigator.wakeLock && typeof navigator.wakeLock.request === 'function');
  }catch(e){
    return false;
  }
}

// On by default: only an explicit "off" disables it.
function keepScreenOnPref(){
  try{
    return localStorage.getItem(WAKE_KEY) !== 'off';
  }catch(e){
    return true;
  }
}

function setKeepScreenOnPref(on){
  try{ localStorage.setItem(WAKE_KEY, on ? 'on' : 'off'); }catch(e){}
}

function updateWakeButton(){
  const btn = document.getElementById('wakeBtn');
  if(!btn) return;
  const held = !!wakeLockSentinel;
  btn.classList.toggle('active', held);
  btn.setAttribute('aria-pressed', held ? 'true' : 'false');
  btn.title = held ? 'Screen stays on (tap to allow sleep)' : 'Keep screen on';
}

// fromIcon: an explicit tap on the toggle, the only case that reports a refusal with a toast
// (silent failures arm a retry on the next tap anywhere, which may be all a browser needs).
async function requestWakeLock(fromIcon){
  if(!wakeLockSupported() || !keepScreenOnPref() || wakeLockSentinel || wakeLockPending) return;
  if(document.visibilityState !== 'visible') return;
  wakeLockPending = true;
  try{
    const sentinel = await navigator.wakeLock.request('screen');
    // Switched off while the request was in flight: give the lock straight back.
    if(!keepScreenOnPref()){
      try{ await sentinel.release(); }catch(e){}
      return;
    }
    wakeLockSentinel = sentinel;
    disarmWakeRetry();
    sentinel.addEventListener('release', ()=>{
      if(wakeLockSentinel === sentinel) wakeLockSentinel = null;
      updateWakeButton();
    });
  }catch(e){
    if(fromIcon) showToast('Screen lock not available (battery saver?)');
    else armWakeRetry();
  }finally{
    wakeLockPending = false;
    updateWakeButton();
  }
}

function onWakeRetryGesture(e){
  // A tap on the toggle itself is handled by toggleKeepScreenOn (which reports refusals).
  if(e && e.target && e.target.closest && e.target.closest('#wakeBtn')) return;
  disarmWakeRetry();
  requestWakeLock(false);
}

function armWakeRetry(){
  if(wakeRetryArmed || !keepScreenOnPref()) return;
  wakeRetryArmed = true;
  document.addEventListener('click', onWakeRetryGesture, true);
  document.addEventListener('touchend', onWakeRetryGesture, true);
}

function disarmWakeRetry(){
  if(!wakeRetryArmed) return;
  wakeRetryArmed = false;
  document.removeEventListener('click', onWakeRetryGesture, true);
  document.removeEventListener('touchend', onWakeRetryGesture, true);
}

async function toggleKeepScreenOn(){
  if(wakeLockSentinel){
    setKeepScreenOnPref(false);
    disarmWakeRetry();
    const sentinel = wakeLockSentinel;
    wakeLockSentinel = null;
    try{ await sentinel.release(); }catch(e){}
    updateWakeButton();
  } else {
    setKeepScreenOnPref(true);
    await requestWakeLock(true);
  }
}

function initKeepScreenOn(){
  try{
    if(!wakeLockSupported()) return;  // button stays hidden
    const btn = document.getElementById('wakeBtn');
    btn.style.display = '';
    btn.addEventListener('click', toggleKeepScreenOn);
    // The browser drops the lock when the app is hidden or the screen turns off.
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible' && keepScreenOnPref()) requestWakeLock(false);
    });
    updateWakeButton();
    if(keepScreenOnPref()) requestWakeLock(false);
  }catch(e){}
}

/* ---------------- PROGRAM REORDER (long press + drag) ---------------- */
const LONG_PRESS_MS = 400;
const PRESS_MOVE_TOLERANCE = 10;
const AUTOSCROLL_EDGE = 80;
const AUTOSCROLL_MAX_SPEED = 14;
let reorder = null;

function prefersReducedMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

function showToast(text){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=> el.classList.remove('show'), 1600);
}

// Index the dragged card will take: how many other cards' centers lie above its center.
function computeTargetIndex(centers, from, draggedCenter){
  let to = 0;
  centers.forEach((c, i)=>{ if(i !== from && c < draggedCenter) to++; });
  return to;
}

// New exercise order after `moved` was dropped. `domOrder` lists each card's source entry in its new
// on-screen order; entries not in `exercises` (unsaved new cards) are skipped, and exercises without
// a card (removed but not yet saved) keep their place. Returns null when `moved` is not saved yet.
function reorderProgramExercises(exercises, domOrder, moved){
  if(!exercises.includes(moved)) return null;
  const rest = exercises.filter(e=> e !== moved);
  const pos = domOrder.indexOf(moved);
  const next = domOrder.slice(pos + 1).find(e=> rest.includes(e));
  if(next){
    rest.splice(rest.indexOf(next), 0, moved);
    return rest;
  }
  const prev = domOrder.slice(0, pos).reverse().find(e=> rest.includes(e));
  if(prev){
    rest.splice(rest.indexOf(prev) + 1, 0, moved);
    return rest;
  }
  return exercises.slice();
}

// Keys like name + occurrence, so two exercises with the same name in a day stay distinct.
function occurrenceKeys(names){
  const seen = {};
  return names.map(n=>{
    seen[n] = (seen[n] || 0) + 1;
    return JSON.stringify([n, seen[n]]);
  });
}

// Today's unsaved inputs (Today maps inputs to exercises by position, so they must follow the reorder).
// Keyed by the PROGRAM entry itself, which reordering moves but never recreates; name + occurrence
// is the fallback. Either way two exercises with the same name stay distinct.
function captureTodayInputs(){
  const exercises = PROGRAM[currentDay].exercises;
  const keys = occurrenceKeys(exercises.map(e=> e.name));
  const byEx = new Map();
  const byKey = {};
  document.querySelectorAll('#exerciseList .exercise-card').forEach(card=>{
    const idx = parseInt(card.dataset.exIdx);
    if(!exercises[idx]) return;
    const values = {
      weights: [...card.querySelectorAll('.w-input')].map(i=> i.value),
      reps: [...card.querySelectorAll('.r-input')].map(i=> i.value),
      done: [...card.querySelectorAll('.set-row')].map(row=> row.classList.contains('done'))
    };
    byEx.set(exercises[idx], values);
    byKey[keys[idx]] = values;
  });
  return {
    byEx,
    byKey,
    note: document.getElementById('sessionNote').value,
    noteOpen: document.getElementById('noteFieldWrap').style.display === 'block'
  };
}

function restoreTodayInputs(state){
  const exercises = PROGRAM[currentDay].exercises;
  const keys = occurrenceKeys(exercises.map(e=> e.name));
  document.querySelectorAll('#exerciseList .exercise-card').forEach(card=>{
    const idx = parseInt(card.dataset.exIdx);
    const saved = state.byEx.get(exercises[idx]) || state.byKey[keys[idx]];
    if(!saved) return;
    card.querySelectorAll('.w-input').forEach((inp, i)=>{ if(saved.weights[i] !== undefined) inp.value = saved.weights[i]; });
    card.querySelectorAll('.r-input').forEach((inp, i)=>{ if(saved.reps[i] !== undefined) inp.value = saved.reps[i]; });
    // Confirmed state comes back with the values; placeholders were recomputed by renderExercises().
    if(card._setDone) (saved.done || []).forEach((done, i)=>{ if(done) card._setDone(i, true); });
    const first = card.querySelector('.w-input');
    if(first) first.dispatchEvent(new Event('input'));  // refresh the plate-load bar
  });
  document.getElementById('sessionNote').value = state.note;
  if(state.noteOpen || state.note){
    document.getElementById('noteFieldWrap').style.display = 'block';
    document.getElementById('noteToggleBtn').style.display = 'none';
  }
}

// Persists only the new order; other unsaved edits in the editor still wait for "Save program".
function saveReorderedProgram(card){
  const list = document.getElementById('programExList');
  const exercises = PROGRAM[programDay].exercises;
  const domOrder = [...list.querySelectorAll(':scope > .program-ex-card')].map(c=> c._sourceEx);
  const next = reorderProgramExercises(exercises, domOrder, card._sourceEx);
  if(!next){
    showToast('Order updated — tap Save program');
    return;
  }

  const todayState = currentDay === programDay ? captureTodayInputs() : null;
  PROGRAM[programDay].exercises = next;
  persistProgram();
  document.getElementById('exerciseSelect').innerHTML = '';
  if(todayState){
    renderExercises();
    restoreTodayInputs(todayState);
  }
  showToast('Order saved');
}

function attachReorder(card, pressArea){
  let press = null;

  function cancelPress(){
    if(press){ clearTimeout(press.timer); press = null; }
  }

  pressArea.addEventListener('contextmenu', e=> e.preventDefault());

  pressArea.addEventListener('pointerdown', e=>{
    if(reorder || !e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
    cancelPress();
    press = {
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      lastY: e.clientY,
      timer: setTimeout(()=>{
        const y = press.lastY, id = press.pointerId;
        press = null;
        startReorder(card, id, y);
      }, LONG_PRESS_MS)
    };
  });

  card.addEventListener('pointermove', e=>{
    if(press && e.pointerId === press.pointerId){
      press.lastY = e.clientY;
      if(Math.hypot(e.clientX - press.startX, e.clientY - press.startY) > PRESS_MOVE_TOLERANCE) cancelPress();
      return;
    }
    if(reorder && reorder.card === card && e.pointerId === reorder.pointerId && !reorder.ending){
      reorder.lastClientY = e.clientY;
      updateReorder();
    }
  });

  function onPointerEnd(e){
    if(press && e.pointerId === press.pointerId){ cancelPress(); return; }
    if(reorder && reorder.card === card && e.pointerId === reorder.pointerId && !reorder.ending){
      endReorder(e.type === 'pointerup');
    }
  }
  card.addEventListener('pointerup', onPointerEnd);
  card.addEventListener('pointercancel', onPointerEnd);

  // Once dragging, stop the browser from turning the gesture into a page scroll (which would cancel the pointer).
  card.addEventListener('touchmove', e=>{
    if(reorder && reorder.card === card) e.preventDefault();
  }, { passive:false });
}

function startReorder(card, pointerId, clientY){
  const list = card.parentElement;
  card.classList.remove('expanded');  // collapse first so positions are measured on the compact layout

  const cards = [...list.querySelectorAll(':scope > .program-ex-card')];
  const scrollY0 = window.scrollY;
  const rects = cards.map(c=> c.getBoundingClientRect());

  reorder = {
    card, list, cards, pointerId,
    from: cards.indexOf(card),
    to: cards.indexOf(card),
    tops: rects.map(r=> r.top + scrollY0),
    heights: rects.map(r=> r.height),
    gap: parseFloat(getComputedStyle(card).marginBottom) || 0,
    startPageY: clientY + scrollY0,
    lastClientY: clientY,
    reduced: prefersReducedMotion(),
    raf: null,
    ending: false
  };

  try{ card.setPointerCapture(pointerId); }catch(e){}
  if(navigator.vibrate) navigator.vibrate(30);
  document.body.classList.add('reordering');
  cards.forEach(c=>{ if(c !== card) c.classList.add('reorder-shift'); });
  card.classList.add('dragging');
  card._suppressClick = true;
  updateReorder();
  reorder.raf = requestAnimationFrame(autoScrollTick);
}

function updateReorder(){
  const r = reorder;
  const last = r.cards.length - 1;
  const minDy = r.tops[0] - r.tops[r.from];
  const maxDy = (r.tops[last] + r.heights[last]) - (r.tops[r.from] + r.heights[r.from]);
  const dy = Math.max(minDy, Math.min(maxDy, r.lastClientY + window.scrollY - r.startPageY));

  const centers = r.tops.map((t, i)=> t + r.heights[i] / 2);
  r.to = computeTargetIndex(centers, r.from, centers[r.from] + dy);

  const step = r.heights[r.from] + r.gap;
  r.cards.forEach((c, i)=>{
    if(i === r.from) return;
    let shift = 0;
    if(r.from < i && i <= r.to) shift = -step;
    else if(r.to <= i && i < r.from) shift = step;
    c.style.transform = shift ? `translateY(${shift}px)` : '';
  });
  r.card.style.transform = `translateY(${dy}px)` + (r.reduced ? '' : ' scale(1.03)');
}

function autoScrollTick(){
  const r = reorder;
  if(!r || r.ending) return;
  const nav = document.querySelector('.bottom-nav');
  const bottom = Math.min(window.innerHeight, nav ? nav.getBoundingClientRect().top : window.innerHeight);
  const y = r.lastClientY;

  let speed = 0;
  if(y < AUTOSCROLL_EDGE){
    speed = -AUTOSCROLL_MAX_SPEED * Math.min(1, (AUTOSCROLL_EDGE - y) / AUTOSCROLL_EDGE);
  } else if(y > bottom - AUTOSCROLL_EDGE){
    speed = AUTOSCROLL_MAX_SPEED * Math.min(1, (y - (bottom - AUTOSCROLL_EDGE)) / AUTOSCROLL_EDGE);
  }
  if(speed){
    const before = window.scrollY;
    window.scrollBy(0, Math.sign(speed) * Math.max(1, Math.round(Math.abs(speed))));
    if(window.scrollY !== before) updateReorder();
  }
  r.raf = requestAnimationFrame(autoScrollTick);
}

// commit=false (pointercancel) slides the card back without saving.
function endReorder(commit){
  const r = reorder;
  r.ending = true;
  cancelAnimationFrame(r.raf);
  const to = commit ? r.to : r.from;

  let offset = 0;
  if(to > r.from) for(let i = r.from + 1; i <= to; i++) offset += r.heights[i] + r.gap;
  else for(let i = to; i < r.from; i++) offset -= r.heights[i] + r.gap;
  if(!commit) r.cards.forEach(c=>{ if(c !== r.card) c.style.transform = ''; });

  let finished = false;
  const finish = ()=>{
    if(finished) return;
    finished = true;
    r.cards.forEach(c=>{
      c.style.transform = '';
      c.classList.remove('reorder-shift', 'dragging', 'settling');
    });
    document.body.classList.remove('reordering');
    // A click, if any, arrives right after pointerup; after that, taps toggle the card again.
    setTimeout(()=>{ r.card._suppressClick = false; }, 400);
    if(to !== r.from){
      const others = r.cards.filter(c=> c !== r.card);
      r.list.insertBefore(r.card, others[to] || null);
    }
    reorder = null;
    if(to !== r.from) saveReorderedProgram(r.card);
  };

  if(r.reduced){
    finish();
    return;
  }
  r.card.classList.add('settling');
  r.card.style.transform = `translateY(${offset}px)`;
  r.card.addEventListener('transitionend', finish, { once:true });
  setTimeout(finish, 260);
}

function buildProgramExRow(ex, startExpanded){
  const card = document.createElement('div');
  card.className = 'program-ex-card' + (startExpanded ? ' expanded' : '');
  card.innerHTML = `
    <div class="program-ex-summary">
      <div>
        <div class="program-ex-summary-text">${ex.name || 'New exercise'}</div>
        <div class="program-ex-summary-sub">${ex.sets || 3} × ${ex.reps || '8-10'}</div>
      </div>
      <span class="program-ex-actions">
        <span class="program-ex-handle" aria-hidden="true">${HANDLE_SVG}</span>
        <span class="program-ex-chevron">${CHEVRON_SVG}</span>
      </span>
    </div>
    <div class="program-ex-body">
      <div class="program-field-row">
        <div class="program-field">
          <label>Exercise name</label>
          <input type="text" class="p-name" value="${ex.name ? ex.name.replace(/"/g,'&quot;') : ''}">
        </div>
      </div>
      <div class="program-field-row">
        <div class="program-field">
          <label>Sets</label>
          <input type="number" class="p-sets" min="1" value="${ex.sets != null ? ex.sets : 3}">
        </div>
        <div class="program-field">
          <label>Reps</label>
          <input type="text" class="p-reps" value="${ex.reps ? ex.reps.replace(/"/g,'&quot;') : ''}" placeholder="e.g. 8-10">
        </div>
      </div>
      <div class="program-field-row">
        <div class="program-field">
          <label>Injury tag (optional)</label>
          <input type="text" class="p-injury" value="${ex.injury ? ex.injury.replace(/"/g,'&quot;') : ''}" placeholder="e.g. tailbone">
        </div>
        <div class="program-field">
          <label>Increment (kg)</label>
          <input type="number" class="p-increment" inputmode="decimal" min="0.5" step="0.5" value="${ex.increment != null ? ex.increment : ''}" placeholder="${DEFAULT_INCREMENT}">
        </div>
      </div>
      <div class="program-field-row single">
        <div class="program-field">
          <label>Note (optional)</label>
          <textarea class="p-note" rows="2">${ex.note ? ex.note : ''}</textarea>
        </div>
      </div>
      <button class="program-remove-btn">Remove exercise</button>
    </div>
  `;

  const summary = card.querySelector('.program-ex-summary');
  const summaryText = card.querySelector('.program-ex-summary-text');
  const summarySub = card.querySelector('.program-ex-summary-sub');
  summary.addEventListener('click', ()=>{
    // The click that some browsers fire right after a drag must not toggle the card.
    if(card._suppressClick){ card._suppressClick = false; return; }
    card.classList.toggle('expanded');
  });

  // The PROGRAM entry this card was built from (absent from PROGRAM for unsaved new cards).
  card._sourceEx = ex;
  attachReorder(card, summary);

  const nameInput = card.querySelector('.p-name');
  const setsInput = card.querySelector('.p-sets');
  const repsInput = card.querySelector('.p-reps');
  function syncSummary(){
    summaryText.textContent = nameInput.value.trim() || 'New exercise';
    summarySub.textContent = `${setsInput.value || 3} × ${repsInput.value || '8-10'}`;
  }
  [nameInput, setsInput, repsInput].forEach(inp=> inp.addEventListener('input', syncSummary));

  card.querySelector('.program-remove-btn').addEventListener('click', (e)=>{
    e.stopPropagation();
    card.remove();
  });

  return card;
}

function addProgramExercise(){
  const list = document.getElementById('programExList');
  const row = buildProgramExRow({ name:'', sets:3, reps:'', injury:'', note:'' }, true);
  list.appendChild(row);
  row.scrollIntoView({ behavior:'smooth', block:'center' });
  row.querySelector('.p-name').focus();
}

function saveProgram(){
  const cards = document.querySelectorAll('#programExList .program-ex-card');
  const newExercises = [];
  cards.forEach(card=>{
    const name = card.querySelector('.p-name').value.trim();
    if(!name) return;
    const sets = parseInt(card.querySelector('.p-sets').value) || 3;
    const reps = card.querySelector('.p-reps').value.trim() || '8-10';
    const injury = card.querySelector('.p-injury').value.trim();
    const note = card.querySelector('.p-note').value.trim();
    const increment = parseFloat(card.querySelector('.p-increment').value);
    const exObj = { name, sets, reps };
    if(injury) exObj.injury = injury;
    if(note) exObj.note = note;
    if(increment > 0) exObj.increment = increment;  // optional: absent means DEFAULT_INCREMENT
    // Not an editor field: carry over the stall acknowledgement from the entry this card was built from.
    if(card._sourceEx && card._sourceEx.stallAck) exObj.stallAck = card._sourceEx.stallAck;
    newExercises.push(exObj);
  });

  PROGRAM[programDay].exercises = newExercises;
  persistProgram();

  document.getElementById('exerciseSelect').innerHTML = '';
  if(currentDay === programDay) renderExercises();
  renderDayRack();
  renderProgramExList();

  const msg = document.getElementById('programSavedMsg');
  msg.textContent = '✓ Program saved';
  setTimeout(()=>{ msg.textContent=''; }, 2500);
}

function resetProgramDay(){
  PROGRAM[programDay] = JSON.parse(JSON.stringify(DEFAULT_PROGRAM[programDay]));
  persistProgram();
  document.getElementById('exerciseSelect').innerHTML = '';
  if(currentDay === programDay) renderExercises();
  renderDayRack();
  renderProgramExList();

  const msg = document.getElementById('programSavedMsg');
  msg.textContent = '✓ Reset to defaults';
  setTimeout(()=>{ msg.textContent=''; }, 2500);
}

/* ---------------- REST TIMER ---------------- */
let timerSeconds = 90;
let timerRemaining = 90;
let timerInterval = null;
let timerRunning = false;

function formatTime(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  el.textContent = formatTime(timerRemaining);
  el.classList.toggle('timer-done', timerRemaining === 0);
}

function timerBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const playTone = (delay)=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      }, delay);
    };
    playTone(0);
    playTone(300);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

function startTimer(){
  if(timerRunning) return;
  timerRunning = true;
  document.getElementById('timerToggle').textContent = 'Pause';
  timerInterval = setInterval(()=>{
    timerRemaining--;
    updateTimerDisplay();
    if(timerRemaining <= 0){
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('timerToggle').textContent = 'Start';
      timerBeep();
    }
  }, 1000);
}

function pauseTimer(){
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('timerToggle').textContent = 'Start';
}

function resetTimer(){
  pauseTimer();
  timerRemaining = timerSeconds;
  updateTimerDisplay();
}

function initTimer(){
  const fab = document.getElementById('timerFab');
  const panel = document.getElementById('timerPanel');
  fab.addEventListener('click', ()=>{
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  });
  document.querySelectorAll('.timer-preset').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.timer-preset').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      timerSeconds = parseInt(btn.dataset.secs);
      resetTimer();
    });
  });
  document.getElementById('timerToggle').addEventListener('click', ()=>{
    if(timerRunning) pauseTimer(); else startTimer();
  });
  document.getElementById('timerMinus').addEventListener('click', ()=>{
    timerSeconds = Math.max(15, timerSeconds - 15);
    resetTimer();
  });
  document.getElementById('timerPlus').addEventListener('click', ()=>{
    timerSeconds = timerSeconds + 15;
    resetTimer();
  });
  document.getElementById('timerReset').addEventListener('click', resetTimer);
  updateTimerDisplay();
}

init();
initTimer();
</script>
