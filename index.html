/* ---------------- KEEP SCREEN ON (Screen Wake Lock) ---------------- */
// Every path is wrapped so a missing or refused wake lock never surfaces as an error.
const WAKE_KEY = 'rack-keep-screen-on';
let wakeLockSentinel = null;
let wakeLockPending = false;
let wakeRetryArmed = false;

function wakeLockSupported(){
  try{
    return !!(navigator.wakeLock && typeof navigator.wakeLock.request === 'function');
  }catch(e){
    return false;
  }
}

// On by default: only an explicit "off" disables it.
function keepScreenOnPref(){
  try{
    return localStorage.getItem(WAKE_KEY) !== 'off';
  }catch(e){
    return true;
  }
}

function setKeepScreenOnPref(on){
  try{ localStorage.setItem(WAKE_KEY, on ? 'on' : 'off'); }catch(e){}
}

function updateWakeButton(){
  const btn = document.getElementById('wakeBtn');
  if(!btn) return;
  const held = !!wakeLockSentinel;
  btn.classList.toggle('active', held);
  btn.setAttribute('aria-pressed', held ? 'true' : 'false');
  btn.title = held ? 'Screen stays on (tap to allow sleep)' : 'Keep screen on';
}

// fromIcon: an explicit tap on the toggle, the only case that reports a refusal with a toast
// (silent failures arm a retry on the next tap anywhere, which may be all a browser needs).
async function requestWakeLock(fromIcon){
  if(!wakeLockSupported() || !keepScreenOnPref() || wakeLockSentinel || wakeLockPending) return;
  if(document.visibilityState !== 'visible') return;
  wakeLockPending = true;
  try{
    const sentinel = await navigator.wakeLock.request('screen');
    // Switched off while the request was in flight: give the lock straight back.
    if(!keepScreenOnPref()){
      try{ await sentinel.release(); }catch(e){}
      return;
    }
    wakeLockSentinel = sentinel;
    disarmWakeRetry();
    sentinel.addEventListener('release', ()=>{
      if(wakeLockSentinel === sentinel) wakeLockSentinel = null;
      updateWakeButton();
    });
  }catch(e){
    if(fromIcon) showToast('Screen lock not available (battery saver?)');
    else armWakeRetry();
  }finally{
    wakeLockPending = false;
    updateWakeButton();
  }
}

function onWakeRetryGesture(e){
  // A tap on the toggle itself is handled by toggleKeepScreenOn (which reports refusals).
  if(e && e.target && e.target.closest && e.target.closest('#wakeBtn')) return;
  disarmWakeRetry();
  requestWakeLock(false);
}

function armWakeRetry(){
  if(wakeRetryArmed || !keepScreenOnPref()) return;
  wakeRetryArmed = true;
  document.addEventListener('click', onWakeRetryGesture, true);
  document.addEventListener('touchend', onWakeRetryGesture, true);
}

function disarmWakeRetry(){
  if(!wakeRetryArmed) return;
  wakeRetryArmed = false;
  document.removeEventListener('click', onWakeRetryGesture, true);
  document.removeEventListener('touchend', onWakeRetryGesture, true);
}

async function toggleKeepScreenOn(){
  if(wakeLockSentinel){
    setKeepScreenOnPref(false);
    disarmWakeRetry();
    const sentinel = wakeLockSentinel;
    wakeLockSentinel = null;
    try{ await sentinel.release(); }catch(e){}
    updateWakeButton();
  } else {
    setKeepScreenOnPref(true);
    await requestWakeLock(true);
  }
}

function initKeepScreenOn(){
  try{
    if(!wakeLockSupported()) return;  // button stays hidden
    const btn = document.getElementById('wakeBtn');
    btn.style.display = '';
    btn.addEventListener('click', toggleKeepScreenOn);
    // The browser drops the lock when the app is hidden or the screen turns off.
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible' && keepScreenOnPref()) requestWakeLock(false);
    });
    updateWakeButton();
    if(keepScreenOnPref()) requestWakeLock(false);
  }catch(e){}
}

/* ---------------- PROGRAM REORDER (long press + drag) ---------------- */
const LONG_PRESS_MS = 400;
const PRESS_MOVE_TOLERANCE = 10;
const AUTOSCROLL_EDGE = 80;
const AUTOSCROLL_MAX_SPEED = 14;
let reorder = null;

function prefersReducedMotion(){
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

function showToast(text){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=> el.classList.remove('show'), 1600);
}

// Index the dragged card will take: how many other cards' centers lie above its center.
function computeTargetIndex(centers, from, draggedCenter){
  let to = 0;
  centers.forEach((c, i)=>{ if(i !== from && c < draggedCenter) to++; });
  return to;
}

// New exercise order after `moved` was dropped. `domOrder` lists each card's source entry in its new
// on-screen order; entries not in `exercises` (unsaved new cards) are skipped, and exercises without
// a card (removed but not yet saved) keep their place. Returns null when `moved` is not saved yet.
function reorderProgramExercises(exercises, domOrder, moved){
  if(!exercises.includes(moved)) return null;
  const rest = exercises.filter(e=> e !== moved);
  const pos = domOrder.indexOf(moved);
  const next = domOrder.slice(pos + 1).find(e=> rest.includes(e));
  if(next){
    rest.splice(rest.indexOf(next), 0, moved);
    return rest;
  }
  const prev = domOrder.slice(0, pos).reverse().find(e=> rest.includes(e));
  if(prev){
    rest.splice(rest.indexOf(prev) + 1, 0, moved);
    return rest;
  }
  return exercises.slice();
}

// Keys like name + occurrence, so two exercises with the same name in a day stay distinct.
function occurrenceKeys(names){
  const seen = {};
  return names.map(n=>{
    seen[n] = (seen[n] || 0) + 1;
    return JSON.stringify([n, seen[n]]);
  });
}

// Today's unsaved inputs (Today maps inputs to exercises by position, so they must follow the reorder).
// Keyed by the PROGRAM entry itself, which reordering moves but never recreates; name + occurrence
// is the fallback. Either way two exercises with the same name stay distinct.
function captureTodayInputs(){
  const exercises = PROGRAM[currentDay].exercises;
  const keys = occurrenceKeys(exercises.map(e=> e.name));
  const byEx = new Map();
  const byKey = {};
  document.querySelectorAll('#exerciseList .exercise-card').forEach(card=>{
    const idx = parseInt(card.dataset.exIdx);
    if(!exercises[idx]) return;
    const values = {
      weights: [...card.querySelectorAll('.w-input')].map(i=> i.value),
      reps: [...card.querySelectorAll('.r-input')].map(i=> i.value)
    };
    byEx.set(exercises[idx], values);
    byKey[keys[idx]] = values;
  });
  return {
    byEx,
    byKey,
    note: document.getElementById('sessionNote').value,
    noteOpen: document.getElementById('noteFieldWrap').style.display === 'block'
  };
}

function restoreTodayInputs(state){
  const exercises = PROGRAM[currentDay].exercises;
  const keys = occurrenceKeys(exercises.map(e=> e.name));
  document.querySelectorAll('#exerciseList .exercise-card').forEach(card=>{
    const idx = parseInt(card.dataset.exIdx);
    const saved = state.byEx.get(exercises[idx]) || state.byKey[keys[idx]];
    if(!saved) return;
    card.querySelectorAll('.w-input').forEach((inp, i)=>{ if(saved.weights[i] !== undefined) inp.value = saved.weights[i]; });
    card.querySelectorAll('.r-input').forEach((inp, i)=>{ if(saved.reps[i] !== undefined) inp.value = saved.reps[i]; });
    const first = card.querySelector('.w-input');
    if(first) first.dispatchEvent(new Event('input'));  // refresh the plate-load bar
  });
  document.getElementById('sessionNote').value = state.note;
  if(state.noteOpen || state.note){
    document.getElementById('noteFieldWrap').style.display = 'block';
    document.getElementById('noteToggleBtn').style.display = 'none';
  }
}

// Persists only the new order; other unsaved edits in the editor still wait for "Save program".
function saveReorderedProgram(card){
  const list = document.getElementById('programExList');
  const exercises = PROGRAM[programDay].exercises;
  const domOrder = [...list.querySelectorAll(':scope > .program-ex-card')].map(c=> c._sourceEx);
  const next = reorderProgramExercises(exercises, domOrder, card._sourceEx);
  if(!next){
    showToast('Order updated — tap Save program');
    return;
  }

  const todayState = currentDay === programDay ? captureTodayInputs() : null;
  PROGRAM[programDay].exercises = next;
  persistProgram();
  document.getElementById('exerciseSelect').innerHTML = '';
  if(todayState){
    renderExercises();
    restoreTodayInputs(todayState);
  }
  showToast('Order saved');
}

function attachReorder(card, pressArea){
  let press = null;

  function cancelPress(){
    if(press){ clearTimeout(press.timer); press = null; }
  }

  pressArea.addEventListener('contextmenu', e=> e.preventDefault());

  pressArea.addEventListener('pointerdown', e=>{
    if(reorder || !e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
    cancelPress();
    press = {
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      lastY: e.clientY,
      timer: setTimeout(()=>{
        const y = press.lastY, id = press.pointerId;
        press = null;
        startReorder(card, id, y);
      }, LONG_PRESS_MS)
    };
  });

  card.addEventListener('pointermove', e=>{
    if(press && e.pointerId === press.pointerId){
      press.lastY = e.clientY;
      if(Math.hypot(e.clientX - press.startX, e.clientY - press.startY) > PRESS_MOVE_TOLERANCE) cancelPress();
      return;
    }
    if(reorder && reorder.card === card && e.pointerId === reorder.pointerId && !reorder.ending){
      reorder.lastClientY = e.clientY;
      updateReorder();
    }
  });

  function onPointerEnd(e){
    if(press && e.pointerId === press.pointerId){ cancelPress(); return; }
    if(reorder && reorder.card === card && e.pointerId === reorder.pointerId && !reorder.ending){
      endReorder(e.type === 'pointerup');
    }
  }
  card.addEventListener('pointerup', onPointerEnd);
  card.addEventListener('pointercancel', onPointerEnd);

  // Once dragging, stop the browser from turning the gesture into a page scroll (which would cancel the pointer).
  card.addEventListener('touchmove', e=>{
    if(reorder && reorder.card === card) e.preventDefault();
  }, { passive:false });
}

function startReorder(card, pointerId, clientY){
  const list = card.parentElement;
  card.classList.remove('expanded');  // collapse first so positions are measured on the compact layout

  const cards = [...list.querySelectorAll(':scope > .program-ex-card')];
  const scrollY0 = window.scrollY;
  const rects = cards.map(c=> c.getBoundingClientRect());

  reorder = {
    card, list, cards, pointerId,
    from: cards.indexOf(card),
    to: cards.indexOf(card),
    tops: rects.map(r=> r.top + scrollY0),
    heights: rects.map(r=> r.height),
    gap: parseFloat(getComputedStyle(card).marginBottom) || 0,
    startPageY: clientY + scrollY0,
    lastClientY: clientY,
    reduced: prefersReducedMotion(),
    raf: null,
    ending: false
  };

  try{ card.setPointerCapture(pointerId); }catch(e){}
  if(navigator.vibrate) navigator.vibrate(30);
  document.body.classList.add('reordering');
  cards.forEach(c=>{ if(c !== card) c.classList.add('reorder-shift'); });
  card.classList.add('dragging');
  card._suppressClick = true;
  updateReorder();
  reorder.raf = requestAnimationFrame(autoScrollTick);
}

function updateReorder(){
  const r = reorder;
  const last = r.cards.length - 1;
  const minDy = r.tops[0] - r.tops[r.from];
  const maxDy = (r.tops[last] + r.heights[last]) - (r.tops[r.from] + r.heights[r.from]);
  const dy = Math.max(minDy, Math.min(maxDy, r.lastClientY + window.scrollY - r.startPageY));

  const centers = r.tops.map((t, i)=> t + r.heights[i] / 2);
  r.to = computeTargetIndex(centers, r.from, centers[r.from] + dy);

  const step = r.heights[r.from] + r.gap;
  r.cards.forEach((c, i)=>{
    if(i === r.from) return;
    let shift = 0;
    if(r.from < i && i <= r.to) shift = -step;
    else if(r.to <= i && i < r.from) shift = step;
    c.style.transform = shift ? `translateY(${shift}px)` : '';
  });
  r.card.style.transform = `translateY(${dy}px)` + (r.reduced ? '' : ' scale(1.03)');
}

function autoScrollTick(){
  const r = reorder;
  if(!r || r.ending) return;
  const nav = document.querySelector('.bottom-nav');
  const bottom = Math.min(window.innerHeight, nav ? nav.getBoundingClientRect().top : window.innerHeight);
  const y = r.lastClientY;

  let speed = 0;
  if(y < AUTOSCROLL_EDGE){
    speed = -AUTOSCROLL_MAX_SPEED * Math.min(1, (AUTOSCROLL_EDGE - y) / AUTOSCROLL_EDGE);
  } else if(y > bottom - AUTOSCROLL_EDGE){
    speed = AUTOSCROLL_MAX_SPEED * Math.min(1, (y - (bottom - AUTOSCROLL_EDGE)) / AUTOSCROLL_EDGE);
  }
  if(speed){
    const before = window.scrollY;
    window.scrollBy(0, Math.sign(speed) * Math.max(1, Math.round(Math.abs(speed))));
    if(window.scrollY !== before) updateReorder();
  }
  r.raf = requestAnimationFrame(autoScrollTick);
}

// commit=false (pointercancel) slides the card back without saving.
function endReorder(commit){
  const r = reorder;
  r.ending = true;
  cancelAnimationFrame(r.raf);
  const to = commit ? r.to : r.from;

  let offset = 0;
  if(to > r.from) for(let i = r.from + 1; i <= to; i++) offset += r.heights[i] + r.gap;
  else for(let i = to; i < r.from; i++) offset -= r.heights[i] + r.gap;
  if(!commit) r.cards.forEach(c=>{ if(c !== r.card) c.style.transform = ''; });

  let finished = false;
  const finish = ()=>{
    if(finished) return;
    finished = true;
    r.cards.forEach(c=>{
      c.style.transform = '';
      c.classList.remove('reorder-shift', 'dragging', 'settling');
    });
    document.body.classList.remove('reordering');
    // A click, if any, arrives right after pointerup; after that, taps toggle the card again.
    setTimeout(()=>{ r.card._suppressClick = false; }, 400);
    if(to !== r.from){
      const others = r.cards.filter(c=> c !== r.card);
      r.list.insertBefore(r.card, others[to] || null);
    }
    reorder = null;
    if(to !== r.from) saveReorderedProgram(r.card);
  };

  if(r.reduced){
    finish();
    return;
  }
  r.card.classList.add('settling');
  r.card.style.transform = `translateY(${offset}px)`;
  r.card.addEventListener('transitionend', finish, { once:true });
  setTimeout(finish, 260);
}

function buildProgramExRow(ex, startExpanded){
  const card = document.createElement('div');
  card.className = 'program-ex-card' + (startExpanded ? ' expanded' : '');
  card.innerHTML = `
    <div class="program-ex-summary">
      <div>
        <div class="program-ex-summary-text">${ex.name || 'New exercise'}</div>
        <div class="program-ex-summary-sub">${ex.sets || 3} × ${ex.reps || '8-10'}</div>
      </div>
      <span class="program-ex-actions">
        <span class="program-ex-handle" aria-hidden="true">${HANDLE_SVG}</span>
        <span class="program-ex-chevron">${CHEVRON_SVG}</span>
      </span>
    </div>
    <div class="program-ex-body">
      <div class="program-field-row">
        <div class="program-field">
          <label>Exercise name</label>
          <input type="text" class="p-name" value="${ex.name ? ex.name.replace(/"/g,'&quot;') : ''}">
        </div>
      </div>
      <div class="program-field-row">
        <div class="program-field">
          <label>Sets</label>
          <input type="number" class="p-sets" min="1" value="${ex.sets != null ? ex.sets : 3}">
        </div>
        <div class="program-field">
          <label>Reps</label>
          <input type="text" class="p-reps" value="${ex.reps ? ex.reps.replace(/"/g,'&quot;') : ''}" placeholder="e.g. 8-10">
        </div>
      </div>
      <div class="program-field-row">
        <div class="program-field">
          <label>Injury tag (optional)</label>
          <input type="text" class="p-injury" value="${ex.injury ? ex.injury.replace(/"/g,'&quot;') : ''}" placeholder="e.g. tailbone">
        </div>
        <div class="program-field">
          <label>Increment (kg)</label>
          <input type="number" class="p-increment" inputmode="decimal" min="0.5" step="0.5" value="${ex.increment != null ? ex.increment : ''}" placeholder="${DEFAULT_INCREMENT}">
        </div>
      </div>
      <div class="program-field-row single">
        <div class="program-field">
          <label>Note (optional)</label>
          <textarea class="p-note" rows="2">${ex.note ? ex.note : ''}</textarea>
        </div>
      </div>
      <button class="program-remove-btn">Remove exercise</button>
    </div>
  `;

  const summary = card.querySelector('.program-ex-summary');
  const summaryText = card.querySelector('.program-ex-summary-text');
  const summarySub = card.querySelector('.program-ex-summary-sub');
  summary.addEventListener('click', ()=>{
    // The click that some browsers fire right after a drag must not toggle the card.
    if(card._suppressClick){ card._suppressClick = false; return; }
    card.classList.toggle('expanded');
  });

  // The PROGRAM entry this card was built from (absent from PROGRAM for unsaved new cards).
  card._sourceEx = ex;
  attachReorder(card, summary);

  const nameInput = card.querySelector('.p-name');
  const setsInput = card.querySelector('.p-sets');
  const repsInput = card.querySelector('.p-reps');
  function syncSummary(){
    summaryText.textContent = nameInput.value.trim() || 'New exercise';
    summarySub.textContent = `${setsInput.value || 3} × ${repsInput.value || '8-10'}`;
  }
  [nameInput, setsInput, repsInput].forEach(inp=> inp.addEventListener('input', syncSummary));

  card.querySelector('.program-remove-btn').addEventListener('click', (e)=>{
    e.stopPropagation();
    card.remove();
  });

  return card;
}

function addProgramExercise(){
  const list = document.getElementById('programExList');
  const row = buildProgramExRow({ name:'', sets:3, reps:'', injury:'', note:'' }, true);
  list.appendChild(row);
  row.scrollIntoView({ behavior:'smooth', block:'center' });
  row.querySelector('.p-name').focus();
}

function saveProgram(){
  const cards = document.querySelectorAll('#programExList .program-ex-card');
  const newExercises = [];
  cards.forEach(card=>{
    const name = card.querySelector('.p-name').value.trim();
    if(!name) return;
    const sets = parseInt(card.querySelector('.p-sets').value) || 3;
    const reps = card.querySelector('.p-reps').value.trim() || '8-10';
    const injury = card.querySelector('.p-injury').value.trim();
    const note = card.querySelector('.p-note').value.trim();
    const increment = parseFloat(card.querySelector('.p-increment').value);
    const exObj = { name, sets, reps };
    if(injury) exObj.injury = injury;
    if(note) exObj.note = note;
    if(increment > 0) exObj.increment = increment;  // optional: absent means DEFAULT_INCREMENT
    newExercises.push(exObj);
  });

  PROGRAM[programDay].exercises = newExercises;
  persistProgram();

  document.getElementById('exerciseSelect').innerHTML = '';
  if(currentDay === programDay) renderExercises();
  renderDayRack();
  renderProgramExList();

  const msg = document.getElementById('programSavedMsg');
  msg.textContent = '✓ Program saved';
  setTimeout(()=>{ msg.textContent=''; }, 2500);
}

function resetProgramDay(){
  PROGRAM[programDay] = JSON.parse(JSON.stringify(DEFAULT_PROGRAM[programDay]));
  persistProgram();
  document.getElementById('exerciseSelect').innerHTML = '';
  if(currentDay === programDay) renderExercises();
  renderDayRack();
  renderProgramExList();

  const msg = document.getElementById('programSavedMsg');
  msg.textContent = '✓ Reset to defaults';
  setTimeout(()=>{ msg.textContent=''; }, 2500);
}

/* ---------------- REST TIMER ---------------- */
let timerSeconds = 90;
let timerRemaining = 90;
let timerInterval = null;
let timerRunning = false;

function formatTime(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  el.textContent = formatTime(timerRemaining);
  el.classList.toggle('timer-done', timerRemaining === 0);
}

function timerBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const playTone = (delay)=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      }, delay);
    };
    playTone(0);
    playTone(300);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

function startTimer(){
  if(timerRunning) return;
  timerRunning = true;
  document.getElementById('timerToggle').textContent = 'Pause';
  timerInterval = setInterval(()=>{
    timerRemaining--;
    updateTimerDisplay();
    if(timerRemaining <= 0){
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('timerToggle').textContent = 'Start';
      timerBeep();
    }
  }, 1000);
}

function pauseTimer(){
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('timerToggle').textContent = 'Start';
}

function resetTimer(){
  pauseTimer();
  timerRemaining = timerSeconds;
  updateTimerDisplay();
}

function initTimer(){
  const fab = document.getElementById('timerFab');
  const panel = document.getElementById('timerPanel');
  fab.addEventListener('click', ()=>{
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  });
  document.querySelectorAll('.timer-preset').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.timer-preset').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      timerSeconds = parseInt(btn.dataset.secs);
      resetTimer();
    });
  });
  document.getElementById('timerToggle').addEventListener('click', ()=>{
    if(timerRunning) pauseTimer(); else startTimer();
  });
  document.getElementById('timerMinus').addEventListener('click', ()=>{
    timerSeconds = Math.max(15, timerSeconds - 15);
    resetTimer();
  });
  document.getElementById('timerPlus').addEventListener('click', ()=>{
    timerSeconds = timerSeconds + 15;
    resetTimer();
  });
  document.getElementById('timerReset').addEventListener('click', resetTimer);
  updateTimerDisplay();
}

init();
initTimer();
</script>
