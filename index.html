<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RACK — Workout Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#0C1130">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C1130;
    --bg2:#1F2444;
    --card:#242A4E;
    --card2:#2C3358;
    --stroke:#343B66;
    --text:#F5F6FA;
    --muted:#9498BE;
    --coral:#FF7F6B;
    --coral-dim:#B85B4F;
    --purple:#8C7DFF;
    --purple-dim:#5F55B0;
    --mint:#3FD8B0;
    --mint-dim:#2A9A80;
    --yellow:#FFCE54;
    --warn:#FF5F6D;
    --radius:22px;
    --radius-sm:14px;
    --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:22px 16px 110px;
  }

  /* ---- Header ---- */
  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .header h1{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:.5px;
    margin:0;
    color:var(--text);
  }
  .header h1 span{color:var(--coral);}
  .header .date{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:600;
  }

  /* ---- Day tiles (colorful, reference-inspired) ---- */
  .day-rack{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .day-plate{
    flex:1;
    position:relative;
    border-radius:var(--radius);
    padding:20px 10px;
    text-align:center;
    cursor:pointer;
    transition:all .18s ease;
    border:none;
  }
  .day-plate .plate-name{
    display:block;
    font-weight:700;
    font-size:14px;
    line-height:1.25;
  }
  .day-plate .done-dot{
    position:absolute;
    top:10px;
    right:10px;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#fff;
    display:none;
  }
  .day-plate.done-today .done-dot{display:block;}

  .day-a{ background:rgba(255,127,107,0.14); color:var(--coral); box-shadow:none; }
  .day-a.active{ background:linear-gradient(160deg, var(--coral), var(--coral-dim)); color:#1A0F0C; box-shadow:0 10px 22px rgba(255,127,107,0.35); }
  .day-b{ background:rgba(140,125,255,0.14); color:var(--purple); box-shadow:none; }
  .day-b.active{ background:linear-gradient(160deg, var(--purple), var(--purple-dim)); color:#12102B; box-shadow:0 10px 22px rgba(140,125,255,0.35); }
  .day-c{ background:rgba(63,216,176,0.14); color:var(--mint); box-shadow:none; }
  .day-c.active{ background:linear-gradient(160deg, var(--mint), var(--mint-dim)); color:#0B241D; box-shadow:0 10px 22px rgba(63,216,176,0.35); }

  /* ---- Edit banner ---- */
  .edit-banner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(140,125,255,0.14);
    border-radius:var(--radius-sm);
    padding:10px 14px;
    margin-bottom:12px;
    font-size:12px;
    color:var(--text);
  }
  .edit-banner button{
    background:none;
    border:none;
    color:var(--purple);
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    font-family:'Poppins', sans-serif;
  }

  /* ---- Exercise card ---- */
  .exercise-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:10px;
  }
  .exercise-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:10px;
    gap:10px;
  }
  .exercise-name{
    font-size:15px;
    font-weight:600;
    color:var(--text);
    margin:0 0 3px;
  }
  .exercise-target{
    font-size:11.5px;
    color:var(--muted);
    font-weight:500;
  }
  .injury-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:rgba(255,95,109,0.16);
    color:var(--warn);
    font-size:9.5px;
    font-weight:700;
    padding:4px 9px;
    border-radius:var(--radius-pill);
    white-space:nowrap;
    letter-spacing:.3px;
    text-transform:uppercase;
  }

  .last-time{
    font-size:11px;
    color:var(--muted);
    background:var(--card2);
    border-radius:10px;
    padding:7px 10px;
    margin-bottom:8px;
    font-weight:500;
  }
  .last-time b{color:var(--text); font-weight:700;}
  .record-line{ color:var(--yellow); }
  .record-line b{ color:var(--yellow); }

  .sets-table{width:100%; border-collapse:collapse; margin-top:10px;}
  .sets-table th{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    text-align:left;
    padding-bottom:6px;
    font-weight:600;
  }
  .sets-table th.num, .sets-table td.num{text-align:center; width:40px;}
  .sets-table td{padding:4px 4px;}
  .set-row input{
    width:100%;
    background:var(--card2);
    border:1.5px solid transparent;
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 6px;
    text-align:center;
  }
  .set-row input:focus{
    outline:none;
    border-color:var(--coral);
  }
  .set-num{
    color:var(--muted);
    font-weight:700;
    font-size:13px;
    text-align:center;
  }
  .delta-badge{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:var(--radius-pill);
    display:inline-block;
    margin-top:2px;
  }
  .delta-up{color:var(--mint); background:rgba(63,216,176,0.14);}
  .delta-flat{color:var(--muted); background:rgba(148,152,190,0.14);}
  .delta-down{color:var(--warn); background:rgba(255,95,109,0.14);}

  .note-row{
    margin-top:10px;
    font-size:11.5px;
    color:var(--warn);
    background:rgba(255,95,109,0.10);
    padding:8px 10px;
    border-radius:10px;
    line-height:1.4;
    font-weight:500;
  }

  /* ---- Loading bar ---- */
  .plate-load{
    display:flex;
    gap:3px;
    margin-top:10px;
  }
  .plate-seg{
    flex:1;
    height:5px;
    border-radius:3px;
    background:var(--card2);
    transition:background .2s ease;
  }
  .plate-seg.filled{background:var(--coral);}

  /* ---- Note toggle (collapsed by default) ---- */
  .note-toggle{
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    padding:6px 2px;
    font-family:'Poppins', sans-serif;
  }
  .note-field-wrap{
    margin:4px 0 6px;
  }
  .note-field{
    width:100%;
    background:var(--card);
    border:1.5px solid transparent;
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-size:13px;
    padding:11px 12px;
    resize:vertical;
    min-height:44px;
  }
  .note-field:focus{ outline:none; border-color:var(--purple); }

  /* ---- Save button ---- */
  .save-bar{
    position:sticky;
    bottom:0;
    background:linear-gradient(0deg, var(--bg) 65%, transparent);
    padding:16px 0 4px;
    margin-top:6px;
  }
  .save-btn{
    width:100%;
    background:linear-gradient(120deg, var(--mint), var(--mint-dim));
    color:#08211A;
    border:none;
    border-radius:var(--radius-pill);
    padding:16px;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:.2px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(63,216,176,0.30);
  }
  .save-btn:active{opacity:.88;}

  .saved-msg{
    text-align:center;
    color:var(--mint);
    font-size:12px;
    font-weight:600;
    margin-top:10px;
    height:14px;
  }

  /* ---- Progress view ---- */
  .stats-toggle{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    background:var(--card);
    border-radius:var(--radius-pill);
    padding:5px;
  }
  .stats-toggle-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:12px;
    padding:9px 8px;
    border-radius:var(--radius-pill);
    cursor:pointer;
  }
  .stats-toggle-btn.active{
    background:var(--coral);
    color:#1A0F0C;
  }
  .progress-select{
    width:100%;
    background:var(--card);
    border:none;
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:14px;
    padding:13px;
    border-radius:var(--radius-sm);
    margin-bottom:16px;
  }
  .chart-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px 16px 14px;
    margin-bottom:14px;
  }
  .chart-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    margin-bottom:14px;
    font-weight:600;
  }
  .bars{
    display:flex;
    align-items:flex-end;
    gap:6px;
    height:130px;
    padding:0 2px;
  }
  .bar-col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    min-width:0;
  }
  .bar{
    width:100%;
    max-width:24px;
    background:linear-gradient(180deg, var(--coral), var(--coral-dim));
    border-radius:8px 8px 3px 3px;
  }
  .bar-val{
    font-size:10px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:4px;
    white-space:nowrap;
  }
  .bar-label{
    font-size:9px;
    color:var(--muted);
    margin-top:6px;
    text-align:center;
    font-weight:500;
  }
  .empty-state{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:50px 20px;
    line-height:1.6;
  }
  .empty-state .big{
    font-weight:700;
    font-size:20px;
    color:var(--text);
    display:block;
    margin-bottom:8px;
  }

  /* ---- History view ---- */
  .history-item{
    background:var(--card);
    border-radius:var(--radius);
    padding:15px 16px;
    margin-bottom:10px;
  }
  .history-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .history-day{
    font-weight:700;
    font-size:15px;
    color:var(--text);
  }
  .history-date{
    font-size:11px;
    color:var(--muted);
    font-weight:500;
  }
  .history-ex{
    font-size:12px;
    color:var(--muted);
    padding:3px 0;
    display:flex;
    justify-content:space-between;
    font-weight:500;
  }
  .history-ex b{color:var(--text); font-weight:600;}
  .pr-badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    background:rgba(255,206,84,0.16);
    color:var(--yellow);
    font-size:9.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:var(--radius-pill);
    margin-left:6px;
  }
  .history-note{
    font-size:12px;
    color:var(--muted);
    font-style:italic;
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--card2);
  }
  .history-actions{
    display:flex;
    gap:16px;
    margin-top:10px;
  }
  .edit-btn{
    background:none;
    border:none;
    color:var(--purple);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:0;
    font-family:'Poppins', sans-serif;
  }
  .del-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:0;
    font-family:'Poppins', sans-serif;
  }

  /* ---- Program editor (accordion) ---- */
  .program-ex-card{
    background:var(--card);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .program-ex-summary{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 16px;
    cursor:pointer;
  }
  .program-ex-summary-text{
    font-size:14px;
    font-weight:600;
    color:var(--text);
  }
  .program-ex-summary-sub{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
    font-weight:500;
  }
  .program-ex-chevron{
    width:18px;
    height:18px;
    color:var(--muted);
    flex-shrink:0;
    transition:transform .2s ease;
  }
  .program-ex-card.expanded .program-ex-chevron{ transform:rotate(180deg); }
  .program-ex-body{
    display:none;
    padding:0 16px 16px;
  }
  .program-ex-card.expanded .program-ex-body{ display:block; }
  .program-field-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .program-field-row.single{ flex-direction:column; }
  .program-field{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .program-field label{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--muted);
    font-weight:600;
  }
  .program-field input, .program-field textarea{
    background:var(--card2);
    border:1.5px solid transparent;
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-size:13px;
    padding:9px 10px;
  }
  .program-field input:focus, .program-field textarea:focus{ outline:none; border-color:var(--purple); }
  .program-remove-btn{
    background:none;
    border:none;
    color:var(--warn);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:2px 0 0;
    font-family:'Poppins', sans-serif;
  }
  .program-add-btn{
    width:100%;
    background:var(--card);
    border:1.5px dashed var(--stroke);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:14px;
    border-radius:var(--radius);
    cursor:pointer;
    margin-bottom:16px;
  }
  .program-reset-link{
    display:block;
    width:100%;
    background:none;
    border:none;
    color:var(--muted);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:8px 0 0;
    text-align:center;
    font-family:'Poppins', sans-serif;
  }
  .program-saved-msg{
    text-align:center;
    color:var(--mint);
    font-size:12px;
    font-weight:600;
    margin-top:10px;
    height:14px;
  }

  /* ---- Rest timer ---- */
  .timer-fab{
    position:fixed;
    bottom:104px;
    right:20px;
    width:54px;
    height:54px;
    border-radius:50%;
    background:linear-gradient(150deg, var(--coral), var(--coral-dim));
    color:#1A0F0C;
    border:none;
    font-size:21px;
    font-weight:700;
    box-shadow:0 10px 22px rgba(255,127,107,0.40);
    cursor:pointer;
    z-index:60;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .timer-panel{
    position:fixed;
    bottom:168px;
    right:20px;
    background:var(--card);
    border-radius:var(--radius);
    padding:16px;
    width:220px;
    box-shadow:0 12px 30px rgba(0,0,0,0.45);
    z-index:60;
  }
  .timer-display{
    font-weight:800;
    font-size:42px;
    text-align:center;
    color:var(--coral);
    letter-spacing:1px;
    margin-bottom:12px;
  }
  .timer-display.timer-done{ color:var(--mint); }
  .timer-presets{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }
  .timer-preset{
    flex:1;
    background:var(--card2);
    border:1.5px solid transparent;
    color:var(--text);
    font-size:11px;
    font-weight:600;
    padding:7px 0;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .timer-preset.active{ border-color:var(--coral); color:var(--coral); }
  .timer-controls{
    display:flex;
    gap:6px;
    align-items:center;
    margin-bottom:10px;
  }
  .timer-btn{
    flex:1;
    background:var(--card2);
    border:none;
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px 0;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .timer-btn-primary{
    background:linear-gradient(120deg, var(--coral), var(--coral-dim));
    color:#1A0F0C;
  }
  .timer-reset-link{
    display:block;
    width:100%;
    background:none;
    border:none;
    color:var(--muted);
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    padding:4px 0 0;
    text-align:center;
    font-family:'Poppins', sans-serif;
  }

  /* ---- Bottom nav ---- */
  .bottom-nav{
    position:fixed;
    left:16px;
    right:16px;
    bottom:16px;
    max-width:608px;
    margin:0 auto;
    background:#F4F5FA;
    border-radius:var(--radius-pill);
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:10px 8px;
    box-shadow:0 12px 28px rgba(0,0,0,0.35);
    z-index:70;
  }
  .nav-btn{
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    cursor:pointer;
    padding:6px 10px;
    border-radius:var(--radius-pill);
    color:#8A8FB0;
    font-family:'Poppins', sans-serif;
  }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn span{ font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
  .nav-btn.active{ color:#1A1F3D; }
  .nav-btn.active .nav-icon-wrap{
    background:var(--coral);
    color:#1A0F0C;
  }
  .nav-icon-wrap{
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>RACK<span>.</span></h1>
    <div class="date" id="todayDate"></div>
  </div>

  <!-- LOG VIEW -->
  <div id="view-log">
    <div class="day-rack" id="dayRack"></div>
    <div id="editBanner" class="edit-banner" style="display:none;">
      <span id="editBannerText"></span>
      <button id="editCancelBtn">Cancel</button>
    </div>
    <div id="exerciseList"></div>
    <button class="note-toggle" id="noteToggleBtn">+ Add note</button>
    <div class="note-field-wrap" id="noteFieldWrap" style="display:none;">
      <textarea class="note-field" id="sessionNote" placeholder="How you felt, sleep, energy..."></textarea>
    </div>
    <div class="save-bar">
      <button class="save-btn" id="saveBtn">Save session</button>
      <div class="saved-msg" id="savedMsg"></div>
    </div>
  </div>

  <!-- PROGRESS VIEW -->
  <div id="view-progress" style="display:none;">
    <div class="stats-toggle">
      <button class="stats-toggle-btn active" data-mode="exercise">By exercise</button>
      <button class="stats-toggle-btn" data-mode="day">By workout</button>
    </div>
    <select class="progress-select" id="exerciseSelect"></select>
    <div class="day-rack" id="statsDayRack" style="display:none;"></div>
    <div id="progressCharts"></div>
  </div>

  <!-- HISTORY VIEW -->
  <div id="view-history" style="display:none;">
    <div id="historyList"></div>
  </div>

  <!-- PROGRAM EDITOR VIEW -->
  <div id="view-program" style="display:none;">
    <div class="day-rack" id="programDayRack"></div>
    <div id="programExList"></div>
    <button class="program-add-btn" id="programAddBtn">+ Add exercise</button>
    <div class="save-bar">
      <button class="save-btn" id="programSaveBtn">Save program</button>
      <div class="program-saved-msg" id="programSavedMsg"></div>

    <span>Today</span>
  </button>

    <span>Progress</span>

    <span>Program</span>
  </button>

<script>
/* ---------------- PROGRAM DATA ---------------- */
const DEFAULT_PROGRAM = {
  A: {
    label: 'Leg Day',
    exercises: [
      { name:'Leg Press', sets:4, reps:'8-10', injury:'tailbone', note:'Moderate angle (not too reclined). Stop the range of motion if it bothers your tailbone.' },
      { name:'Barbell Bench Press', sets:4, reps:'6-8' },
      { name:'Close-Grip Lat Pulldown', sets:4, reps:'8-10' },
      { name:'Leg Extension', sets:3, reps:'12-15', injury:'tailbone', note:'Isolated exercise, low stress on the tailbone — should be safe.' },
      { name:'Lateral Raises', sets:3, reps:'12-15' },
    ]
  },
  B: {
    label: 'Pull Day',
    exercises: [
      { name:'Barbell Hip Thrust', sets:4, reps:'8-10', injury:'tailbone', note:'Replaces the deadlift. Stop immediately if it bothers your tailbone.' },
      { name:'Dumbbell Military Press', sets:4, reps:'6-8' },
      { name:'Chest-Supported Row', sets:4, reps:'8-10' },
      { name:'Leg Curl', sets:3, reps:'10-12', injury:'adductor', note:'Isolated, safe for the adductor while it heals.' },
      { name:'Bicep Curl', sets:3, reps:'10-12' },
      { name:'Tricep Pushdown', sets:3, reps:'10-12' },
    ]
  },
  C: {
    label: 'Finisher',
    exercises: [
      { name:'Incline Dumbbell Press', sets:4, reps:'8-10' },
      { name:'Pull-up', sets:4, reps:'8-10', note:'Add extra weight if you can do more than 10-12 clean reps, or use an assistance band if you can\'t reach 8-10.' },
      { name:'Adductor Machine', sets:3, reps:'12-15', injury:'adductor', note:'Left side only, or very light load on the right — only if authorized by your physical therapist.' },
      { name:'Face Pull', sets:3, reps:'12-15' },
    ]
  }
};

const STORAGE_KEY = 'rack-sessions';
const PROGRAM_KEY = 'rack-program';
let sessions = [];
let PROGRAM = loadProgram();
let currentDay = 'A';
let currentView = 'log';
let editingIndex = null;
let statsMode = 'exercise';
let programDay = 'A';

function dayColorClass(day){
  return day==='A' ? 'day-a' : day==='B' ? 'day-b' : 'day-c';
}

function loadProgram(){
  try{
    const raw = localStorage.getItem(PROGRAM_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      Object.keys(DEFAULT_PROGRAM).forEach(d=>{ if(!parsed[d]) parsed[d] = DEFAULT_PROGRAM[d]; });
      return parsed;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
}

function persistProgram(){
  try{
    localStorage.setItem(PROGRAM_KEY, JSON.stringify(PROGRAM));
  }catch(e){
    console.error('Program storage error', e);
  }
}

/* ---------------- INIT ---------------- */
async function init(){
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', { weekday:'short', day:'numeric', month:'short' }).toUpperCase();
  await loadSessions();
  renderDayRack();
  renderExercises();
  bindNav();
  document.getElementById('saveBtn').addEventListener('click', saveSession);
  document.getElementById('editCancelBtn').addEventListener('click', cancelEdit);
  document.getElementById('noteToggleBtn').addEventListener('click', ()=>{
    document.getElementById('noteFieldWrap').style.display = 'block';
    document.getElementById('noteToggleBtn').style.display = 'none';
    document.getElementById('sessionNote').focus();
  });
}

async function loadSessions(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    sessions = raw ? JSON.parse(raw) : [];
  }catch(e){
    sessions = [];
  }
}

async function persistSessions(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  }catch(e){
    console.error('Storage error', e);
  }
}

/* ---------------- NAV ---------------- */
function bindNav(){
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.nav-btn').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.dataset.view;
      document.getElementById('view-log').style.display = currentView==='log' ? '' : 'none';
      document.getElementById('view-progress').style.display = currentView==='progress' ? '' : 'none';
      document.getElementById('view-history').style.display = currentView==='history' ? '' : 'none';
      document.getElementById('view-program').style.display = currentView==='program' ? '' : 'none';
      if(currentView==='progress') renderProgressView();
      if(currentView==='history') renderHistoryView();
      if(currentView==='program') renderProgramEditor();
    });
  });

  document.querySelectorAll('.stats-toggle-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.stats-toggle-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      statsMode = btn.dataset.mode;
      document.getElementById('exerciseSelect').style.display = statsMode==='exercise' ? '' : 'none';
      document.getElementById('statsDayRack').style.display = statsMode==='day' ? 'flex' : 'none';
      renderProgressView();
    });
  });

  document.getElementById('programAddBtn').addEventListener('click', addProgramExercise);
  document.getElementById('programSaveBtn').addEventListener('click', saveProgram);
  document.getElementById('programResetBtn').addEventListener('click', resetProgramDay);
}

/* ---------------- DAY RACK ---------------- */
function isDoneToday(day){
  const today = new Date().toDateString();
  return sessions.some(s=>s.day===day && new Date(s.date).toDateString()===today);
}

function renderDayRack(){
  const rack = document.getElementById('dayRack');
  rack.innerHTML = '';
  Object.keys(PROGRAM).forEach(day=>{
    const el = document.createElement('div');
    el.className = 'day-plate ' + dayColorClass(day) + (day===currentDay ? ' active':'') + (isDoneToday(day) ? ' done-today':'');
    el.innerHTML = `<div class="done-dot"></div><span class="plate-name">${PROGRAM[day].label}</span>`;
    el.addEventListener('click', ()=>{
      if(editingIndex !== null && day !== currentDay) editingIndex = null;
      currentDay = day;
      renderDayRack();
      renderExercises();
    });
    rack.appendChild(el);
  });
}

/* ---------------- LAST SESSION LOOKUP ---------------- */
function getLastSession(day, exerciseName){
  const past = sessions
    .filter(s=>s.day===day)
    .sort((a,b)=> new Date(b.date) - new Date(a.date));
  for(const s of past){
    const ex = s.exercises.find(e=>e.name===exerciseName);
    if(ex && ex.sets.some(st=>st.weight)) return { session:s, ex };
  }
  return null;
}

function maxWeight(sets){
  return sets.reduce((m,s)=> Math.max(m, parseFloat(s.weight)||0), 0);
}

function getAllTimeMax(exerciseName, excludeIndex){
  let best = 0;
  sessions.forEach((s, idx)=>{
    if(idx === excludeIndex) return;
    const ex = s.exercises.find(e=>e.name===exerciseName);
    if(ex){
      const w = maxWeight(ex.sets);
      if(w > best) best = w;
    }
  });
  return best;
}

/* ---------------- EXERCISE LIST (LOG VIEW) ---------------- */
function renderExercises(){
  const container = document.getElementById('exerciseList');
  container.innerHTML = '';
  document.getElementById('savedMsg').textContent = '';

  const editingSession = editingIndex !== null ? sessions[editingIndex] : null;

  PROGRAM[currentDay].exercises.forEach((ex, exIdx)=>{
    const card = document.createElement('div');
    card.className = 'exercise-card';
    card.dataset.exIdx = exIdx;

    const last = getLastSession(currentDay, ex.name);
    let lastHtml = '';
    if(last){
      const w = maxWeight(last.ex.sets);
      const dateStr = new Date(last.session.date).toLocaleDateString('en-US',{day:'numeric',month:'short'});
      lastHtml = `<div class="last-time">Last time (${dateStr}): <b>${w} kg</b> × ${last.ex.sets.length} sets</div>`;
    } else {
      lastHtml = `<div class="last-time">First time logging this exercise</div>`;
    }

    const recordW = getAllTimeMax(ex.name, editingIndex);
    const recordHtml = recordW > 0 ? `<div class="last-time record-line">Personal record: <b>${recordW} kg</b></div>` : '';

    const editingExercise = editingSession ? editingSession.exercises.find(e=>e.name===ex.name) : null;

    let rows = '';
    for(let i=0;i<ex.sets;i++){
      const prefill = editingExercise && editingExercise.sets[i] ? editingExercise.sets[i] : null;
      const wVal = prefill && prefill.weight != null ? ` value="${prefill.weight}"` : '';
      const rVal = prefill && prefill.reps != null ? ` value="${prefill.reps}"` : '';
      rows += `
        <tr class="set-row">
          <td class="set-num">${i+1}</td>
          <td><input type="number" inputmode="decimal" class="w-input" placeholder="kg" data-set="${i}" min="0" step="0.5"${wVal}></td>
          <td><input type="number" inputmode="numeric" class="r-input" placeholder="reps" data-set="${i}" min="0"${rVal}></td>
        </tr>`;
    }

    card.innerHTML = `
      <div class="exercise-head">
        <div>
          <p class="exercise-name">${ex.name}</p>
          <div class="exercise-target">Target: ${ex.sets} × ${ex.reps}</div>
        </div>
        ${ex.injury ? `<span class="injury-badge">⚠ ${ex.injury}</span>` : ''}
      </div>
      ${lastHtml}
      ${recordHtml}
      <table class="sets-table">
        <thead><tr><th class="num">Set</th><th>Weight</th><th>Reps</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="plate-load" id="load-${exIdx}"></div>
      ${ex.note ? `<div class="note-row">${ex.note}</div>` : ''}
    `;

    container.appendChild(card);

    const inputs = card.querySelectorAll('.w-input, .r-input');
    const loadBar = card.querySelector(`#load-${exIdx}`);
    for(let i=0;i<ex.sets;i++){
      const seg = document.createElement('div');
      seg.className = 'plate-seg';
      loadBar.appendChild(seg);
    }
    function updateLoad(){
      const wInputs = card.querySelectorAll('.w-input');
      const segs = loadBar.querySelectorAll('.plate-seg');
      wInputs.forEach((inp, i)=>{
        segs[i].classList.toggle('filled', !!inp.value && parseFloat(inp.value) > 0);
      });
    }
    updateLoad();
    inputs.forEach(inp=> inp.addEventListener('input', updateLoad));
  });

  const noteVal = editingSession && editingSession.note ? editingSession.note : '';
  document.getElementById('sessionNote').value = noteVal;
  document.getElementById('noteFieldWrap').style.display = noteVal ? 'block' : 'none';
  document.getElementById('noteToggleBtn').style.display = noteVal ? 'none' : 'block';

  const banner = document.getElementById('editBanner');
  if(editingSession){
    const dateStr = new Date(editingSession.date).toLocaleDateString('en-US',{day:'numeric',month:'long'});
    document.getElementById('editBannerText').textContent = `Editing session from ${dateStr}`;
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }
}

function startEditSession(idx){
  editingIndex = idx;
  currentDay = sessions[idx].day;
  document.querySelectorAll('.nav-btn').forEach(t=>t.classList.remove('active'));
  document.querySelector('.nav-btn[data-view="log"]').classList.add('active');
  currentView = 'log';
  document.getElementById('view-log').style.display = '';
  document.getElementById('view-progress').style.display = 'none';
  document.getElementById('view-history').style.display = 'none';
  document.getElementById('view-program').style.display = 'none';
  renderDayRack();
  renderExercises();
  window.scrollTo(0,0);
}

function cancelEdit(){
  editingIndex = null;
  document.getElementById('sessionNote').value = '';
  renderExercises();
}

/* ---------------- SAVE SESSION ---------------- */
async function saveSession(){
  const cards = document.querySelectorAll('.exercise-card');
  const exercises = [];
  let anyData = false;
  let hasPR = false;

  cards.forEach(card=>{
    const exIdx = parseInt(card.dataset.exIdx);
    const exDef = PROGRAM[currentDay].exercises[exIdx];
    const wInputs = card.querySelectorAll('.w-input');
    const rInputs = card.querySelectorAll('.r-input');
    const sets = [];
    wInputs.forEach((inp, i)=>{
      const weight = inp.value ? parseFloat(inp.value) : null;
      const reps = rInputs[i].value ? parseInt(rInputs[i].value) : null;
      if(weight || reps) anyData = true;
      sets.push({ weight, reps });
    });
    const newMax = maxWeight(sets);
    const prevMax = getAllTimeMax(exDef.name, editingIndex);
    const isPR = newMax > 0 && newMax > prevMax;
    if(isPR) hasPR = true;
    exercises.push({ name: exDef.name, sets, isPR });
  });

  if(!anyData){
    const msg = document.getElementById('savedMsg');
    msg.style.color = 'var(--warn)';
    msg.textContent = 'Enter at least one weight or rep before saving';
    setTimeout(()=>{ msg.textContent=''; msg.style.color='var(--mint)'; }, 2500);
    return;
  }

  const note = document.getElementById('sessionNote').value.trim();

  if(editingIndex !== null){
    sessions[editingIndex] = {
      date: sessions[editingIndex].date,
      day: currentDay,
      exercises,
      note
    };
    editingIndex = null;
  } else {
    sessions.push({
      date: new Date().toISOString(),
      day: currentDay,
      exercises,
      note
    });
  }

  await persistSessions();

  document.getElementById('savedMsg').style.color = 'var(--mint)';
  document.getElementById('savedMsg').textContent = hasPR ? '✓ Session saved — 🏆 new record!' : '✓ Session saved';
  document.getElementById('sessionNote').value = '';
  document.getElementById('editBanner').style.display = 'none';
  renderDayRack();
  renderExercises();
  setTimeout(()=>{ document.getElementById('savedMsg').textContent=''; }, 3000);
}

/* ---------------- PROGRESS VIEW ---------------- */
function allExerciseNames(){
  const names = [];
  Object.values(PROGRAM).forEach(d=> d.exercises.forEach(e=>{ if(!names.includes(e.name)) names.push(e.name); }));
  return names;
}

function renderProgressView(){
  const select = document.getElementById('exerciseSelect');
  if(select.options.length===0){
    allExerciseNames().forEach(name=>{
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      select.appendChild(opt);
    });
    select.addEventListener('change', renderChart);
  }

  const dayRack = document.getElementById('statsDayRack');
  if(dayRack.children.length===0){
    Object.keys(PROGRAM).forEach(day=>{
      const el = document.createElement('div');
      el.className = 'day-plate ' + dayColorClass(day) + (day==='A' ? ' active':'');
      el.dataset.day = day;
      el.innerHTML = `<span class="plate-name">${PROGRAM[day].label}</span>`;
      el.addEventListener('click', ()=>{
        dayRack.querySelectorAll('.day-plate').forEach(p=>p.classList.remove('active'));
        el.classList.add('active');
        renderDayStats(day);
      });
      dayRack.appendChild(el);
    });
  }

  if(statsMode==='exercise') renderChart();
  else renderDayStats(dayRack.querySelector('.day-plate.active')?.dataset.day || 'A');
}

function buildChartCard(name){
  const points = sessions
    .filter(s=> s.exercises.some(e=>e.name===name && e.sets.some(st=>st.weight)))
    .sort((a,b)=> new Date(a.date)-new Date(b.date))
    .map(s=>{
      const ex = s.exercises.find(e=>e.name===name);
      return { date: s.date, weight: maxWeight(ex.sets) };
    });

  if(points.length===0) return null;

  const maxW = Math.max(...points.map(p=>p.weight), 1);
  const card = document.createElement('div');
  card.className = 'chart-card';
  const last8 = points.slice(-8);

  let bars = '';
  last8.forEach(p=>{
    const h = Math.max(6, (p.weight / maxW) * 100);
    const d = new Date(p.date).toLocaleDateString('en-US',{day:'numeric',month:'numeric'});
    bars += `
      <div class="bar-col">
        <div class="bar-val">${p.weight}</div>
        <div class="bar" style="height:${h}%"></div>
        <div class="bar-label">${d}</div>
      </div>`;
  });

  const first = points[0].weight;
  const latest = points[points.length-1].weight;
  const diff = (latest - first);
  const diffLabel = diff > 0 ? `+${diff} kg since first log` : diff < 0 ? `${diff} kg since first log` : 'unchanged since first log';
  const diffClass = diff > 0 ? 'delta-up' : diff < 0 ? 'delta-down' : 'delta-flat';

  card.innerHTML = `
    <div class="chart-title">${name} — max load per session</div>
    <div class="bars">${bars}</div>
    <div style="margin-top:14px;"><span class="delta-badge ${diffClass}">${diffLabel}</span></div>
  `;
  return card;
}

function renderChart(){
  const select = document.getElementById('exerciseSelect');
  const name = select.value || select.options[0]?.value;
  const container = document.getElementById('progressCharts');
  container.innerHTML = '';

  if(!name){
    container.innerHTML = `<div class="empty-state"><span class="big">Nothing to show yet</span>Log at least one session in the "Today" tab to see your progress here.</div>`;
    return;
  }

  const card = buildChartCard(name);
  if(!card){
    container.innerHTML = `<div class="empty-state"><span class="big">No data yet</span>You haven't logged any weights for this exercise yet.</div>`;
    return;
  }
  container.appendChild(card);
}

function renderDayStats(day){
  const container = document.getElementById('progressCharts');
  container.innerHTML = '';

  const exNames = PROGRAM[day].exercises.map(e=>e.name);
  let anyCard = false;
  exNames.forEach(name=>{
    const card = buildChartCard(name);
    if(card){ container.appendChild(card); anyCard = true; }
  });

  if(!anyCard){
    container.innerHTML = `<div class="empty-state"><span class="big">No data yet</span>You haven't logged any weights for ${PROGRAM[day].label} exercises yet.</div>`;
  }
}

/* ---------------- HISTORY VIEW ---------------- */
function renderHistoryView(){
  const list = document.getElementById('historyList');
  list.innerHTML = '';

  if(sessions.length===0){
    list.innerHTML = `<div class="empty-state"><span class="big">History is empty</span>Saved sessions will appear here.</div>`;
    return;
  }

  const sorted = [...sessions].sort((a,b)=> new Date(b.date)-new Date(a.date));
  sorted.forEach((s)=>{
    const realIdx = sessions.indexOf(s);
    const item = document.createElement('div');
    item.className = 'history-item';
    const dateStr = new Date(s.date).toLocaleDateString('en-US',{weekday:'long', day:'numeric', month:'long'});

    let exRows = '';
    s.exercises.forEach(ex=>{
      const w = maxWeight(ex.sets);
      const setsWithData = ex.sets.filter(st=>st.weight).length;
      if(setsWithData===0) return;
      const prBadge = ex.isPR ? `<span class="pr-badge">🏆 PR</span>` : '';
      exRows += `<div class="history-ex"><span>${ex.name}${prBadge}</span><b>${w} kg × ${setsWithData}</b></div>`;
    });

    const noteHtml = s.note ? `<div class="history-note">${s.note}</div>` : '';

    item.innerHTML = `
      <div class="history-head">
        <span class="history-day">${PROGRAM[s.day] ? PROGRAM[s.day].label : s.day}</span>
        <span class="history-date">${dateStr}</span>
      </div>
      ${exRows}
      ${noteHtml}
      <div class="history-actions">
        <button class="edit-btn" data-idx="${realIdx}">Edit</button>
        <button class="del-btn" data-idx="${realIdx}">Delete session</button>
      </div>
    `;
    list.appendChild(item);
  });

  list.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = parseInt(btn.dataset.idx);
      sessions.splice(idx,1);
      await persistSessions();
      renderHistoryView();
      renderDayRack();
    });
  });

  list.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx);
      startEditSession(idx);
    });
  });
}

/* ---------------- PROGRAM EDITOR (accordion) ---------------- */
function renderProgramEditor(){
  const dayRack = document.getElementById('programDayRack');
  dayRack.innerHTML = '';
  Object.keys(PROGRAM).forEach(day=>{
    const el = document.createElement('div');
    el.className = 'day-plate ' + dayColorClass(day) + (day===programDay ? ' active':'');
    el.innerHTML = `<span class="plate-name">${PROGRAM[day].label}</span>`;
    el.addEventListener('click', ()=>{
      programDay = day;
      renderProgramEditor();
    });
    dayRack.appendChild(el);
  });

  renderProgramExList();
}

function renderProgramExList(){
  const list = document.getElementById('programExList');
  list.innerHTML = '';
  PROGRAM[programDay].exercises.forEach((ex)=>{
    list.appendChild(buildProgramExRow(ex, false));
  });
}

const CHEVRON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

function buildProgramExRow(ex, startExpanded){
  const card = document.createElement('div');
  card.className = 'program-ex-card' + (startExpanded ? ' expanded' : '');
  card.innerHTML = `
    <div class="program-ex-summary">
      <div>
        <div class="program-ex-summary-text">${ex.name || 'New exercise'}</div>
        <div class="program-ex-summary-sub">${ex.sets || 3} × ${ex.reps || '8-10'}</div>
      </div>
      <span class="program-ex-chevron">${CHEVRON_SVG}</span>
    </div>
    <div class="program-ex-body">
      <div class="program-field-row">
        <div class="program-field">
          <label>Exercise name</label>
          <input type="text" class="p-name" value="${ex.name ? ex.name.replace(/"/g,'&quot;') : ''}">
        </div>
      </div>
      <div class="program-field-row">
        <div class="program-field">
          <label>Sets</label>
          <input type="number" class="p-sets" min="1" value="${ex.sets != null ? ex.sets : 3}">
        </div>
        <div class="program-field">
          <label>Reps</label>
          <input type="text" class="p-reps" value="${ex.reps ? ex.reps.replace(/"/g,'&quot;') : ''}" placeholder="e.g. 8-10">
        </div>
      </div>
      <div class="program-field-row">
        <div class="program-field">
          <label>Injury tag (optional)</label>
          <input type="text" class="p-injury" value="${ex.injury ? ex.injury.replace(/"/g,'&quot;') : ''}" placeholder="e.g. tailbone">
        </div>
      </div>
      <div class="program-field-row single">
        <div class="program-field">
          <label>Note (optional)</label>
          <textarea class="p-note" rows="2">${ex.note ? ex.note : ''}</textarea>
        </div>
      </div>
      <button class="program-remove-btn">Remove exercise</button>
    </div>
  `;

  const summary = card.querySelector('.program-ex-summary');
  const summaryText = card.querySelector('.program-ex-summary-text');
  const summarySub = card.querySelector('.program-ex-summary-sub');
  summary.addEventListener('click', ()=>{
    card.classList.toggle('expanded');
  });

  const nameInput = card.querySelector('.p-name');
  const setsInput = card.querySelector('.p-sets');
  const repsInput = card.querySelector('.p-reps');
  function syncSummary(){
    summaryText.textContent = nameInput.value.trim() || 'New exercise';
    summarySub.textContent = `${setsInput.value || 3} × ${repsInput.value || '8-10'}`;
  }
  [nameInput, setsInput, repsInput].forEach(inp=> inp.addEventListener('input', syncSummary));

  card.querySelector('.program-remove-btn').addEventListener('click', (e)=>{
    e.stopPropagation();
    card.remove();
  });

  return card;
}

function addProgramExercise(){
  const list = document.getElementById('programExList');
  const row = buildProgramExRow({ name:'', sets:3, reps:'', injury:'', note:'' }, true);
  list.appendChild(row);
  row.scrollIntoView({ behavior:'smooth', block:'center' });
  row.querySelector('.p-name').focus();
}

function saveProgram(){
  const cards = document.querySelectorAll('#programExList .program-ex-card');
  const newExercises = [];
  cards.forEach(card=>{
    const name = card.querySelector('.p-name').value.trim();
    if(!name) return;
    const sets = parseInt(card.querySelector('.p-sets').value) || 3;
    const reps = card.querySelector('.p-reps').value.trim() || '8-10';
    const injury = card.querySelector('.p-injury').value.trim();
    const note = card.querySelector('.p-note').value.trim();
    const exObj = { name, sets, reps };
    if(injury) exObj.injury = injury;
    if(note) exObj.note = note;
    newExercises.push(exObj);
  });

  PROGRAM[programDay].exercises = newExercises;
  persistProgram();

  document.getElementById('exerciseSelect').innerHTML = '';
  if(currentDay === programDay) renderExercises();
  renderDayRack();
  renderProgramExList();

  const msg = document.getElementById('programSavedMsg');
  msg.textContent = '✓ Program saved';
  setTimeout(()=>{ msg.textContent=''; }, 2500);
}

function resetProgramDay(){
  PROGRAM[programDay] = JSON.parse(JSON.stringify(DEFAULT_PROGRAM[programDay]));
  persistProgram();
  document.getElementById('exerciseSelect').innerHTML = '';
  if(currentDay === programDay) renderExercises();
  renderDayRack();
  renderProgramExList();

  const msg = document.getElementById('programSavedMsg');
  msg.textContent = '✓ Reset to defaults';
  setTimeout(()=>{ msg.textContent=''; }, 2500);
}

/* ---------------- REST TIMER ---------------- */
let timerSeconds = 90;
let timerRemaining = 90;
let timerInterval = null;
let timerRunning = false;

function formatTime(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  el.textContent = formatTime(timerRemaining);
  el.classList.toggle('timer-done', timerRemaining === 0);
}

function timerBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const playTone = (delay)=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      }, delay);
    };
    playTone(0);
    playTone(300);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

function startTimer(){
  if(timerRunning) return;
  timerRunning = true;
  document.getElementById('timerToggle').textContent = 'Pause';
  timerInterval = setInterval(()=>{
    timerRemaining--;
    updateTimerDisplay();
    if(timerRemaining <= 0){
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('timerToggle').textContent = 'Start';
      timerBeep();
    }
  }, 1000);
}

function pauseTimer(){
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('timerToggle').textContent = 'Start';
}

function resetTimer(){
  pauseTimer();
  timerRemaining = timerSeconds;
  updateTimerDisplay();
}

function initTimer(){
  const fab = document.getElementById('timerFab');
  const panel = document.getElementById('timerPanel');
  fab.addEventListener('click', ()=>{
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  });
  document.querySelectorAll('.timer-preset').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.timer-preset').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      timerSeconds = parseInt(btn.dataset.secs);
      resetTimer();
    });
  });
  document.getElementById('timerToggle').addEventListener('click', ()=>{
    if(timerRunning) pauseTimer(); else startTimer();
  });
  document.getElementById('timerMinus').addEventListener('click', ()=>{
    timerSeconds = Math.max(15, timerSeconds - 15);
    resetTimer();
  });
  document.getElementById('timerPlus').addEventListener('click', ()=>{
    timerSeconds = timerSeconds + 15;
    resetTimer();
  });
  document.getElementById('timerReset').addEventListener('click', resetTimer);
  updateTimerDisplay();
}

init();
initTimer();
</script>
