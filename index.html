<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RACK — Workout Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#0C1130">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C1130;
    --bg2:#1F2444;
    --card:#242A4E;
    --card2:#2C3358;
    --stroke:#343B66;
    --text:#F5F6FA;
    --muted:#9498BE;
    --coral:#FF7F6B;
    --coral-dim:#B85B4F;
    --purple:#8C7DFF;
    --purple-dim:#5F55B0;
    --mint:#3FD8B0;
    --mint-dim:#2A9A80;
    --yellow:#FFCE54;
    --warn:#FF5F6D;
    --radius:22px;
    --radius-sm:14px;
    --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:22px 16px 110px;
  }

  /* ---- Header ---- */
  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .header h1{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:.5px;
    margin:0;
    color:var(--text);
  }
  .header h1 span{color:var(--coral);}
  .header .date{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:600;
  }
  .header-right{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .wake-btn{
    width:32px;
    height:32px;
    border-radius:50%;
    border:1.5px solid var(--stroke);
    background:var(--card);
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    cursor:pointer;
    flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .wake-btn svg{ width:16px; height:16px; }
  .wake-btn .bulb{ fill:none; }
  /* Active only while a wake lock is actually held, not merely requested. */
  .wake-btn.active{
    background:rgba(255,206,84,0.14);
    border-color:var(--yellow);
    color:var(--yellow);
  }
  .wake-btn.active .bulb{ fill:currentColor; fill-opacity:.35; }
  @media (prefers-reduced-motion: reduce){
    .wake-btn{ transition:none; }
  }

  /* ---- Day tiles (colorful, reference-inspired) ---- */
  .day-rack{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .day-plate{
    flex:1;
    position:relative;
    border-radius:var(--radius);
    padding:20px 10px;
    text-align:center;
    cursor:pointer;
    transition:all .18s ease;
    border:none;
  }
  .day-plate .plate-name{
    display:block;
    font-weight:700;
    font-size:14px;
    line-height:1.25;
  }
  .day-plate .done-dot{
    position:absolute;
    top:10px;
    right:10px;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#fff;
    display:none;
  }
  .day-plate.done-today .done-dot{display:block;}

  .day-a{ background:rgba(255,127,107,0.14); color:var(--coral); box-shadow:none; }
  .day-a.active{ background:linear-gradient(160deg, var(--coral), var(--coral-dim)); color:#1A0F0C; box-shadow:0 10px 22px rgba(255,127,107,0.35); }
  .day-b{ background:rgba(140,125,255,0.14); color:var(--purple); box-shadow:none; }
  .day-b.active{ background:linear-gradient(160deg, var(--purple), var(--purple-dim)); color:#12102B; box-shadow:0 10px 22px rgba(140,125,255,0.35); }
  .day-c{ background:rgba(63,216,176,0.14); color:var(--mint); box-shadow:none; }
  .day-c.active{ background:linear-gradient(160deg, var(--mint), var(--mint-dim)); color:#0B241D; box-shadow:0 10px 22px rgba(63,216,176,0.35); }

  /* ---- Edit banner ---- */
  .edit-banner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(140,125,255,0.14);
    border-radius:var(--radius-sm);
    padding:10px 14px;
    margin-bottom:12px;
    font-size:12px;
    color:var(--text);
  }
  .edit-banner button{
    background:none;
    border:none;
    color:var(--purple);
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    font-family:'Poppins', sans-serif;
  }

  /* ---- Exercise card ---- */
  .exercise-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:10px;
  }
  .exercise-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:10px;
    gap:10px;
  }
  .exercise-name{
    font-size:15px;
    font-weight:600;
    color:var(--text);
    margin:0 0 3px;
  }
  .exercise-target{
    font-size:11.5px;
    color:var(--muted);
    font-weight:500;
  }
  .injury-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:rgba(255,95,109,0.16);
    color:var(--warn);
    font-size:9.5px;
    font-weight:700;
    padding:4px 9px;
    border-radius:var(--radius-pill);
    white-space:nowrap;
    letter-spacing:.3px;
    text-transform:uppercase;
  }

  .last-time{
    font-size:11px;
    color:var(--muted);
    background:var(--card2);
    border-radius:10px;
    padding:7px 10px;
    margin-bottom:8px;
    font-weight:500;
  }
  .last-time b{color:var(--text); font-weight:700;}
  .record-line{ color:var(--yellow); }
  .record-line b{ color:var(--yellow); }
  .suggest-line .sug-set{ color:var(--text); font-weight:700; white-space:nowrap; }
  .suggest-line .sug-set.up{ color:var(--mint); }
  .suggest-line .sug-set.down{ color:var(--warn); }
  .suggest-summary{
    font-size:10.5px;
    color:var(--muted);
    margin-top:3px;
  }

  .sets-table{width:100%; border-collapse:collapse; margin-top:10px;}
  .sets-table th{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    text-align:left;
    padding-bottom:6px;
    font-weight:600;
  }
  .sets-table th.num, .sets-table td.num{text-align:center; width:40px;}
  .sets-table td{padding:4px 4px;}
  .set-row input{
    width:100%;
    background:var(--card2);
    border:1.5px solid transparent;
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 6px;
    text-align:center;
  }
  .set-row input:focus{
    outline:none;
    border-color:var(--coral);
  }
  .set-num{
    color:var(--muted);
    font-weight:700;
    font-size:13px;
    text-align:center;
  }
  .delta-badge{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:var(--radius-pill);
    display:inline-block;
    margin-top:2px;
  }
  .delta-up{color:var(--mint); background:rgba(63,216,176,0.14);}
  .delta-flat{color:var(--muted); background:rgba(148,152,190,0.14);}
  .delta-down{color:var(--warn); background:rgba(255,95,109,0.14);}

  .note-row{
    margin-top:10px;
    font-size:11.5px;
    color:var(--warn);
    background:rgba(255,95,109,0.10);
    padding:8px 10px;
    border-radius:10px;
    line-height:1.4;
    font-weight:500;
  }

  /* ---- Loading bar ---- */
  .plate-load{
    display:flex;
    gap:3px;
    margin-top:10px;
  }
  .plate-seg{
    flex:1;
    height:5px;
    border-radius:3px;
    background:var(--card2);
    transition:background .2s ease;
  }
  .plate-seg.filled{background:var(--coral);}

  /* ---- Note toggle (collapsed by default) ---- */
  .note-toggle{
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    padding:6px 2px;
    font-family:'Poppins', sans-serif;
  }
  .note-field-wrap{
    margin:4px 0 6px;
  }
  .note-field{
    width:100%;
    background:var(--card);
    border:1.5px solid transparent;
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-size:13px;
    padding:11px 12px;
    resize:vertical;
    min-height:44px;
  }
  .note-field:focus{ outline:none; border-color:var(--purple); }

  /* ---- Save button ---- */
  .save-bar{
    position:sticky;
    bottom:0;
    background:linear-gradient(0deg, var(--bg) 65%, transparent);
    padding:16px 0 4px;
    margin-top:6px;
  }
  .save-btn{
    width:100%;
    background:linear-gradient(120deg, var(--mint), var(--mint-dim));
    color:#08211A;
    border:none;
    border-radius:var(--radius-pill);
    padding:16px;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:.2px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(63,216,176,0.30);
  }
  .save-btn:active{opacity:.88;}

  .saved-msg{
    text-align:center;
    color:var(--mint);
    font-size:12px;
    font-weight:600;
    margin-top:10px;
    height:14px;
  }

  /* ---- Progress view ---- */
  .stats-toggle{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    background:var(--card);
    border-radius:var(--radius-pill);
    padding:5px;
  }
  .stats-toggle-btn, .metric-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:12px;
    padding:9px 8px;
    border-radius:var(--radius-pill);
    cursor:pointer;
  }
  .stats-toggle-btn.active, .metric-btn.active{
    background:var(--coral);
    color:#1A0F0C;
  }
  .export-btn{
    width:100%;
    background:var(--card);
    border:1.5px solid var(--stroke);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:14px;
    border-radius:var(--radius-pill);
    cursor:pointer;
    margin-top:6px;
  }
  .export-btn:active{opacity:.88;}
  .progress-select{
    width:100%;
    background:var(--card);
    border:none;
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:14px;
    padding:13px;
    border-radius:var(--radius-sm);
    margin-bottom:16px;
  }
  .chart-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px 16px 14px;
    margin-bottom:14px;
  }
  .chart-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    margin-bottom:14px;
    font-weight:600;
  }
  .bars{
    display:flex;
    align-items:flex-end;
    gap:6px;
    height:130px;
    padding:0 2px;
  }
  .bar-col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    min-width:0;
  }
  .bar{
    width:100%;
    max-width:24px;
    background:linear-gradient(180deg, var(--coral), var(--coral-dim));
    border-radius:8px 8px 3px 3px;
  }
  .bar-val{
    font-size:10px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:4px;
    white-space:nowrap;
  }
  .bar-label{
    font-size:9px;
    color:var(--muted);
    margin-top:6px;
    text-align:center;
    font-weight:500;
  }
  .empty-state{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:50px 20px;
    line-height:1.6;
  }
  .empty-state .big{
    font-weight:700;
    font-size:20px;
    color:var(--text);
    display:block;
    margin-bottom:8px;
  }

  /* ---- History view ---- */
  .history-item{
    background:var(--card);
    border-radius:var(--radius);
    padding:15px 16px;
    margin-bottom:10px;
  }
  .history-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .history-day{
    font-weight:700;
    font-size:15px;
    color:var(--text);
  }
  .history-date{
    font-size:11px;
    color:var(--muted);
    font-weight:500;
  }
  .history-ex{
    font-size:12px;
    color:var(--muted);
    padding:3px 0;
    display:flex;
    justify-content:space-between;
    font-weight:500;
  }
  .history-ex b{color:var(--text); font-weight:600;}
  .pr-badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    background:rgba(255,206,84,0.16);
    color:var(--yellow);
    font-size:9.5px;
    font-weight:700;
    padding:2px 8px;
    border-radius:var(--radius-pill);
    margin-left:6px;
  }
  .history-note{
    font-size:12px;
    color:var(--muted);
    font-style:italic;
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--card2);
  }
  .history-actions{
    display:flex;
    gap:16px;
    margin-top:10px;
  }
  .edit-btn{
    background:none;
    border:none;
    color:var(--purple);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:0;
    font-family:'Poppins', sans-serif;
  }
  .del-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:0;
    font-family:'Poppins', sans-serif;
  }

  /* ---- Program editor (accordion) ---- */
  .program-ex-card{
    background:var(--card);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .program-ex-summary{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 16px;
    cursor:pointer;
  }
  .program-ex-summary-text{
    font-size:14px;
    font-weight:600;
    color:var(--text);
  }
  .program-ex-summary-sub{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
    font-weight:500;
  }
  .program-ex-chevron{
    width:18px;
    height:18px;
    color:var(--muted);
    flex-shrink:0;
    transition:transform .2s ease;
  }
  .program-ex-card.expanded .program-ex-chevron{ transform:rotate(180deg); }
  .program-ex-actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .program-ex-handle{
    width:16px;
    height:16px;
    color:var(--muted);
    opacity:.6;
  }
  /* Long-press target: no text selection or iOS/Android callout menu. */
  .program-ex-summary{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  .program-ex-card.reorder-shift{
    transition:transform .18s ease;
  }
  .program-ex-card.dragging{
    position:relative;
    z-index:20;
    transform-origin:center;
    box-shadow:0 18px 36px rgba(0,0,0,0.45);
    background:var(--card2);
  }
  .program-ex-card.dragging.settling{
    transition:transform .18s ease;
  }
  body.reordering{
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:104px;
    transform:translate(-50%, 8px);
    background:var(--card2);
    color:var(--mint);
    font-size:12.5px;
    font-weight:600;
    padding:10px 18px;
    border-radius:var(--radius-pill);
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:80;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }
  @media (prefers-reduced-motion: reduce){
    .program-ex-card.reorder-shift,
    .program-ex-card.dragging.settling,
    .toast{ transition:none; }
  }
  .program-ex-body{
    display:none;
    padding:0 16px 16px;
  }
  .program-ex-card.expanded .program-ex-body{ display:block; }
  .program-field-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .program-field-row.single{ flex-direction:column; }
  .program-field{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .program-field label{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--muted);
    font-weight:600;
  }
  .program-field input, .program-field textarea{
    background:var(--card2);
    border:1.5px solid transparent;
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-size:13px;
    padding:9px 10px;
  }
  .program-field input:focus, .program-field textarea:focus{ outline:none; border-color:var(--purple); }
  .program-remove-btn{
    background:none;
    border:none;
    color:var(--warn);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:2px 0 0;
    font-family:'Poppins', sans-serif;
  }
  .program-add-btn{
    width:100%;
    background:var(--card);
    border:1.5px dashed var(--stroke);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:14px;
    border-radius:var(--radius);
    cursor:pointer;
    margin-bottom:16px;
  }
  .program-reset-link{
    display:block;
    width:100%;
    background:none;
    border:none;
    color:var(--muted);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    padding:8px 0 0;
    text-align:center;
    font-family:'Poppins', sans-serif;
  }
  .program-saved-msg{
    text-align:center;
    color:var(--mint);
    font-size:12px;
    font-weight:600;
    margin-top:10px;
    height:14px;
  }

  /* ---- Rest timer ---- */
  .timer-fab{
    position:fixed;
    bottom:104px;
    right:20px;
    width:54px;
    height:54px;
    border-radius:50%;
    background:linear-gradient(150deg, var(--coral), var(--coral-dim));
    color:#1A0F0C;
    border:none;
    font-size:21px;
    font-weight:700;
    box-shadow:0 10px 22px rgba(255,127,107,0.40);
    cursor:pointer;
    z-index:60;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .timer-panel{
    position:fixed;
    bottom:168px;
    right:20px;
    background:var(--card);
    border-radius:var(--radius);
    padding:16px;
    width:220px;
    box-shadow:0 12px 30px rgba(0,0,0,0.45);
    z-index:60;
  }
  .timer-display{
    font-weight:800;
    font-size:42px;
    text-align:center;
    color:var(--coral);
    letter-spacing:1px;
    margin-bottom:12px;
  }
  .timer-display.timer-done{ color:var(--mint); }
  .timer-presets{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }
  .timer-preset{
    flex:1;
    background:var(--card2);
    border:1.5px solid transparent;
    color:var(--text);
    font-size:11px;
    font-weight:600;
    padding:7px 0;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .timer-preset.active{ border-color:var(--coral); color:var(--coral); }
  .timer-controls{
    display:flex;
    gap:6px;
    align-items:center;
    margin-bottom:10px;
  }
  .timer-btn{
    flex:1;
    background:var(--card2);
    border:none;
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px 0;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .timer-btn-primary{

<script>
/* ---------------- PROGRAM DATA ---------------- */
const DEFAULT_PROGRAM = {
  A: {
    label: 'Leg Day',
    exercises: [
      { name:'Leg Press', sets:4, reps:'8-10', injury:'tailbone', note:'Moderate angle (not too reclined). Stop the range of motion if it bothers your tailbone.' },
      { name:'Barbell Bench Press', sets:4, reps:'6-8' },
      { name:'Close-Grip Lat Pulldown', sets:4, reps:'8-10' },
      { name:'Leg Extension', sets:3, reps:'12-15', injury:'tailbone', note:'Isolated exercise, low stress on the tailbone — should be safe.' },
      { name:'Lateral Raises', sets:3, reps:'12-15' },
    ]
  },
  B: {
    label: 'Pull Day',
    exercises: [
      { name:'Barbell Hip Thrust', sets:4, reps:'8-10', injury:'tailbone', note:'Replaces the deadlift. Stop immediately if it bothers your tailbone.' },
      { name:'Dumbbell Military Press', sets:4, reps:'6-8' },
      { name:'Chest-Supported Row', sets:4, reps:'8-10' },
      { name:'Leg Curl', sets:3, reps:'10-12', injury:'adductor', note:'Isolated, safe for the adductor while it heals.' },
      { name:'Bicep Curl', sets:3, reps:'10-12' },
      { name:'Tricep Pushdown', sets:3, reps:'10-12' },
    ]
  },
  C: {
    label: 'Finisher',
    exercises: [
      { name:'Incline Dumbbell Press', sets:4, reps:'8-10' },
      { name:'Pull-up', sets:4, reps:'8-10', note:'Add extra weight if you can do more than 10-12 clean reps, or use an assistance band if you can\'t reach 8-10.' },
      { name:'Adductor Machine', sets:3, reps:'12-15', injury:'adductor', note:'Left side only, or very light load on the right — only if authorized by your physical therapist.' },
      { name:'Face Pull', sets:3, reps:'12-15' },
    ]
  }
};

const STORAGE_KEY = 'rack-sessions';
const PROGRAM_KEY = 'rack-program';
const METRIC_KEY = 'rack-progress-metric';

// Chart metrics; bodyweight exercises (no load ever logged) fall back to rep counts.
const METRICS = {
  e1rm:   { title:'estimated 1RM per session', value: sets=> roundHalf(bestE1RM(sets)),
            bwTitle:'max reps per session',     bwValue: maxReps },
  volume: { title:'total volume per session',  value: sets=> Math.round(totalVolume(sets)),
            bwTitle:'total reps per session',   bwValue: totalReps },
  max:    { title:'max load per session',      value: maxWeight,
            bwTitle:'max reps per session',     bwValue: maxReps }
};
let sessions = [];
let PROGRAM = loadProgram();
let currentDay = 'A';
let currentView = 'log';
let editingIndex = null;
let statsMode = 'exercise';
let progressMetric = loadProgressMetric();
let programDay = 'A';

function loadProgressMetric(){
  try{
    const m = localStorage.getItem(METRIC_KEY);
    if(m && METRICS[m]) return m;
  }catch(e){}
  return 'e1rm';
}

function dayColorClass(day){
  return day==='A' ? 'day-a' : day==='B' ? 'day-b' : 'day-c';
}

function loadProgram(){
  try{
    const raw = localStorage.getItem(PROGRAM_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      Object.keys(DEFAULT_PROGRAM).forEach(d=>{ if(!parsed[d]) parsed[d] = DEFAULT_PROGRAM[d]; });
      return parsed;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
}

function persistProgram(){
  try{
    localStorage.setItem(PROGRAM_KEY, JSON.stringify(PROGRAM));
  }catch(e){
    console.error('Program storage error', e);
  }
}

/* ---------------- INIT ---------------- */
async function init(){
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-US', { weekday:'short', day:'numeric', month:'short' }).toUpperCase();
  await loadSessions();
  renderDayRack();
  renderExercises();
  bindNav();
  initKeepScreenOn();
  document.getElementById('saveBtn').addEventListener('click', saveSession);
  document.getElementById('editCancelBtn').addEventListener('click', cancelEdit);
  document.getElementById('noteToggleBtn').addEventListener('click', ()=>{
    document.getElementById('noteFieldWrap').style.display = 'block';
    document.getElementById('noteToggleBtn').style.display = 'none';
    document.getElementById('sessionNote').focus();
  });
}

async function loadSessions(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    sessions = raw ? JSON.parse(raw) : [];
  }catch(e){
    sessions = [];
  }
  if(recomputePRs()) await persistSessions();
}

async function persistSessions(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  }catch(e){
    console.error('Storage error', e);
  }
}

/* ---------------- NAV ---------------- */
function bindNav(){
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.nav-btn').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.dataset.view;
      document.getElementById('view-log').style.display = currentView==='log' ? '' : 'none';
      document.getElementById('view-progress').style.display = currentView==='progress' ? '' : 'none';
      document.getElementById('view-history').style.display = currentView==='history' ? '' : 'none';
      document.getElementById('view-program').style.display = currentView==='program' ? '' : 'none';
      if(currentView==='progress') renderProgressView();
      if(currentView==='history') renderHistoryView();
      if(currentView==='program') renderProgramEditor();
    });
  });

  document.querySelectorAll('.stats-toggle-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.stats-toggle-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      statsMode = btn.dataset.mode;
      document.getElementById('exerciseSelect').style.display = statsMode==='exercise' ? '' : 'none';
      document.getElementById('statsDayRack').style.display = statsMode==='day' ? 'flex' : 'none';
      renderProgressView();
    });
  });

  document.querySelectorAll('.metric-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.metric===progressMetric);
    btn.addEventListener('click', ()=>{
      progressMetric = btn.dataset.metric;
      try{ localStorage.setItem(METRIC_KEY, progressMetric); }catch(e){}
      document.querySelectorAll('.metric-btn').forEach(b=>b.classList.toggle('active', b===btn));
      renderProgressView();
    });
  });

  // Bound once here: the select is emptied and repopulated whenever the program changes.
  document.getElementById('exerciseSelect').addEventListener('change', renderChart);

  document.getElementById('exportReportBtn').addEventListener('click', exportReport);
  document.getElementById('exportBackupBtn').addEventListener('click', exportBackup);
  const importInput = document.getElementById('importBackupInput');
  document.getElementById('importBackupBtn').addEventListener('click', ()=> importInput.click());
  document.getElementById('undoImportBtn').addEventListener('click', undoImport);
  importInput.addEventListener('change', ()=>{
    const file = importInput.files[0];
    importInput.value = '';  // allow re-selecting the same file later
    if(file) importBackup(file);
  });

  document.getElementById('programAddBtn').addEventListener('click', addProgramExercise);
  document.getElementById('programSaveBtn').addEventListener('click', saveProgram);
  document.getElementById('programResetBtn').addEventListener('click', resetProgramDay);
}

/* ---------------- DAY RACK ---------------- */
function isDoneToday(day){
  const today = new Date().toDateString();
  return sessions.some(s=>s.day===day && new Date(s.date).toDateString()===today);
}

function renderDayRack(){
  const rack = document.getElementById('dayRack');
  rack.innerHTML = '';
  Object.keys(PROGRAM).forEach(day=>{
    const el = document.createElement('div');
    el.className = 'day-plate ' + dayColorClass(day) + (day===currentDay ? ' active':'') + (isDoneToday(day) ? ' done-today':'');
    el.innerHTML = `<div class="done-dot"></div><span class="plate-name">${PROGRAM[day].label}</span>`;
    el.addEventListener('click', ()=>{
      if(editingIndex !== null && day !== currentDay) editingIndex = null;
      currentDay = day;
      renderDayRack();
      renderExercises();
    });
    rack.appendChild(el);
  });
}

/* ---------------- LAST SESSION LOOKUP ---------------- */
function getLastSession(day, exerciseName){
  const past = sessions
    .filter(s=>s.day===day)
    .sort((a,b)=> new Date(b.date) - new Date(a.date));
  for(const s of past){
    const ex = s.exercises.find(e=>e.name===exerciseName);
    if(ex && ex.sets.some(st=>st.weight)) return { session:s, ex };
  }
  return null;
}

function maxWeight(sets){
  return sets.reduce((m,s)=> Math.max(m, parseFloat(s.weight)||0), 0);
}

function num(v){
  const n = parseFloat(v);
  return n > 0 ? n : 0;
}

// Sets with both a load and reps; empty or zero entries are ignored.
function validSets(sets){
  return sets.filter(s=> num(s.weight) > 0 && num(s.reps) > 0);
}

// Epley: weight × (1 + reps/30); a single rep is the weight itself.
function bestE1RM(sets){
  return validSets(sets).reduce((best, s)=>{
    const w = num(s.weight), r = num(s.reps);
    return Math.max(best, r === 1 ? w : w * (1 + r/30));
  }, 0);
}

function totalVolume(sets){
  return validSets(sets).reduce((sum, s)=> sum + num(s.weight) * num(s.reps), 0);
}

function maxReps(sets){
  return sets.reduce((m,s)=> Math.max(m, num(s.reps)), 0);
}

function totalReps(sets){
  return sets.reduce((t,s)=> t + num(s.reps), 0);
}

function round1(v){ return Math.round(v*10)/10; }
function roundHalf(v){ return Math.round(v*2)/2; }

// Bodyweight = reps logged but never any load, across history (plus optional unsaved sets).
function isBodyweight(exerciseName, excludeIndex, extraSets = []){
  const all = [...extraSets];
  sessions.forEach((s, idx)=>{
    if(idx === excludeIndex) return;
    const ex = s.exercises.find(e=>e.name===exerciseName);
    if(ex) all.push(...ex.sets);
  });
  return all.some(s=> num(s.reps) > 0) && !all.some(s=> num(s.weight) > 0);
}

// Value a PR is judged on: e1RM, or max reps for bodyweight exercises.
function prScore(sets, bodyweight){
  return bodyweight ? maxReps(sets) : round1(bestE1RM(sets));
}

function getAllTimeBest(exerciseName, excludeIndex){
  const best = { e1rm:0, max:0, reps:0 };
  sessions.forEach((s, idx)=>{
    if(idx === excludeIndex) return;
    const ex = s.exercises.find(e=>e.name===exerciseName);
    if(ex){
      best.e1rm = Math.max(best.e1rm, bestE1RM(ex.sets));
      best.max = Math.max(best.max, maxWeight(ex.sets));
      best.reps = Math.max(best.reps, maxReps(ex.sets));
    }
  });
  return best;
}

// Re-derives every stored isPR flag in chronological order. Returns true if any flag changed.
function recomputePRs(){
  const order = sessions.map((s, idx)=> idx)
    .sort((a,b)=> (new Date(sessions[a].date) - new Date(sessions[b].date)) || a - b);
  const best = {};
  const bwCache = {};
  let changed = false;
  order.forEach(idx=>{
    sessions[idx].exercises.forEach(ex=>{
      if(!(ex.name in bwCache)) bwCache[ex.name] = isBodyweight(ex.name);
      const score = prScore(ex.sets, bwCache[ex.name]);
      const isPR = score > 0 && score > (best[ex.name] || 0);
      if(isPR) best[ex.name] = score;
      if(!!ex.isPR !== isPR){ ex.isPR = isPR; changed = true; }
    });
  });
  return changed;
}

/* ---------------- PROGRESSION SUGGESTION (double progression) ---------------- */
const DEFAULT_INCREMENT = 2.5;
const DELOAD_FACTOR = 0.925;  // ~7.5% lighter after two sessions below the range

// "8-10", "8–10", "8 - 10 reps" → {min:8, max:10}; "10" → {min:10, max:10}; no number → null.
function parseRepRange(reps){
  const nums = String(reps == null ? '' : reps).match(/\d+/g);
  if(!nums) return null;
  const a = parseInt(nums[0]), b = nums.length > 1 ? parseInt(nums[1]) : a;
  if(!(a > 0) || !(b > 0)) return null;
  return { min: Math.min(a, b), max: Math.max(a, b) };
}

// Nearest multiple of inc, without float noise (32.4999 → 32.5).
function roundToIncrement(w, inc){
  return Math.round(Math.round(w / inc) * inc * 100) / 100;
}

// Sets usable for progression. Bodyweight = no set with a load: reps alone are enough.
function progressionSets(sets){
  const list = (sets || []).map(s=> ({ weight: num(s.weight), reps: num(s.reps) })).filter(s=> s.reps > 0);
  const weighted = list.filter(s=> s.weight > 0);
  return weighted.length ? { sets: weighted, bodyweight: false } : { sets: list, bodyweight: true };
}

// Pure: per-set targets for today from the last (and previous) session's sets.
// Result is shaped for reuse (e.g. prefilling inputs): sets[i] = { weight, reps, change, weightDelta, repsDelta, from }.
function suggestProgression(exercise, lastSessionSets, previousSessionSets){
  const range = parseRepRange(exercise.reps);
  const increment = num(exercise.increment) || DEFAULT_INCREMENT;
  const last = progressionSets(lastSessionSets);
  if(last.sets.length === 0) return { status:'first', range, increment, bodyweight:false, topOfRange:false, sets:[] };

  const bodyweight = last.bodyweight;
  const prev = progressionSets(previousSessionSets).sets;
  const planned = parseInt(exercise.sets);
  const count = planned > 0 ? planned : last.sets.length;
  // Extra planned sets repeat the last recorded set; surplus recorded sets are ignored.
  const srcIdx = i=> Math.min(i, last.sets.length - 1);

  const make = (src, weight, reps)=> ({
    weight: bodyweight ? null : weight,
    reps,
    change: bodyweight || weight === src.weight ? 'same' : weight > src.weight ? 'up' : 'down',
    weightDelta: bodyweight ? 0 : round1(weight - src.weight),
    repsDelta: reps - src.reps,
    from: { weight: bodyweight ? null : src.weight, reps: src.reps }
  });

  const sets = [];
  let topOfRange = false;
  if(!range){
    // No range: +1 rep on the weakest set only.
    const reps = Array.from({ length: count }, (_, i)=> last.sets[srcIdx(i)].reps);
    const weakest = reps.indexOf(Math.min(...reps));
    for(let i = 0; i < count; i++){
      const s = last.sets[srcIdx(i)];
      sets.push(make(s, s.weight, s.reps + (i === weakest ? 1 : 0)));
    }
  } else {
    for(let i = 0; i < count; i++){
      const s = last.sets[srcIdx(i)];
      const p = prev[srcIdx(i)];
      if(bodyweight){
        // Reps only, past the top of the range too.
        if(s.reps >= range.max) topOfRange = true;
        sets.push(make(s, 0, s.reps < range.min ? range.min : s.reps + 1));
      } else if(s.reps >= range.max){
        sets.push(make(s, roundToIncrement(s.weight + increment, increment), range.min));
      } else if(s.reps >= range.min){
        sets.push(make(s, s.weight, Math.min(range.max, s.reps + 1)));
      } else {
        // Below the range twice in a row at this weight (or heavier before): back off.
        let weight = s.weight;
        if(p && p.reps < range.min && p.weight >= s.weight){
          weight = roundToIncrement(s.weight * DELOAD_FACTOR, increment);
          if(weight >= s.weight) weight = roundToIncrement(s.weight - increment, increment);
          if(weight <= 0) weight = s.weight;
        }
        sets.push(make(s, weight, range.min));
      }
    }
  }
  return { status:'progress', range, increment, bodyweight, topOfRange, sets };
}

// [1,2,3,5] → "sets 1–3, 5"; [2] → "set 2".
function formatSetList(indexes){
  const parts = [];
  for(let i = 0; i < indexes.length; i++){
    let j = i;
    while(j + 1 < indexes.length && indexes[j+1] === indexes[j] + 1) j++;
    parts.push(j > i ? `${indexes[i]}–${indexes[j]}` : `${indexes[i]}`);
    i = j;
  }
  return (indexes.length === 1 ? 'set ' : 'sets ') + parts.join(', ');
}

function formatProgressionSummary(sug){
  if(sug.status !== 'progress') return '';
  const groups = new Map();
  sug.sets.forEach((s, i)=>{
    let label = null;
    if(s.change === 'up') label = `↑ +${fmtNum(s.weightDelta)} kg`;
    else if(s.change === 'down') label = `↓ −${fmtNum(-s.weightDelta)} kg`;
    else if(s.repsDelta > 0) label = `+${s.repsDelta} rep${s.repsDelta === 1 ? '' : 's'}`;
    if(!label) return;
    if(!groups.has(label)) groups.set(label, []);
    groups.get(label).push(i + 1);
  });
  const parts = [...groups].map(([label, idx])=> `${label} on ${formatSetList(idx)}`);
  if(parts.length === 0) parts.push('Repeat last session');
  if(sug.topOfRange) parts.push('top of range — consider adding load');
  return parts.join(' · ');
}

// Sets of the two most recent sessions (any day) with usable sets for this exercise.
function findExerciseHistory(name){
  const found = [];
  const sorted = [...sessions].sort((a,b)=> new Date(b.date) - new Date(a.date));
  for(const s of sorted){
    const ex = s.exercises.find(e=> e.name === name);
    if(ex && progressionSets(ex.sets).sets.length){
      found.push(ex.sets);
      if(found.length === 2) break;
    }
  }
  return found;
}

function renderSuggestionHtml(ex){
  const [last, prev] = findExerciseHistory(ex.name);
  const sug = suggestProgression(ex, last, prev);
  if(sug.status === 'first'){
    const target = sug.range ? `for ${sug.range.min} reps` : 'with good form';
    return `<div class="last-time suggest-line">First time — pick a weight you can do ${target}</div>`;
  }
  const targets = sug.sets
    .map(s=> `<span class="sug-set ${s.change}">${s.weight == null ? 'BW' : fmtNum(s.weight)}×${s.reps}</span>`)
    .join(' · ');
  return `<div class="last-time suggest-line">Today: ${targets}<div class="suggest-summary">${formatProgressionSummary(sug)}</div></div>`;
}

function renderExercises(){
  const container = document.getElementById('exerciseList');
  container.innerHTML = '';

  PROGRAM[currentDay].exercises.forEach((ex, exIdx)=>{
    const card = document.createElement('div');
    card.className = 'exercise-card';
    card.dataset.exIdx = exIdx;

    const last = getLastSession(currentDay, ex.name);
    let lastHtml = '';
    if(last){
      const w = maxWeight(last.ex.sets);
      const dateStr = new Date(last.session.date).toLocaleDateString('en-US',{day:'numeric',month:'short'});
      lastHtml = `<div class="last-time">Last time (${dateStr}): <b>${w} kg</b> × ${last.ex.sets.length} sets</div>`;
    } else {
      lastHtml = `<div class="last-time">First time logging this exercise</div>`;
    }

    const best = getAllTimeBest(ex.name, editingIndex);
    const recordParts = [];
    if(isBodyweight(ex.name, editingIndex)){
      if(best.reps > 0) recordParts.push(`Best <b>${best.reps} reps</b>`);
    } else {
      if(best.e1rm > 0) recordParts.push(`Best e1RM <b>${roundHalf(best.e1rm)} kg</b>`);
      if(best.max > 0) recordParts.push(`max <b>${best.max} kg</b>`);
    }
    const recordHtml = recordParts.length ? `<div class="last-time record-line">${recordParts.join(' · ')}</div>` : '';

    // A suggestion for today makes no sense while correcting a past session.
    const suggestionHtml = editingSession ? '' : renderSuggestionHtml(ex);

    const editingExercise = editingSession ? editingSession.exercises.find(e=>e.name===ex.name) : null;

    let rows = '';
    for(let i=0;i<ex.sets;i++){
      const prefill = editingExercise && editingExercise.sets[i] ? editingExercise.sets[i] : null;
      const wVal = prefill && prefill.weight != null ? ` value="${prefill.weight}"` : '';
      const rVal = prefill && prefill.reps != null ? ` value="${prefill.reps}"` : '';
      rows += `
        <tr class="set-row">
          <td class="set-num">${i+1}</td>
          <td><input type="number" inputmode="decimal" class="w-input" placeholder="kg" data-set="${i}" min="0" step="0.5"${wVal}></td>
          <td><input type="number" inputmode="numeric" class="r-input" placeholder="reps" data-set="${i}" min="0"${rVal}></td>
        </tr>`;
    }

    card.innerHTML = `
      <div class="exercise-head">
        <div>
          <p class="exercise-name">${ex.name}</p>
          <div class="exercise-target">Target: ${ex.sets} × ${ex.reps}</div>
        </div>
        ${ex.injury ? `<span class="injury-badge">⚠ ${ex.injury}</span>` : ''}
      </div>
      ${lastHtml}
      ${suggestionHtml}
      ${recordHtml}
      <table class="sets-table">
        <thead><tr><th class="num">Set</th><th>Weight</th><th>Reps</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="plate-load" id="load-${exIdx}"></div>

    container.appendChild(card);

    const inputs = card.querySelectorAll('.w-input, .r-input');

      const seg = document.createElement('div');
      seg.className = 'plate-seg';
      loadBar.appendChild(seg);
    }
    function updateLoad(){
      const wInputs = card.querySelectorAll('.w-input');
      const segs = loadBar.querySelectorAll('.plate-seg');
      wInputs.forEach((inp, i)=>{
        segs[i].classList.toggle('filled', !!inp.value && parseFloat(inp.value) > 0);

/* ---------------- SAVE SESSION ---------------- */
async function saveSession(){
  const cards = document.querySelectorAll('.exercise-card');
  const exercises = [];
  let anyData = false;

  cards.forEach(card=>{
    const exIdx = parseInt(card.dataset.exIdx);
    const exDef = PROGRAM[currentDay].exercises[exIdx];
    const wInputs = card.querySelectorAll('.w-input');
    const rInputs = card.querySelectorAll('.r-input');
    const sets = [];
    wInputs.forEach((inp, i)=>{
      const weight = inp.value ? parseFloat(inp.value) : null;
      const reps = rInputs[i].value ? parseInt(rInputs[i].value) : null;
      if(weight || reps) anyData = true;
      sets.push({ weight, reps });
    });
    // isPR is filled in by recomputePRs() once the session is stored.
    exercises.push({ name: exDef.name, sets, isPR: false });
  });

  if(!anyData){
    const msg = document.getElementById('savedMsg');
    msg.style.color = 'var(--warn)';
    msg.textContent = 'Enter at least one weight or rep before saving';
    setTimeout(()=>{ msg.textContent=''; msg.style.color='var(--mint)'; }, 2500);
    return;
  }

  const note = document.getElementById('sessionNote').value.trim();

  if(editingIndex !== null){
    sessions[editingIndex] = {
      date: sessions[editingIndex].date,
      day: currentDay,
      exercises,
      note
    };
    editingIndex = null;
  } else {
    sessions.push({
      date: new Date().toISOString(),
      day: currentDay,
      exercises,
      note
    });
  }

  // Editing an older session can shift records in later ones, so re-derive them all.
  recomputePRs();
  const hasPR = exercises.some(e=>e.isPR);
  await persistSessions();

  document.getElementById('savedMsg').style.color = 'var(--mint)';
  document.getElementById('savedMsg').textContent = hasPR ? '✓ Session saved — 🏆 new record!' : '✓ Session saved';
  document.getElementById('sessionNote').value = '';
  document.getElementById('editBanner').style.display = 'none';
  renderDayRack();
  renderExercises();
  setTimeout(()=>{ document.getElementById('savedMsg').textContent=''; }, 3000);
}

function buildChartCard(name){
  const bw = isBodyweight(name);
  const metric = METRICS[progressMetric];
  const valueOf = bw ? metric.bwValue : metric.value;
  const unit = bw ? 'reps' : 'kg';

  const points = sessions
    .map(s=> ({ date: s.date, ex: s.exercises.find(e=>e.name===name) }))
    .filter(p=> p.ex)
    .map(p=> ({ date: p.date, weight: valueOf(p.ex.sets) }))
    .filter(p=> p.weight > 0)
    .sort((a,b)=> new Date(a.date)-new Date(b.date));

  if(points.length===0) return null;

  const maxW = Math.max(...points.map(p=>p.weight), 1);
  const card = document.createElement('div');
  card.className = 'chart-card';
  const last8 = points.slice(-8);

  let bars = '';
  last8.forEach(p=>{
    const h = Math.max(6, (p.weight / maxW) * 100);
    const d = new Date(p.date).toLocaleDateString('en-US',{day:'numeric',month:'numeric'});
    bars += `
      <div class="bar-col">
        <div class="bar-val">${p.weight}</div>
        <div class="bar" style="height:${h}%"></div>
        <div class="bar-label">${d}</div>
      </div>`;
  });

  const first = points[0].weight;
  const latest = points[points.length-1].weight;
  const diff = round1(latest - first);
  const diffLabel = diff > 0 ? `+${diff} ${unit} since first log` : diff < 0 ? `${diff} ${unit} since first log` : 'unchanged since first log';
  const diffClass = diff > 0 ? 'delta-up' : diff < 0 ? 'delta-down' : 'delta-flat';

  card.innerHTML = `
    <div class="chart-title">${name} — ${bw ? metric.bwTitle : metric.title}</div>
    <div class="bars">${bars}</div>
    <div style="margin-top:14px;"><span class="delta-badge ${diffClass}">${diffLabel}</span></div>
  `;
  return card;
}

function renderChart(){
  const select = document.getElementById('exerciseSelect');
  const name = select.value || select.options[0]?.value;
  const container = document.getElementById('progressCharts');
  container.innerHTML = '';

  if(!name){
    container.innerHTML = `<div class="empty-state"><span class="big">Nothing to show yet</span>Log at least one session in the "Today" tab to see your progress here.</div>`;
    return;
  }

  const card = buildChartCard(name);
  if(!card){
    container.innerHTML = `<div class="empty-state"><span class="big">No data yet</span>You haven't logged any weights for this exercise yet.</div>`;
    return;
  }
  container.appendChild(card);
}

function renderDayStats(day){
  const container = document.getElementById('progressCharts');
  container.innerHTML = '';

  const exNames = PROGRAM[day].exercises.map(e=>e.name);
  let anyCard = false;
  exNames.forEach(name=>{
    const card = buildChartCard(name);
    if(card){ container.appendChild(card); anyCard = true; }
  });

  if(!anyCard){
    container.innerHTML = `<div class="empty-state"><span class="big">No data yet</span>You haven't logged any weights for ${PROGRAM[day].label} exercises yet.</div>`;
  }
}

/* ---------------- EXPORT REPORT ---------------- */
// Local calendar date as YYYY-MM-DD (toISOString would shift late-evening sessions to UTC).
function isoDate(d){
  d = new Date(d);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function mondayOf(d){
  const m = new Date(d);
  m.setHours(0,0,0,0);
  m.setDate(m.getDate() - (m.getDay() + 6) % 7);
  return m;
}

function fmtNum(v){
  return String(round1(v));
}

function mdCell(s){
  return String(s).replace(/\|/g, '\\|').replace(/\n/g, ' ');
}

function hasSetData(sets){
  return sets.some(s=> num(s.weight) > 0 || num(s.reps) > 0);
}

function compactSets(sets, bodyweight){
  return sets
    .filter(s=> num(s.weight) > 0 || num(s.reps) > 0)
    .map(s=>{
      const w = num(s.weight) > 0 ? fmtNum(num(s.weight)) : (bodyweight ? 'BW' : '—');
      const r = num(s.reps) > 0 ? num(s.reps) : '?';
      return `${w}×${r}`;
    })
    .join(', ');
}

function pctChange(from, to){
  if(!(from > 0)) return '';
  const p = round1((to - from) / from * 100);
  return ` (${p > 0 ? '+' : ''}${p}%)`;
}

function signed(v, unit){
  const r = round1(v);
  return `${r > 0 ? '+' : ''}${r} ${unit}`;
}

function avg(values){
  return values.length ? values.reduce((a,b)=>a+b, 0) / values.length : 0;
}

function buildReportMarkdown(){
  const sorted = [...sessions].sort((a,b)=> new Date(a.date) - new Date(b.date));
  const firstDate = new Date(sorted[0].date);
  const lastDate = new Date(sorted[sorted.length-1].date);
  const spanDays = Math.round((mondayOf(lastDate) - mondayOf(firstDate)) / 86400000);
  const weeksSpanned = spanDays / 7 + 1;
  const perWeek = round1(sorted.length / weeksSpanned);

  // Program order first, then any exercise only present in history.
  const names = allExerciseNames();
  sorted.forEach(s=> s.exercises.forEach(e=>{ if(!names.includes(e.name)) names.push(e.name); }));
  const bwByName = {};
  names.forEach(n=> bwByName[n] = isBodyweight(n));

  const L = [];
  L.push('# Rack training report', '');
  L.push(`- Generated: ${isoDate(new Date())}`);
  L.push(`- Period: ${isoDate(firstDate)} → ${isoDate(lastDate)}`);
  L.push(`- Total sessions: ${sorted.length}`);
  L.push(`- Average frequency: ${perWeek} sessions/week (over ${weeksSpanned} calendar weeks, Monday-based)`);
  L.push('');
  L.push('## Metrics');
  L.push('');
  L.push('- Units: weights in kg; dates are ISO (YYYY-MM-DD), local time.');
  L.push('- **e1RM** (estimated one-rep max), Epley formula: `weight × (1 + reps / 30)`; a 1-rep set counts as its weight. Per session, the best set is used.');
  L.push('- **Volume** = Σ weight × reps over all sets of the exercise in a session.');
  L.push('- **Max** = heaviest weight lifted in a session (sets logged without reps included).');
  L.push('- Sets with empty weight or reps are ignored for e1RM and volume.');
  L.push('- **Bodyweight exercises** (no load ever logged) are measured in reps: e1RM → max reps in a set, volume → total reps. Marked "BW".');
  L.push('- A **PR** is a session whose e1RM (max reps for bodyweight) beats every earlier session of that exercise; the first log of an exercise counts as a PR.');
  L.push('- Set notation in the log: `weight×reps`; `BW` = bodyweight, `?` = reps not logged, `—` = weight not logged.');
  L.push('');

  // ---- Per-exercise summary
  L.push('## Exercise summary', '');
  L.push('| Exercise | Unit | Sessions | First | Last | e1RM start → now → best | Δ e1RM start→now | Max start → now | Avg volume first 3 | Avg volume last 3 |');
  L.push('|---|---|---|---|---|---|---|---|---|---|');
  names.forEach(name=>{
    const bw = bwByName[name];
    const logs = sorted
      .map(s=> ({ date: s.date, ex: s.exercises.find(e=>e.name===name) }))
      .filter(p=> p.ex && hasSetData(p.ex.sets));
    if(logs.length===0) return;

    const strength = logs.map(p=> bw ? maxReps(p.ex.sets) : bestE1RM(p.ex.sets)).filter(v=> v > 0);
    const volumes = logs.map(p=> bw ? totalReps(p.ex.sets) : totalVolume(p.ex.sets)).filter(v=> v > 0);
    const maxes = logs.map(p=> maxWeight(p.ex.sets)).filter(v=> v > 0);
    const unit = bw ? 'reps' : 'kg';

    let e1rmCell = '—', deltaCell = '—';
    if(strength.length){
      const start = strength[0], now = strength[strength.length-1], best = Math.max(...strength);
      e1rmCell = `${fmtNum(start)} → ${fmtNum(now)} → ${fmtNum(best)}`;
      deltaCell = signed(now - start, unit) + pctChange(start, now);
    }
    const maxCell = bw ? 'n/a (BW)' : maxes.length ? `${fmtNum(maxes[0])} → ${fmtNum(maxes[maxes.length-1])}` : '—';
    const volFirst = volumes.length ? fmtNum(avg(volumes.slice(0,3))) : '—';
    const volLast = volumes.length ? fmtNum(avg(volumes.slice(-3))) : '—';

    L.push(`| ${mdCell(name)} | ${bw ? 'BW reps' : 'kg'} | ${logs.length} | ${isoDate(logs[0].date)} | ${isoDate(logs[logs.length-1].date)} | ${e1rmCell} | ${deltaCell} | ${maxCell} | ${volFirst} | ${volLast} |`);
  });
  L.push('');

  // ---- Weekly volume (every calendar week in the period, including empty ones)
  L.push('## Weekly volume', '');
  L.push('| Week (Mon) | Sessions | Volume (kg) | Bodyweight reps |');
  L.push('|---|---|---|---|');
  const weeks = new Map();
  for(let w = mondayOf(firstDate); w <= lastDate; w.setDate(w.getDate()+7)){
    weeks.set(isoDate(w), { sessions:0, volume:0, reps:0 });
  }
  sorted.forEach(s=>{
    const wk = weeks.get(isoDate(mondayOf(s.date)));
    if(!wk) return;
    wk.sessions++;
    s.exercises.forEach(ex=>{
      if(bwByName[ex.name]) wk.reps += totalReps(ex.sets);
      else wk.volume += totalVolume(ex.sets);
    });
  });
  weeks.forEach((wk, key)=>{
    L.push(`| ${key} | ${wk.sessions} | ${Math.round(wk.volume)} | ${wk.reps} |`);
  });
  L.push('');

  // ---- PRs
  L.push('## Personal records', '');
  const prs = [];
  sorted.forEach(s=> s.exercises.forEach(ex=>{
    if(!ex.isPR) return;
    const bw = bwByName[ex.name];
    prs.push(`| ${isoDate(s.date)} | ${mdCell(ex.name)} | ${bw ? `${maxReps(ex.sets)} reps (BW)` : `e1RM ${fmtNum(bestE1RM(ex.sets))} kg`} |`);
  }));
  if(prs.length){
    L.push('| Date | Exercise | Value |', '|---|---|---|', ...prs);
  } else {
    L.push('_No PRs recorded._');
  }
  L.push('');

  // ---- Full log
  L.push('## Session log', '');
  sorted.forEach(s=>{
    const dayLabel = PROGRAM[s.day] ? `${s.day} — ${PROGRAM[s.day].label}` : s.day;
    L.push(`### ${isoDate(s.date)} · Day ${dayLabel}`, '');
    s.exercises.forEach(ex=>{
      if(!hasSetData(ex.sets)) return;
      const bw = bwByName[ex.name];
      const stats = bw
        ? `max ${maxReps(ex.sets)} reps · total ${totalReps(ex.sets)} reps`
        : `e1RM ${fmtNum(bestE1RM(ex.sets))} kg · volume ${Math.round(totalVolume(ex.sets))} kg`;
      L.push(`- ${ex.name}: ${compactSets(ex.sets, bw)} — ${stats}${ex.isPR ? ' · PR' : ''}`);
    });
    if(s.note) L.push(`- Note: ${s.note.replace(/\n/g, ' ')}`);
    L.push('');
  });

  return L.join('\n');
}

function flashExportMsg(text, isError){
  const msg = document.getElementById('exportMsg');
  msg.style.color = isError ? 'var(--warn)' : 'var(--mint)';
  msg.textContent = text;
  clearTimeout(flashExportMsg.timer);
  flashExportMsg.timer = setTimeout(()=>{ msg.textContent=''; }, isError ? 6000 : 3000);
}

// Mobile/PWA: share sheet ("Save to Files", AirDrop, apps); desktop: Blob download.
// `types` are tried in order because some platforms reject e.g. text/markdown but accept text/plain.
async function shareOrDownload(content, filename, types){
  if(navigator.canShare){
    for(const type of types){
      const file = new File([content], filename, { type });
      if(!navigator.canShare({ files:[file] })) continue;
      try{
        await navigator.share({ files:[file], title: filename });
        return;
      }catch(e){
        if(e.name === 'AbortError') return;
        break;
      }
    }
  }

  const url = URL.createObjectURL(new Blob([content], { type: types[0] }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  flashExportMsg(`✓ ${filename} downloaded`);
}

async function exportReport(){
  if(sessions.length===0){
    flashExportMsg('No sessions to export yet', true);
    return;
  }
  await shareOrDownload(buildReportMarkdown(), `rack-report-${isoDate(new Date())}.md`, ['text/markdown', 'text/plain']);
}

  const json = JSON.stringify(buildBackup(), null, 2);
  await shareOrDownload(json, `rack-backup-${isoDate(new Date())}.json`, ['application/json', 'text/plain']);
}

function isPlainObject(v){
  return v !== null && typeof v === 'object' && !Array.isArray(v);
}

function isSetValue(v){
  return v === null || v === undefined || (Number.isFinite(Number(v)) && Number(v) >= 0);
}

// Returns an error message, or null when the backup has the expected shape.
function validateBackup(data){
  if(!isPlainObject(data)) return 'Not a Rack backup (expected a JSON object).';
  if(!Number.isInteger(data.version)) return 'Missing or invalid "version".';
  if(data.version > BACKUP_VERSION) return `Backup version ${data.version} is newer than this app supports (${BACKUP_VERSION}).`;
  if(!Array.isArray(data.sessions)) return '"sessions" must be an array.';

  for(let i = 0; i < data.sessions.length; i++){
    const s = data.sessions[i];
    const where = `Session ${i+1}`;
    if(!isPlainObject(s)) return `${where} is not an object.`;
    if(typeof s.date !== 'string' || isNaN(Date.parse(s.date))) return `${where} has an invalid date.`;
    if(typeof s.day !== 'string' || !s.day) return `${where} has no program day.`;
    if(s.note !== undefined && typeof s.note !== 'string') return `${where} has an invalid note.`;
    if(!Array.isArray(s.exercises)) return `${where} has no exercise list.`;
    for(const ex of s.exercises){
      if(!isPlainObject(ex) || typeof ex.name !== 'string' || !ex.name) return `${where} has an exercise without a name.`;
      if(!Array.isArray(ex.sets)) return `${where}, ${ex.name}: sets must be an array.`;
      if(ex.isPR !== undefined && typeof ex.isPR !== 'boolean') return `${where}, ${ex.name}: invalid PR flag.`;
      for(const st of ex.sets){
        if(!isPlainObject(st) || !isSetValue(st.weight) || !isSetValue(st.reps)) return `${where}, ${ex.name}: invalid set.`;
      }
    }
  }

  if(!isPlainObject(data.program) || Object.keys(data.program).length === 0) return 'Missing or invalid "program".';
  for(const [day, def] of Object.entries(data.program)){
    if(!isPlainObject(def) || typeof def.label !== 'string' || !Array.isArray(def.exercises)) return `Program day ${day} is invalid.`;
    for(const ex of def.exercises){
      if(!isPlainObject(ex) || typeof ex.name !== 'string' || !ex.name || !Number.isInteger(ex.sets) || ex.sets < 1){
        return `Program day ${day} has an invalid exercise.`;
      }
      // Optional (older backups have none).
      if(ex.increment !== undefined && !(typeof ex.increment === 'number' && Number.isFinite(ex.increment) && ex.increment > 0)){
        return `Program day ${day}, ${ex.name}: invalid increment.`;
      }
    }
  }
  return null;
}

function describeSessions(list){
  if(list.length === 0) return '0 sessions';
  const dates = list.map(s=> new Date(s.date)).sort((a,b)=> a - b);
  return `${list.length} session${list.length===1 ? '' : 's'} from ${isoDate(dates[0])} to ${isoDate(dates[dates.length-1])}`;
}

// Replaces sessions and program with a validated backup, keeping the previous data under *-prev keys.
async function applyBackup(data){
  try{
    localStorage.setItem(PREV_SESSIONS_KEY, JSON.stringify(sessions));
    localStorage.setItem(PREV_PROGRAM_KEY, JSON.stringify(PROGRAM));
  }catch(e){
    throw new Error('Could not save a copy of the current data, import cancelled.');
  }
  await replaceData(data.sessions, data.program);
}

async function replaceData(newSessions, newProgram){
  sessions = JSON.parse(JSON.stringify(newSessions));
  const program = JSON.parse(JSON.stringify(newProgram));
  Object.keys(DEFAULT_PROGRAM).forEach(d=>{ if(!program[d]) program[d] = JSON.parse(JSON.stringify(DEFAULT_PROGRAM[d])); });
  PROGRAM = program;

  recomputePRs();
  await persistSessions();
  persistProgram();
}

// Data saved before the last import: null if there is none, { error } if it is unreadable.
function readUndoData(){
  let rawSessions, rawProgram;
  try{
    rawSessions = localStorage.getItem(PREV_SESSIONS_KEY);
    rawProgram = localStorage.getItem(PREV_PROGRAM_KEY);
  }catch(e){
    return null;
  }
  if(rawSessions === null && rawProgram === null) return null;

  let data;
  try{
    data = {
      version: BACKUP_VERSION,
      sessions: rawSessions !== null ? JSON.parse(rawSessions) : sessions,
      program: rawProgram !== null ? JSON.parse(rawProgram) : PROGRAM
    };
  }catch(e){
    return { error: 'The saved pre-import copy is not valid JSON.' };
  }
  const error = validateBackup(data);
  return error ? { error: `The saved pre-import copy is invalid: ${error}` } : { data };
}

async function restorePreviousData(data){
  await replaceData(data.sessions, data.program);
  // Drop the copy so the same undo cannot be applied twice.
  try{
    localStorage.removeItem(PREV_SESSIONS_KEY);
    localStorage.removeItem(PREV_PROGRAM_KEY);
  }catch(e){}
}

function updateUndoButton(){
  document.getElementById('undoImportBtn').style.display = readUndoData() ? '' : 'none';
}

function refreshAfterDataChange(){
  editingIndex = null;
  if(!PROGRAM[currentDay]) currentDay = Object.keys(PROGRAM)[0];
  if(!PROGRAM[programDay]) programDay = Object.keys(PROGRAM)[0];
  document.getElementById('exerciseSelect').innerHTML = '';
  document.getElementById('statsDayRack').innerHTML = '';
  renderDayRack();
  renderExercises();
  renderProgressView();
}

async function undoImport(){
  const undo = readUndoData();
  if(!undo){
    updateUndoButton();
    return;
  }
  if(undo.error){
    flashExportMsg(`${undo.error} Nothing was changed.`, true);
    return;
  }

  const ok = confirm(
    `Restore the data from before the last import: ${describeSessions(undo.data.sessions)}?\n` +
    `Current data (${describeSessions(sessions)}) will be replaced. This undo can only be done once.`
  );
  if(!ok) return;

  await restorePreviousData(undo.data);
  refreshAfterDataChange();
  flashExportMsg(`✓ Restored ${describeSessions(sessions)}`);
}

async function importBackup(file){
  if(!/\.json$/i.test(file.name)){
    flashExportMsg('Please choose a .json backup file.', true);
    return;
  }

  let data;
  try{
    data = JSON.parse(await file.text());
  }catch(e){
    flashExportMsg('This file is not valid JSON. Nothing was changed.', true);
    return;
  }

  const error = validateBackup(data);
  if(error){
    flashExportMsg(`Invalid backup: ${error} Nothing was changed.`, true);
    return;
  }

  const ok = confirm(
    `The backup contains ${describeSessions(data.sessions)}.\n` +
    `Current data: ${describeSessions(sessions)}.\n\n` +
    `Replace the current data? (A copy is kept so the import can be undone.)`
  );
  if(!ok) return;

  try{
    await applyBackup(data);
  }catch(e){
    flashExportMsg(e.message, true);
    return;
  }

  refreshAfterDataChange();
  flashExportMsg(`✓ Imported ${describeSessions(sessions)}`);
}

function renderHistoryView(){
  const list = document.getElementById('historyList');
  list.innerHTML = '';

  if(sessions.length===0){
    list.innerHTML = `<div class="empty-state"><span class="big">History is empty</span>Saved sessions will appear here.</div>`;
    return;
  }

  const sorted = [...sessions].sort((a,b)=> new Date(b.date)-new Date(a.date));
  sorted.forEach((s)=>{
    const realIdx = sessions.indexOf(s);
    const item = document.createElement('div');
    item.className = 'history-item';
    const dateStr = new Date(s.date).toLocaleDateString('en-US',{weekday:'long', day:'numeric', month:'long'});

    let exRows = '';
    s.exercises.forEach(ex=>{
      const w = maxWeight(ex.sets);
      const setsWithData = ex.sets.filter(st=>st.weight).length;
      if(setsWithData===0) return;
      const prBadge = ex.isPR ? `<span class="pr-badge">🏆 PR</span>` : '';
      exRows += `<div class="history-ex"><span>${ex.name}${prBadge}</span><b>${w} kg × ${setsWithData}</b></div>`;
    });

    const noteHtml = s.note ? `<div class="history-note">${s.note}</div>` : '';

    item.innerHTML = `
      <div class="history-head">
        <span class="history-day">${PROGRAM[s.day] ? PROGRAM[s.day].label : s.day}</span>
        <span class="history-date">${dateStr}</span>
      </div>
      ${exRows}
      ${noteHtml}
      <div class="history-actions">
        <button class="edit-btn" data-idx="${realIdx}">Edit</button>
        <button class="del-btn" data-idx="${realIdx}">Delete session</button>
      </div>
    `;
    list.appendChild(item);
  });

  list.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = parseInt(btn.dataset.idx);
      sessions.splice(idx,1);
      recomputePRs();
      await persistSessions();
      renderHistoryView();
      renderDayRack();
    });
  });

  list.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx);
      startEditSession(idx);
    });
  });
}
