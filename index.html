<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RACK — Workout Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#0C1130">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C1130;
    --bg2:#1F2444;
    --card:#242A4E;
    --card2:#2C3358;
    --stroke:#343B66;
    --text:#F5F6FA;
    --muted:#9498BE;
    --coral:#FF7F6B;
    --coral-dim:#B85B4F;
    --purple:#8C7DFF;
    --purple-dim:#5F55B0;
    --mint:#3FD8B0;
    --mint-dim:#2A9A80;
    --yellow:#FFCE54;
    --warn:#FF5F6D;
    --radius:22px;
    --radius-sm:14px;
    --radius-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:22px 16px 110px;
  }

  /* ---- Header ---- */
  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .header h1{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:.5px;
    margin:0;
    color:var(--text);
  }
  .header h1 span{color:var(--coral);}
  .header .date{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:600;
  }
  .header-right{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .wake-btn{
    width:32px;
    height:32px;
    border-radius:50%;
    border:1.5px solid var(--stroke);
    background:var(--card);
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    cursor:pointer;
    flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .wake-btn svg{ width:16px; height:16px; }
  .wake-btn .bulb{ fill:none; }
  /* Active only while a wake lock is actually held, not merely requested. */
  .wake-btn.active{
    background:rgba(255,206,84,0.14);
    border-color:var(--yellow);
    color:var(--yellow);
  }
  .wake-btn.active .bulb{ fill:currentColor; fill-opacity:.35; }
  @media (prefers-reduced-motion: reduce){
    .wake-btn{ transition:none; }
  }

  /* ---- Day tiles (colorful, reference-inspired) ---- */
  .day-rack{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .day-plate{
    flex:1;
    position:relative;
    border-radius:var(--radius);
    padding:20px 10px;
    text-align:center;
    cursor:pointer;
    transition:all .18s ease;
    border:none;
  }
  .day-plate .plate-name{
    display:block;
    font-weight:700;
    font-size:14px;
    line-height:1.25;
  }
  .day-plate .done-dot{
    position:absolute;
    top:10px;
    right:10px;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#fff;
    display:none;
  }
  .day-plate.done-today .done-dot{display:block;}

  .day-a{ background:rgba(255,127,107,0.14); color:var(--coral); box-shadow:none; }
  .day-a.active{ background:linear-gradient(160deg, var(--coral), var(--coral-dim)); color:#1A0F0C; box-shadow:0 10px 22px rgba(255,127,107,0.35); }
  .day-b{ background:rgba(140,125,255,0.14); color:var(--purple); box-shadow:none; }
  .day-b.active{ background:linear-gradient(160deg, var(--purple), var(--purple-dim)); color:#12102B; box-shadow:0 10px 22px rgba(140,125,255,0.35); }
  .day-c{ background:rgba(63,216,176,0.14); color:var(--mint); box-shadow:none; }
  .day-c.active{ background:linear-gradient(160deg, var(--mint), var(--mint-dim)); color:#0B241D; box-shadow:0 10px 22px rgba(63,216,176,0.35); }

  /* ---- Edit banner ---- */
  .edit-banner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(140,125,255,0.14);
    border-radius:var(--radius-sm);
    padding:10px 14px;
    margin-bottom:12px;
    font-size:12px;
    color:var(--text);
  }
  .edit-banner button{
    background:none;
    border:none;
    color:var(--purple);
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    font-family:'Poppins', sans-serif;
  }

  /* ---- Exercise card ---- */
  .exercise-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:10px;
  }
  .exercise-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:10px;
    gap:10px;
  }
  .exercise-name{
    font-size:15px;
    font-weight:600;
    color:var(--text);
    margin:0 0 3px;
  }
  .exercise-target{
    font-size:11.5px;
    color:var(--muted);
    font-weight:500;
  }
  .injury-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:rgba(255,95,109,0.16);
    color:var(--warn);
    font-size:9.5px;
    font-weight:700;
    padding:4px 9px;
    border-radius:var(--radius-pill);
    white-space:nowrap;
    letter-spacing:.3px;
    text-transform:uppercase;
  }

  .last-time{
    font-size:11px;
    color:var(--muted);
    background:var(--card2);
    border-radius:10px;
    padding:7px 10px;
    margin-bottom:8px;
    font-weight:500;
  }
  .last-time b{color:var(--text); font-weight:700;}
  .record-line{ color:var(--yellow); }
  .record-line b{ color:var(--yellow); }
  /* ---- Stall alerts ---- */
  .stall-badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    margin-left:7px;
    vertical-align:2px;
    min-height:22px;
    padding:3px 9px;
    border:none;
    border-radius:var(--radius-pill);
    font-family:'Poppins', sans-serif;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.2px;
    white-space:nowrap;
    background:rgba(255,206,84,0.16);
    color:var(--yellow);
    -webkit-tap-highlight-color:transparent;
  }
  button.stall-badge{ cursor:pointer; }
  .stall-badge.regressing{
    background:rgba(255,95,109,0.10);
    color:#FF8A94;
  }
  .chart-title .stall-badge{ text-transform:none; letter-spacing:.2px; }
  .stall-panel{
    background:var(--card2);
    border-radius:12px;
    padding:11px 12px 12px;
    margin-bottom:8px;
    font-size:11.5px;
    color:var(--muted);
    line-height:1.5;
  }
  .stall-panel[hidden]{ display:none; }
  .stall-injury{ color:var(--warn); font-weight:600; margin-bottom:6px; }
  .stall-data{ color:var(--text); font-weight:600; margin-bottom:6px; }
  .stall-panel ol{ margin:0 0 10px; padding-left:18px; }
  .stall-panel li{ margin-bottom:2px; }
  .stall-ack-btn{
    background:none;
    border:1.5px solid var(--stroke);
    color:var(--text);
    border-radius:var(--radius-pill);
    padding:9px 16px;
    min-height:40px;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:12px;
    cursor:pointer;
  }
  .backup-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    background:var(--card);
    border:1.5px solid var(--stroke);
    border-radius:var(--radius-sm);
    padding:8px 8px 8px 14px;
    margin-bottom:10px;
    font-size:12px;
    font-weight:600;
    color:var(--text);
  }
  .backup-banner-actions{ display:flex; gap:6px; margin-left:auto; }
  .backup-now-btn, .backup-later-btn{
    border:none;
    border-radius:var(--radius-pill);
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:11.5px;
    min-height:34px;
    padding:7px 13px;
    cursor:pointer;
  }
  .backup-now-btn{ background:var(--mint); color:#08211A; }
  .backup-later-btn{ background:transparent; color:var(--muted); }
  .backup-line{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    text-align:center;
    margin:6px 0 2px;
  }
  .backup-line.overdue{ color:var(--warn); }
  .stall-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:rgba(255,206,84,0.12);
    color:var(--yellow);
    border-radius:var(--radius-sm);
    padding:8px 8px 8px 14px;
    margin-bottom:14px;
    font-size:12px;
    font-weight:600;
  }
  .stall-banner-close{
    flex-shrink:0;
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    background:transparent;
    color:var(--yellow);
    font-size:15px;
    cursor:pointer;
  }
  .suggest-line .sug-set{ color:var(--text); font-weight:700; white-space:nowrap; }
  .suggest-line .sug-set.up{ color:var(--mint); }
  .suggest-line .sug-set.down{ color:var(--warn); }
  .suggest-summary{
    font-size:10.5px;
    color:var(--muted);
    margin-top:3px;
  }

  .sets-table{width:100%; border-collapse:collapse; margin-top:10px;}
  .sets-table th{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    text-align:left;
    padding-bottom:6px;
    font-weight:600;
  }
  .sets-table th.num, .sets-table td.num{text-align:center; width:40px;}
  .sets-table td{padding:4px 4px;}
  .set-row input{
    width:100%;
    background:var(--card2);
    border:1.5px solid transparent;
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:9px 6px;
    text-align:center;
  }
  .set-row input:focus{
    outline:none;
    border-color:var(--coral);
  }
  /* Suggested targets sit in the placeholder: grey until a real value is typed or confirmed. */
  .set-row input::placeholder{
    color:var(--muted);
    opacity:.7;
    font-weight:500;
  }
  .sets-table td.done-cell{ width:48px; padding:4px 0 4px 4px; }
  .set-done-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1.5px solid var(--stroke);
    background:transparent;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .set-done-btn svg{ width:18px; height:18px; }
  .set-row.done .set-done-btn{
    background:var(--mint);
    border-color:var(--mint);
    color:#08211A;
  }
  .set-row.done .set-num{ color:var(--mint); }
  @media (prefers-reduced-motion: reduce){
    .set-done-btn{ transition:none; }
  }
  .set-num{
    color:var(--muted);
    font-weight:700;
    font-size:13px;
    text-align:center;
  }
  .delta-badge{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:var(--radius-pill);
    display:inline-block;
    margin-top:2px;
  }
  .delta-up{color:var(--mint); background:rgba(63,216,176,0.14);}
  .delta-flat{color:var(--muted); background:rgba(148,152,190,0.14);}
  .delta-down{color:var(--warn); background:rgba(255,95,109,0.14);}

  .note-row{
    margin-top:10px;
    font-size:11.5px;
    color:var(--warn);
    background:rgba(255,95,109,0.10);
    padding:8px 10px;
    border-radius:10px;
    line-height:1.4;
    font-weight:500;
  }

  /* ---- Loading bar ---- */
  .plate-load{
    display:flex;
    gap:3px;
    margin-top:10px;
  }
  .plate-seg{
    flex:1;
    height:5px;
    border-radius:3px;
    background:var(--card2);
    transition:background .2s ease;
  }
  .plate-seg.filled{background:var(--coral);}

  /* ---- Note toggle (collapsed by default) ---- */
  .note-toggle{
    background:none;
    border:none;
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    padding:6px 2px;
    font-family:'Poppins', sans-serif;
  }
  .note-field-wrap{
    margin:4px 0 6px;
  }
  .note-field{
    width:100%;
    background:var(--card);
    border:1.5px solid transparent;
    border-radius:var(--radius-sm);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-size:13px;
    padding:11px 12px;
    resize:vertical;
    min-height:44px;
  }
  .note-field:focus{ outline:none; border-color:var(--purple); }

  /* ---- Save button ---- */
  .save-bar{
    position:sticky;
    bottom:0;
    background:linear-gradient(0deg, var(--bg) 65%, transparent);
    padding:16px 0 4px;
    margin-top:6px;
  }
  .save-btn{
    width:100%;
    background:linear-gradient(120deg, var(--mint), var(--mint-dim));
    color:#08211A;
    border:none;
    border-radius:var(--radius-pill);
    padding:16px;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:.2px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(63,216,176,0.30);
  }
  .save-btn:active{opacity:.88;}

  .saved-msg{
    text-align:center;
    color:var(--mint);
    font-size:12px;
    font-weight:600;
    margin-top:10px;
    height:14px;
  }

  /* ---- Progress view ---- */
  .stats-toggle{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    background:var(--card);
    border-radius:var(--radius-pill);
    padding:5px;
  }
  .stats-toggle-btn, .metric-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:12px;
    padding:9px 8px;
    border-radius:var(--radius-pill);
    cursor:pointer;
  }
  .stats-toggle-btn.active, .metric-btn.active{
    background:var(--coral);
    color:#1A0F0C;
  }
  .export-btn{
    width:100%;
    background:var(--card);
    border:1.5px solid var(--stroke);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:13px;
    padding:14px;
    border-radius:var(--radius-pill);
    cursor:pointer;
    margin-top:6px;
  }
  .export-btn:active{opacity:.88;}

  /* ---- Progress: Lifts / Body ---- */
  .section-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:12.5px;
    padding:9px 8px;
    border-radius:var(--radius-pill);
    cursor:pointer;
  }
  .section-btn.active{ background:var(--text); color:var(--bg); }
  .body-import-btn{ margin:0 0 6px; }
  .recomp-verdict{ font-size:17px; font-weight:700; margin-bottom:4px; }
  .recomp-verdict.tone-good{ color:var(--mint); }
  .recomp-verdict.tone-bad{ color:var(--warn); }
  .recomp-verdict.tone-warn{ color:var(--yellow); }
  .recomp-verdict.tone-neutral{ color:var(--text); }
  .recomp-deltas{ font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:4px; }
  .recomp-advice{ font-size:12px; color:var(--muted); line-height:1.5; }
  .recomp-note{ font-size:10px; color:var(--muted); opacity:.75; margin-top:8px; }
  .body-range{ margin-bottom:14px; }
  .range-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:12px;
    padding:8px;
    border-radius:var(--radius-pill);
    cursor:pointer;
  }
  .range-btn.active{ background:var(--coral); color:#1A0F0C; }
  .body-tiles{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .body-tile{
    background:var(--card2);
    border-radius:12px;
    padding:10px 11px;
    min-width:0;
  }
  .body-tile-label{ font-size:10.5px; color:var(--muted); font-weight:600; }
  .body-tile-value{ font-size:19px; font-weight:700; color:var(--text); margin:2px 0; }
  .body-unit{ font-size:11px; font-weight:600; color:var(--muted); }
  .body-delta{ font-size:10.5px; font-weight:600; }
  .body-delta.flat{ color:var(--muted); }
  .body-delta.good{ color:var(--mint); }
  .body-delta.bad{ color:var(--warn); }
  .body-note{ font-size:12px; color:var(--muted); padding:16px 0; text-align:center; }
  .body-subtitle{ margin-top:18px; }
  .line-chart{ display:block; width:100%; height:auto; overflow:visible; }
  .lc-grid{ stroke:var(--stroke); stroke-width:.6; }
  .lc-ref{ stroke:var(--muted); stroke-width:.8; stroke-dasharray:3 3; opacity:.7; }
  .lc-label{ fill:var(--muted); font-size:8.5px; font-family:'Poppins', sans-serif; }
  .lc-raw{ fill:var(--muted); opacity:.45; }
  .lc-ma, .lc-fat, .lc-muscle, .lc-strength{ fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
  .lc-ma{ stroke:var(--coral); }
  .lc-fat{ stroke:var(--yellow); }
  .lc-muscle{ stroke:var(--mint); }
  .lc-strength{ stroke:var(--purple); }
  .lc-marker{ stroke:none; }
  .lc-ma.lc-marker{ fill:var(--coral); }
  .lc-fat.lc-marker{ fill:var(--yellow); }
  .lc-muscle.lc-marker{ fill:var(--mint); }
  .lc-strength.lc-marker{ fill:var(--purple); }
  .lc-legend{ display:flex; gap:14px; margin-top:8px; font-size:10.5px; color:var(--muted); font-weight:600; flex-wrap:wrap; }
  .lg::before{ content:''; display:inline-block; width:12px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .lg-raw::before{ width:6px; height:6px; border-radius:50%; background:var(--muted); opacity:.6; }
  .lg-ma::before{ background:var(--coral); }
  .lg-fat::before{ background:var(--yellow); }
  .lg-muscle::before{ background:var(--mint); }
  .progress-select{
    width:100%;
    background:var(--card);
    border:none;
    color:var(--text);
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:14px;
    padding:13px;
    border-radius:var(--radius-sm);
    margin-bottom:16px;
  }
  .chart-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px 16px 14px;
    margin-bottom:14px;
  }
  .chart-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    margin-bottom:14px;
    font-weight:600;
  }
  .bars{
    display:flex;
    align-items:flex-end;
    gap:6px;
    height:130px;
    padding:0 2px;
  }
  .bar-col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    min-width:0;
  }
  .bar{
    width:100%;
    max-width:24px;
    background:linear-gradient(180deg, var(--coral), var(--coral-dim));
    border-radius:8px 8px 3px 3px;
  }
  .bar-val{
    font-size:10px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:4px;
    white-space:nowrap;
  }
  .bar-label{
    font-size:9px;
    color:var(--muted);
    margin-top:6px;
    text-align:center;
    font-weight:500;
  }
  .empty-state{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:50px 20px;
    line-height:1.6;
  }
  .empty-state .big{
    font-weight:700;
    font-size:20px;
    color:var(--text);
    display:block;
    margin-bottom:8px;
  }

  /* ---- History view ---- */
  .history-item{
    background:var(--card);
    border-radius:var(--radius);
    padding:15px 16px;
    margin-bottom:10px;
  }
  .history-head{
    display:flex;

<script>
/* ---------------- PROGRAM DATA ---------------- */
const DEFAULT_PROGRAM = {
  A: {
    label: 'Leg Day',
    exercises: [
      { name:'Leg Press', sets:4, reps:'8-10', injury:'tailbone', note:'Moderate angle (not too reclined). Stop the range of motion if it bothers your tailbone.' },

  },

      { name:'Dumbbell Military Press', sets:4, reps:'6-8' },
      { name:'Chest-Supported Row', sets:4, reps:'8-10' },
      { name:'Leg Curl', sets:3, reps:'10-12', injury:'adductor', note:'Isolated, safe for the adductor while it heals.' },
      { name:'Bicep Curl', sets:3, reps:'10-12' },
      { name:'Tricep Pushdown', sets:3, reps:'10-12' },
    ]
  },
  C: {
    label: 'Finisher',
    exercises: [
      { name:'Incline Dumbbell Press', sets:4, reps:'8-10' },
      { name:'Pull-up', sets:4, reps:'8-10', note:'Add extra weight if you can do more than 10-12 clean reps, or use an assistance band if you can\'t reach 8-10.' },
      { name:'Adductor Machine', sets:3, reps:'12-15', injury:'adductor', note:'Left side only, or very light load on the right — only if authorized by your physical therapist.' },
      { name:'Face Pull', sets:3, reps:'12-15' },
    ]
  }
};

const STORAGE_KEY = 'rack-sessions';
const PROGRAM_KEY = 'rack-program';
const METRIC_KEY = 'rack-progress-metric';
const DELOAD_BANNER_KEY = 'rack-deload-banner-dismissed';

// Stall detection thresholds (tune here).
const STALL_WINDOW_DAYS = 21;           // recent window the stall is judged on
const STALL_MIN_SESSIONS = 3;           // sessions needed in the window (and after "I changed something")
const STALL_MIN_GAIN = 0.01;            // window best must beat the earlier best by at least 1%
const REGRESSION_DROP = 0.05;           // last session >5% under the window best (after 3 straight drops)
const STALL_PAUSE_DAYS = 14;            // a longer gap restarts the window after it
const STALL_GENERAL_SHARE = 0.5;        // share of eligible lifts stalled/regressing for a program-wide alert
const STALL_GENERAL_MIN_EXERCISES = 3;  // minimum eligible lifts before a program-wide alert

// Body composition (Renpho import).
const BODY_KEY = 'rack-body';
const PREV_BODY_KEY = 'rack-body-prev';
const PROGRESS_SECTION_KEY = 'rack-progress-section';
const BODY_MA_DAYS = 7;                 // moving-average window in calendar days
const BODY_MA_MIN_POINTS = 3;           // daily values needed in the window for an average point
const BODY_CHANGE_DAYS = 28;            // "vs 4 weeks ago" on the moving average
const BODY_CHANGE_TOLERANCE_DAYS = 3;   // how far before that date a reference point may be
const BODY_RANGE_DAYS = 90;             // default chart range ("90d")
const STRENGTH_MIN_SESSIONS = 3;        // lifts needed in the strength index
const STRENGTH_CARRY_WEEKS = 4;         // weeks a lift's last e1RM is carried forward before it drops out

// Recomposition verdict (impedance scales are noisy: changes under a threshold count as "stable").
const RECOMP_WINDOW_DAYS = 28;          // compare today with 4 weeks ago
const RECOMP_MIN_WEIGH_IN_DAYS = 10;    // days with a weigh-in needed in that window
const RECOMP_FAT_THRESHOLD = 0.3;       // kg of fat mass
const RECOMP_MUSCLE_THRESHOLD = 0.3;    // kg of skeletal muscle
const RECOMP_STRENGTH_THRESHOLD = 2;    // strength-index points
const REL_BW_TOLERANCE_DAYS = 3;

// Backup reminder (these keys are device-local: never exported in a backup, never overwritten by an import).
const LAST_BACKUP_KEY = 'rack-last-backup';
const LAST_CHANGE_KEY = 'rack-last-change';
const BACKUP_SNOOZE_KEY = 'rack-backup-snooze';
const BACKUP_REMINDER_DAYS = 7;         // remind when the last backup is older than this and data changed since
const BACKUP_SNOOZE_HOURS = 24;         // "Later"        // relative strength: nearest weigh-in allowed when no 7-day average

// Chart metrics; bodyweight exercises (no load ever logged) fall back to rep counts.
const METRICS = {
  e1rm:   { title:'estimated 1RM per session', value: sets=> roundHalf(bestE1RM(sets)),
            bwTitle:'max reps per session',     bwValue: maxReps },
  volume: { title:'total volume per session',  value: sets=> Math.round(totalVolume(sets)),
            bwTitle:'total reps per session',   bwValue: totalReps },
  max:    { title:'max load per session',      value: maxWeight,
            bwTitle:'max reps per session',     bwValue: maxReps },
  // value(sets, session): best e1RM / body weight on the session's date; bodyweight lifts have no value.
  rel:    { title:'relative strength per session (× BW)',
            value: (sets, session)=>{ const r = relativeStrength(sets, session.date, bodyDaily()); return r == null ? 0 : Math.round(r * 100) / 100; },
            bwTitle:'relative strength', bwValue: ()=> 0 }
};

/* ---------------- LAST SESSION LOOKUP ---------------- */
function getLastSession(day, exerciseName){
  const past = sessions
    .filter(s=>s.day===day)
    .sort((a,b)=> new Date(b.date) - new Date(a.date));
  for(const s of past){
    const ex = s.exercises.find(e=>e.name===exerciseName);
    if(ex && ex.sets.some(st=>st.weight)) return { session:s, ex };
  }
  return null;
}

function maxWeight(sets){
  return sets.reduce((m,s)=> Math.max(m, parseFloat(s.weight)||0), 0);
}

function num(v){
  const n = parseFloat(v);
  return n > 0 ? n : 0;
}

// Sets with both a load and reps; empty or zero entries are ignored.
function validSets(sets){
  return sets.filter(s=> num(s.weight) > 0 && num(s.reps) > 0);
}

// Epley: weight × (1 + reps/30); a single rep is the weight itself.
function bestE1RM(sets){
  return validSets(sets).reduce((best, s)=>{
    const w = num(s.weight), r = num(s.reps);
    return Math.max(best, r === 1 ? w : w * (1 + r/30));
  }, 0);
}

function totalVolume(sets){
  return validSets(sets).reduce((sum, s)=> sum + num(s.weight) * num(s.reps), 0);
}

function maxReps(sets){
  return sets.reduce((m,s)=> Math.max(m, num(s.reps)), 0);
}

function totalReps(sets){
  return sets.reduce((t,s)=> t + num(s.reps), 0);
}

function round1(v){ return Math.round(v*10)/10; }
function roundHalf(v){ return Math.round(v*2)/2; }

// Bodyweight = reps logged but never any load, across history (plus optional unsaved sets).
function isBodyweight(exerciseName, excludeIndex, extraSets = []){
  const all = [...extraSets];
  sessions.forEach((s, idx)=>{
    if(idx === excludeIndex) return;
    const ex = s.exercises.find(e=>e.name===exerciseName);
    if(ex) all.push(...ex.sets);
  });
  return all.some(s=> num(s.reps) > 0) && !all.some(s=> num(s.weight) > 0);
}

// Value a PR is judged on: e1RM, or max reps for bodyweight exercises.
function prScore(sets, bodyweight){
  return bodyweight ? maxReps(sets) : round1(bestE1RM(sets));
}

function getAllTimeBest(exerciseName, excludeIndex){
  const best = { e1rm:0, max:0, reps:0 };
  sessions.forEach((s, idx)=>{
    if(idx === excludeIndex) return;
    const ex = s.exercises.find(e=>e.name===exerciseName);
    if(ex){
      best.e1rm = Math.max(best.e1rm, bestE1RM(ex.sets));
      best.max = Math.max(best.max, maxWeight(ex.sets));
      best.reps = Math.max(best.reps, maxReps(ex.sets));
    }
  });
  return best;
}

// Re-derives every stored isPR flag in chronological order. Returns true if any flag changed.
function recomputePRs(){
  const order = sessions.map((s, idx)=> idx)
    .sort((a,b)=> (new Date(sessions[a].date) - new Date(sessions[b].date)) || a - b);
  const best = {};
  const bwCache = {};
  let changed = false;
  order.forEach(idx=>{
    sessions[idx].exercises.forEach(ex=>{
      if(!(ex.name in bwCache)) bwCache[ex.name] = isBodyweight(ex.name);
      const score = prScore(ex.sets, bwCache[ex.name]);
      const isPR = score > 0 && score > (best[ex.name] || 0);
      if(isPR) best[ex.name] = score;
      if(!!ex.isPR !== isPR){ ex.isPR = isPR; changed = true; }
    });
  });
  return changed;
}

/* ---------------- PROGRESSION SUGGESTION (double progression) ---------------- */
const DEFAULT_INCREMENT = 2.5;
const DELOAD_FACTOR = 0.925;  // ~7.5% lighter after two sessions below the range

// "8-10", "8–10", "8 - 10 reps" → {min:8, max:10}; "10" → {min:10, max:10}; no number → null.
function parseRepRange(reps){
  const nums = String(reps == null ? '' : reps).match(/\d+/g);
  if(!nums) return null;
  const a = parseInt(nums[0]), b = nums.length > 1 ? parseInt(nums[1]) : a;
  if(!(a > 0) || !(b > 0)) return null;
  return { min: Math.min(a, b), max: Math.max(a, b) };
}

// Nearest multiple of inc, without float noise (32.4999 → 32.5).
function roundToIncrement(w, inc){
  return Math.round(Math.round(w / inc) * inc * 100) / 100;
}

// Sets usable for progression. Bodyweight = no set with a load: reps alone are enough.
function progressionSets(sets){
  const list = (sets || []).map(s=> ({ weight: num(s.weight), reps: num(s.reps) })).filter(s=> s.reps > 0);
  const weighted = list.filter(s=> s.weight > 0);
  return weighted.length ? { sets: weighted, bodyweight: false } : { sets: list, bodyweight: true };
}

// Pure: per-set targets for today from the last (and previous) session's sets.
// Result is shaped for reuse (e.g. prefilling inputs): sets[i] = { weight, reps, change, weightDelta, repsDelta, from }.
function suggestProgression(exercise, lastSessionSets, previousSessionSets){
  const range = parseRepRange(exercise.reps);
  const increment = num(exercise.increment) || DEFAULT_INCREMENT;
  const last = progressionSets(lastSessionSets);
  if(last.sets.length === 0) return { status:'first', range, increment, bodyweight:false, topOfRange:false, sets:[] };

  const bodyweight = last.bodyweight;
  const prev = progressionSets(previousSessionSets).sets;
  const planned = parseInt(exercise.sets);
  const count = planned > 0 ? planned : last.sets.length;
  // Extra planned sets repeat the last recorded set; surplus recorded sets are ignored.
  const srcIdx = i=> Math.min(i, last.sets.length - 1);

  const make = (src, weight, reps)=> ({
    weight: bodyweight ? null : weight,
    reps,
    change: bodyweight || weight === src.weight ? 'same' : weight > src.weight ? 'up' : 'down',
    weightDelta: bodyweight ? 0 : round1(weight - src.weight),
    repsDelta: reps - src.reps,
    from: { weight: bodyweight ? null : src.weight, reps: src.reps }
  });

  const sets = [];
  let topOfRange = false;
  if(!range){
    // No range: +1 rep on the weakest set only.
    const reps = Array.from({ length: count }, (_, i)=> last.sets[srcIdx(i)].reps);
    const weakest = reps.indexOf(Math.min(...reps));
    for(let i = 0; i < count; i++){
      const s = last.sets[srcIdx(i)];
      sets.push(make(s, s.weight, s.reps + (i === weakest ? 1 : 0)));
    }
  } else {
    for(let i = 0; i < count; i++){
      const s = last.sets[srcIdx(i)];
      const p = prev[srcIdx(i)];
      if(bodyweight){
        // Reps only, past the top of the range too.
        if(s.reps >= range.max) topOfRange = true;
        sets.push(make(s, 0, s.reps < range.min ? range.min : s.reps + 1));
      } else if(s.reps >= range.max){
        sets.push(make(s, roundToIncrement(s.weight + increment, increment), range.min));
      } else if(s.reps >= range.min){
        sets.push(make(s, s.weight, Math.min(range.max, s.reps + 1)));
      } else {
        // Below the range twice in a row at this weight (or heavier before): back off.
        let weight = s.weight;
        if(p && p.reps < range.min && p.weight >= s.weight){
          weight = roundToIncrement(s.weight * DELOAD_FACTOR, increment);
          if(weight >= s.weight) weight = roundToIncrement(s.weight - increment, increment);
          if(weight <= 0) weight = s.weight;
        }
        sets.push(make(s, weight, range.min));
      }
    }
  }
  return { status:'progress', range, increment, bodyweight, topOfRange, sets };
}

// [1,2,3,5] → "sets 1–3, 5"; [2] → "set 2".
function formatSetList(indexes){
  const parts = [];
  for(let i = 0; i < indexes.length; i++){
    let j = i;
    while(j + 1 < indexes.length && indexes[j+1] === indexes[j] + 1) j++;
    parts.push(j > i ? `${indexes[i]}–${indexes[j]}` : `${indexes[i]}`);
    i = j;
  }
  return (indexes.length === 1 ? 'set ' : 'sets ') + parts.join(', ');
}

function formatProgressionSummary(sug){
  if(sug.status !== 'progress') return '';
  const groups = new Map();
  sug.sets.forEach((s, i)=>{
    let label = null;
    if(s.change === 'up') label = `↑ +${fmtNum(s.weightDelta)} kg`;
    else if(s.change === 'down') label = `↓ −${fmtNum(-s.weightDelta)} kg`;
    else if(s.repsDelta > 0) label = `+${s.repsDelta} rep${s.repsDelta === 1 ? '' : 's'}`;
    if(!label) return;
    if(!groups.has(label)) groups.set(label, []);
    groups.get(label).push(i + 1);
  });
  const parts = [...groups].map(([label, idx])=> `${label} on ${formatSetList(idx)}`);
  if(parts.length === 0) parts.push('Repeat last session');
  if(sug.topOfRange) parts.push('top of range — consider adding load');
  return parts.join(' · ');
}

// Sets of the two most recent sessions (any day) with usable sets for this exercise.
function findExerciseHistory(name){
  const found = [];
  const sorted = [...sessions].sort((a,b)=> new Date(b.date) - new Date(a.date));
  for(const s of sorted){
    const ex = s.exercises.find(e=> e.name === name);
    if(ex && progressionSets(ex.sets).sets.length){
      found.push(ex.sets);
      if(found.length === 2) break;
    }
  }
  return found;
}

function renderSuggestionHtml(sug){
  if(sug.status === 'first'){
    const target = sug.range ? `for ${sug.range.min} reps` : 'with good form';
    return `<div class="last-time suggest-line">First time — pick a weight you can do ${target}</div>`;
  }
  const targets = sug.sets
    .map(s=> `<span class="sug-set ${s.change}">${s.weight == null ? 'BW' : fmtNum(s.weight)}×${s.reps}</span>`)
    .join(' · ');
  return `<div class="last-time suggest-line">Today: ${targets}<div class="suggest-summary">${formatProgressionSummary(sug)}</div></div>`;
}

/* ---------------- STALL DETECTION ---------------- */
const DAY_MS = 86400000;

// Per-session metric for an exercise, oldest first: best e1RM, or max reps if no load was ever logged.
function stallSeries(exerciseName, sessionList){
  const logs = sessionList
    .map(s=> ({ date: new Date(s.date), ex: s.exercises.find(e=> e.name === exerciseName) }))
    .filter(p=> p.ex && !isNaN(p.date));
  const bodyweight = logs.some(p=> p.ex.sets.some(st=> num(st.reps) > 0))
    && !logs.some(p=> p.ex.sets.some(st=> num(st.weight) > 0));
  const series = logs
    .map(p=> ({ date: p.date, value: bodyweight ? maxReps(p.ex.sets) : bestE1RM(p.ex.sets) }))
    .filter(p=> p.value > 0)
    .sort((a,b)=> a.date - b.date);
  return { bodyweight, series };
}

// Pure. status: 'ok' | 'stalled' | 'regressing' | 'insufficient' (not enough data) | 'silenced'.
function detectStall(exerciseName, sessionList, options = {}){
  const now = options.now ? new Date(options.now) : new Date();
  const { bodyweight, series } = stallSeries(exerciseName, sessionList);
  const pts = series.filter(p=> p.date <= now);
  const base = { status:'insufficient', bodyweight, weeks:0, best:null, windowBest:null, sessionsSinceBest:0, recent:[] };

  let windowStart = new Date(now - STALL_WINDOW_DAYS * DAY_MS);
  // A long pause inside the window restarts it at the first session after the pause.
  for(let i = 1; i < pts.length; i++){
    if(pts[i].date - pts[i-1].date > STALL_PAUSE_DAYS * DAY_MS && pts[i].date > windowStart) windowStart = pts[i].date;
  }
  // "I changed something": quiet until enough new sessions, then judged on those sessions only.
  const ack = options.stallAck ? new Date(options.stallAck) : null;
  if(ack && !isNaN(ack)){
    const afterAck = pts.filter(p=> p.date > ack);
    if(afterAck.length < STALL_MIN_SESSIONS) return { ...base, status:'silenced' };
    if(afterAck[0].date > windowStart) windowStart = afterAck[0].date;
  }

  const inWindow = pts.filter(p=> p.date >= windowStart);
  const before = pts.filter(p=> p.date < windowStart);
  if(inWindow.length < STALL_MIN_SESSIONS || before.length === 0) return base;

  const bestBefore = before.reduce((b, p)=> p.value > b.value ? p : b);  // earliest date reaching the best
  const windowBest = Math.max(...inWindow.map(p=> p.value));
  const recent = inWindow.slice(-3).map(p=> p.value);
  const result = {
    ...base,
    best: { value: bestBefore.value, date: bestBefore.date },
    windowBest,
    recent,
    sessionsSinceBest: pts.filter(p=> p.date > bestBefore.date).length
  };

  const [a, b, c] = recent;
  if(a > b && b > c && c < windowBest * (1 - REGRESSION_DROP)) return { ...result, status:'regressing' };
  if(windowBest < bestBefore.value * (1 + STALL_MIN_GAIN)){
    // Calendar days, so the time of day of the best session does not shave off a week.
    const dayStart = d=>{ const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
    const days = Math.round((dayStart(now) - dayStart(bestBefore.date)) / DAY_MS);
    const weeks = Math.max(1, Math.floor(days / 7));
    return { ...result, status:'stalled', weeks };
  }
  return { ...result, status:'ok' };
}

// Latest "I changed something" date for an exercise name across all program days.
function programStallAck(program, name){
  let ack = null;
  Object.values(program).forEach(d=> d.exercises.forEach(e=>{
    if(e.name === name && e.stallAck && (!ack || new Date(e.stallAck) > new Date(ack))) ack = e.stallAck;
  }));
  return ack;
}

function stallFor(name, now){
  return detectStall(name, sessions, { now, stallAck: programStallAck(PROGRAM, name) });
}

// Program-wide stall: enough eligible lifts and at least STALL_GENERAL_SHARE of them stuck.
function detectGeneralStall(program, sessionList, now){
  const names = [];
  Object.values(program).forEach(d=> d.exercises.forEach(e=>{ if(!names.includes(e.name)) names.push(e.name); }));
  let eligible = 0, stuck = 0;
  names.forEach(n=>{
    const r = detectStall(n, sessionList, { now, stallAck: programStallAck(program, n) });
    if(r.status === 'insufficient') return;
    eligible++;  // silenced lifts count as eligible but not stuck
    if(r.status === 'stalled' || r.status === 'regressing') stuck++;
  });
  return { general: eligible >= STALL_GENERAL_MIN_EXERCISES && stuck >= eligible * STALL_GENERAL_SHARE, eligible, stuck };
}

function stallStatusLabel(r){
  if(r.status === 'stalled') return `Stalled ${r.weeks} wk`;
  if(r.status === 'regressing') return 'Regressing';
  if(r.status === 'ok') return 'OK';
  if(r.status === 'silenced') return 'Alert paused';
  return '—';
}

// Panel text: injury warning (if tagged), data line and ordered tips.
function stallAdvice(r, exercise){
  const unit = v=> r.bodyweight ? `${v} reps` : `${roundHalf(v)} kg`;
  const metric = r.bodyweight ? 'Best' : 'Best e1RM';
  const sessionsTxt = n=> `${n} session${n === 1 ? '' : 's'}`;
  let dataLine = '';
  const tips = [];
  const warning = exercise && exercise.injury ? 'Check for pain or discomfort — consider a variant' : '';
  const deload = 'Deload week: same exercises, about half the sets, −10% weight';
  if(r.status === 'regressing'){
    const drop = round1((1 - r.recent[2] / r.windowBest) * 100);
    const label = r.bodyweight ? 'max reps' : 'kg e1RM';
    dataLine = `Last 3 sessions: ${r.recent.map(v=> r.bodyweight ? v : roundHalf(v)).join(' → ')} ${label}, ${drop}% below recent best`;
    tips.push('Check sleep, nutrition and recovery first', `Then a ${deload.charAt(0).toLowerCase()}${deload.slice(1)}`);
  } else if(r.status === 'stalled'){
    dataLine = `${metric} ${unit(r.best.value)} on ${isoDate(r.best.date)}, no improvement in ${sessionsTxt(r.sessionsSinceBest)}`;
    const range = parseRepRange(exercise && exercise.reps);
    const alt = range && range.max <= 6 ? '8–10' : '5–6';
    const rangeTip = range
      ? `Change the rep range for a block (e.g. from ${range.min === range.max ? range.min : `${range.min}–${range.max}`} to ${alt})`
      : 'Change the rep range for a block (e.g. from 8–10 to 5–6)';
    tips.push(deload, rangeTip, 'Switch to a variant of the same movement');
  }
  return { warning, dataLine, tips };
}

function stallBadgeHtml(r, interactive){
  if(r.status !== 'stalled' && r.status !== 'regressing') return '';
  const cls = `stall-badge ${r.status}`;
  const text = r.status === 'stalled' ? `Stalled · ${r.weeks} wk` : '↘ Regressing';
  return interactive
    ? `<button type="button" class="${cls}" aria-expanded="false">${text}</button>`
    : `<span class="${cls}">${text}</span>`;
}

function stallPanelHtml(r, exercise){
  const { warning, dataLine, tips } = stallAdvice(r, exercise);
  return `
    <div class="stall-panel" hidden>
      ${warning ? `<div class="stall-injury">⚠ ${warning}</div>` : ''}
      <div class="stall-data">${dataLine}</div>
      <ol>${tips.map(t=> `<li>${t}</li>`).join('')}</ol>
      <button type="button" class="stall-ack-btn">I changed something</button>
    </div>`;
}

// Silences the alert for every program entry with this name (the analysis is by name).
function ackStall(name){
  const iso = new Date().toISOString();
  Object.values(PROGRAM).forEach(d=> d.exercises.forEach(e=>{ if(e.name === name) e.stallAck = iso; }));
  persistProgram();
}

// Shown until the next saved workout (keyed by the latest session date) once dismissed.
function latestSessionStamp(){
  return sessions.reduce((m, s)=> (!m || new Date(s.date) > new Date(m)) ? s.date : m, '');
}

function renderStallBanner(){
  const el = document.getElementById('stallBanner');
  if(!el) return;
  let dismissed = null;
  try{ dismissed = localStorage.getItem(DELOAD_BANNER_KEY); }catch(e){}
  const show = editingIndex === null
    && dismissed !== latestSessionStamp()
    && detectGeneralStall(PROGRAM, sessions).general;
  el.style.display = show ? 'flex' : 'none';
}

function dismissStallBanner(){
  try{ localStorage.setItem(DELOAD_BANNER_KEY, latestSessionStamp()); }catch(e){}
  renderStallBanner();
}

/* ---------------- SET INPUTS: suggested placeholders + ✓ confirm ---------------- */
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12.5 10 17.5 19 7.5"/></svg>';

// Today's target for set i as placeholder text; generic hints when there is no suggestion.
function setPlaceholders(sug, i){
  const s = sug && sug.status === 'progress' ? sug.sets[i] : null;
  if(!s) return { weight:'kg', reps:'reps' };
  return { weight: s.weight == null ? 'BW' : fmtNum(s.weight), reps: String(s.reps) };
}

// ✓ fills only the empty fields from the target (typed values win; bodyweight copies reps only).
// The set counts as done once it holds a real value, so a second tap changes nothing.
function confirmSetValues(current, target){
  const next = { weight: current.weight, reps: current.reps };
  if(target){
    if(next.weight === '' && target.weight != null) next.weight = String(target.weight);
    if(next.reps === '') next.reps = String(target.reps);
  }
  next.done = next.weight !== '' || next.reps !== '';
  return next;
}

// Only real input values are saved; placeholders never reach this point.
function readSetsFromInputs(weights, reps){
  return weights.map((w, i)=> ({
    weight: w ? parseFloat(w) : null,
    reps: reps[i] ? parseInt(reps[i]) : null
  }));
}

// 'weighted' | 'bodyweight' | 'unknown' (no usable history yet: may be either).
function exerciseLoadMode(history){
  if(!history.length) return 'unknown';
  return progressionSets(history[0]).bodyweight ? 'bodyweight' : 'weighted';
}

// Sets with one field filled and the other still empty. Bodyweight sets only need reps, and a
// missing weight is only flagged when the exercise is known to be loaded.
function countIncompleteSets(sets, mode){
  let missingReps = 0, missingWeight = 0;
  sets.forEach(s=>{
    const hasW = num(s.weight) > 0, hasR = num(s.reps) > 0;
    if(hasW && !hasR) missingReps++;
    else if(hasR && !hasW && mode === 'weighted') missingWeight++;
  });
  return { missingReps, missingWeight };
}

// When editing a past session, only sets changed in this edit are checked: sets that were already
// incomplete in the original save stay as they were without a prompt. No original → all sets.
function changedSets(sets, originalSets){
  if(!originalSets) return sets;
  const same = (a, b)=> (a == null ? null : Number(a)) === (b == null ? null : Number(b));
  return sets.filter((s, i)=>{
    const o = originalSets[i] || {};
    return !(same(s.weight, o.weight) && same(s.reps, o.reps));
  });
}

function incompleteSetsMessage(missingReps, missingWeight){
  const part = (n, what)=> `${n} set${n === 1 ? ' has' : 's have'} missing ${what}`;
  const parts = [];
  if(missingReps) parts.push(part(missingReps, 'reps'));
  if(missingWeight) parts.push(part(missingWeight, 'weight'));
  return parts.length ? `${parts.join(' and ')} — save anyway?` : '';
}

// Editing a past session: saved values, generic placeholders, no ✓ column.
function buildSetRowsHtml(ex, sug, editing, editingExercise){
  let rows = '';
  for(let i = 0; i < ex.sets; i++){
    const prefill = editingExercise && editingExercise.sets[i] ? editingExercise.sets[i] : null;
    const wVal = prefill && prefill.weight != null ? ` value="${prefill.weight}"` : '';
    const rVal = prefill && prefill.reps != null ? ` value="${prefill.reps}"` : '';
    const ph = editing ? { weight:'kg', reps:'reps' } : setPlaceholders(sug, i);
    const doneCell = editing ? '' :
      `<td class="done-cell"><button type="button" class="set-done-btn" data-set="${i}" aria-label="Confirm set ${i+1}" aria-pressed="false">${CHECK_SVG}</button></td>`;
    rows += `
        <tr class="set-row">
          <td class="set-num">${i+1}</td>
          <td><input type="number" inputmode="decimal" class="w-input" placeholder="${ph.weight}" data-set="${i}" min="0" step="0.5"${wVal}></td>
          <td><input type="number" inputmode="numeric" class="r-input" placeholder="${ph.reps}" data-set="${i}" min="0"${rVal}></td>
          ${doneCell}
        </tr>`;
  }
  const head = `<tr><th class="num">Set</th><th>Weight</th><th>Reps</th>${editing ? '' : '<th></th>'}</tr>`;
  return { head, rows };
}

/* ---------------- EXERCISE LIST (LOG VIEW) ---------------- */
function renderExercises(){
  const container = document.getElementById('exerciseList');
  container.innerHTML = '';
  document.getElementById('savedMsg').textContent = '';

  const editingSession = editingIndex !== null ? sessions[editingIndex] : null;

  PROGRAM[currentDay].exercises.forEach((ex, exIdx)=>{
    const card = document.createElement('div');
    card.className = 'exercise-card';
    card.dataset.exIdx = exIdx;

    const last = getLastSession(currentDay, ex.name);
    let lastHtml = '';
    if(last){
      const w = maxWeight(last.ex.sets);
      const dateStr = new Date(last.session.date).toLocaleDateString('en-US',{day:'numeric',month:'short'});
      lastHtml = `<div class="last-time">Last time (${dateStr}): <b>${w} kg</b> × ${last.ex.sets.length} sets</div>`;
    } else {
      lastHtml = `<div class="last-time">First time logging this exercise</div>`;
    }

    const best = getAllTimeBest(ex.name, editingIndex);
    const recordParts = [];
    if(isBodyweight(ex.name, editingIndex)){
      if(best.reps > 0) recordParts.push(`Best <b>${best.reps} reps</b>`);
    } else {
      if(best.e1rm > 0) recordParts.push(`Best e1RM <b>${roundHalf(best.e1rm)} kg</b>`);
      if(best.max > 0) recordParts.push(`max <b>${best.max} kg</b>`);
    }
    const recordHtml = recordParts.length ? `<div class="last-time record-line">${recordParts.join(' · ')}</div>` : '';

    // One suggestion per exercise feeds both the "Today" line and the set placeholders.
    // A suggestion for today makes no sense while correcting a past session.
    const history = findExerciseHistory(ex.name);
    const sug = editingSession ? null : suggestProgression(ex, history[0], history[1]);
    const suggestionHtml = sug ? renderSuggestionHtml(sug) : '';
    card.dataset.loadMode = exerciseLoadMode(history);

    const editingExercise = editingSession ? editingSession.exercises.find(e=>e.name===ex.name) : null;
    const setRows = buildSetRowsHtml(ex, sug, !!editingSession, editingExercise);

    // Stall badge + advice panel (not while correcting a past session).
    const stall = editingSession ? null : stallFor(ex.name);
    const stallBadge = stall ? stallBadgeHtml(stall, true) : '';
    const stallPanel = stallBadge ? stallPanelHtml(stall, ex) : '';

    card.innerHTML = `
      <div class="exercise-head">
        <div>
          <p class="exercise-name">${ex.name}${stallBadge}</p>
          <div class="exercise-target">Target: ${ex.sets} × ${ex.reps}</div>
        </div>
        ${ex.injury ? `<span class="injury-badge">⚠ ${ex.injury}</span>` : ''}
      </div>
      ${stallPanel}
      ${lastHtml}
      ${suggestionHtml}
      ${recordHtml}
      <table class="sets-table">
        <thead>${setRows.head}</thead>
        <tbody>${setRows.rows}</tbody>
      </table>
      <div class="plate-load" id="load-${exIdx}"></div>
      ${ex.note ? `<div class="note-row">${ex.note}</div>` : ''}
    `;

    container.appendChild(card);

    const inputs = card.querySelectorAll('.w-input, .r-input');
    const loadBar = card.querySelector(`#load-${exIdx}`);
    for(let i=0;i<ex.sets;i++){
      const seg = document.createElement('div');
      seg.className = 'plate-seg';
      loadBar.appendChild(seg);
    }
    const wInputs = card.querySelectorAll('.w-input');
    const rInputs = card.querySelectorAll('.r-input');
    const setRowEls = card.querySelectorAll('.set-row');
    function updateLoad(){
      const segs = loadBar.querySelectorAll('.plate-seg');
      wInputs.forEach((inp, i)=>{
        const loaded = !!inp.value && parseFloat(inp.value) > 0;
        segs[i].classList.toggle('filled', loaded || setRowEls[i].classList.contains('done'));
      });
    }
    // Also used by restoreTodayInputs() to bring back confirmed sets after a reorder.
    card._setDone = (i, done)=>{
      if(!setRowEls[i]) return;
      setRowEls[i].classList.toggle('done', done);
      const btn = setRowEls[i].querySelector('.set-done-btn');
      if(btn) btn.setAttribute('aria-pressed', done ? 'true' : 'false');
      updateLoad();
    };
    inputs.forEach(inp=> inp.addEventListener('input', ()=>{
      const i = parseInt(inp.dataset.set);
      // Emptying both fields of a confirmed set makes it "to do" again.
      if(!wInputs[i].value && !rInputs[i].value && setRowEls[i].classList.contains('done')) card._setDone(i, false);
      updateLoad();
    }));
    card.querySelectorAll('.set-done-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = parseInt(btn.dataset.set);
        const target = sug && sug.status === 'progress' ? sug.sets[i] : null;
        const next = confirmSetValues({ weight: wInputs[i].value, reps: rInputs[i].value }, target);
        wInputs[i].value = next.weight;
        rInputs[i].value = next.reps;
        card._setDone(i, next.done);
      });
    });
    updateLoad();

    const badgeBtn = card.querySelector('.stall-badge');
    if(badgeBtn){
      const panel = card.querySelector('.stall-panel');
      badgeBtn.addEventListener('click', ()=>{
        panel.hidden = !panel.hidden;
        badgeBtn.setAttribute('aria-expanded', panel.hidden ? 'false' : 'true');
      });
      // Remove badge and panel in place: re-rendering Today would wipe values being entered.
      panel.querySelector('.stall-ack-btn').addEventListener('click', ()=>{
        ackStall(ex.name);
        badgeBtn.remove();
        panel.remove();
        renderStallBanner();
        showToast(`Alert paused for ${STALL_MIN_SESSIONS} sessions`);
      });
    }
  });

  renderBackupReminder();
  renderStallBanner();

  const noteVal = editingSession && editingSession.note ? editingSession.note : '';
  document.getElementById('sessionNote').value = noteVal;
  document.getElementById('noteFieldWrap').style.display = noteVal ? 'block' : 'none';
  document.getElementById('noteToggleBtn').style.display = noteVal ? 'none' : 'block';

  const banner = document.getElementById('editBanner');
  if(editingSession){
    const dateStr = new Date(editingSession.date).toLocaleDateString('en-US',{day:'numeric',month:'long'});
    document.getElementById('editBannerText').textContent = `Editing session from ${dateStr}`;
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }
}

/* ---------------- SAVE SESSION ---------------- */
async function saveSession(){
  const cards = document.querySelectorAll('.exercise-card');
  const exercises = [];
  let anyData = false;
  let missingReps = 0, missingWeight = 0;

  cards.forEach(card=>{
    const exIdx = parseInt(card.dataset.exIdx);
    const exDef = PROGRAM[currentDay].exercises[exIdx];
    const sets = readSetsFromInputs(
      [...card.querySelectorAll('.w-input')].map(i=> i.value),
      [...card.querySelectorAll('.r-input')].map(i=> i.value)
    );
    if(sets.some(s=> s.weight || s.reps)) anyData = true;
    const originalSets = editingIndex !== null
      ? ((sessions[editingIndex].exercises.find(e=> e.name === exDef.name) || {}).sets || [])
      : null;
    const incomplete = countIncompleteSets(changedSets(sets, originalSets), card.dataset.loadMode);
    missingReps += incomplete.missingReps;
    missingWeight += incomplete.missingWeight;
    // isPR is filled in by recomputePRs() once the session is stored.
    exercises.push({ name: exDef.name, sets, isPR: false });
  });

  if(!anyData){
    const msg = document.getElementById('savedMsg');
    msg.style.color = 'var(--warn)';
    msg.textContent = 'Enter at least one weight or rep before saving';
    setTimeout(()=>{ msg.textContent=''; msg.style.color='var(--mint)'; }, 2500);
    return;
  }

  // Half-filled sets (the other field still only shows a placeholder): Cancel goes back to finish them.
  const incompleteMsg = incompleteSetsMessage(missingReps, missingWeight);
  if(incompleteMsg && !confirm(incompleteMsg)) return;

  const note = document.getElementById('sessionNote').value.trim();

  if(editingIndex !== null){
    sessions[editingIndex] = {
      date: sessions[editingIndex].date,
      day: currentDay,
      exercises,
      note
    };
    editingIndex = null;
  } else {
    sessions.push({
      date: new Date().toISOString(),
      day: currentDay,
      exercises,
      note
    });
  }

  // Editing an older session can shift records in later ones, so re-derive them all.
  recomputePRs();
  const hasPR = exercises.some(e=>e.isPR);
  await persistSessions();

  document.getElementById('savedMsg').style.color = 'var(--mint)';
  document.getElementById('savedMsg').textContent = hasPR ? '✓ Session saved — 🏆 new record!' : '✓ Session saved';
  document.getElementById('sessionNote').value = '';
  document.getElementById('editBanner').style.display = 'none';
  renderDayRack();
  renderExercises();
  setTimeout(()=>{ document.getElementById('savedMsg').textContent=''; }, 3000);
}
